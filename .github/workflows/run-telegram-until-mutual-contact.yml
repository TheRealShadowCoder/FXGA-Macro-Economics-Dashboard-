name: Run FXGA Telegram Until Mutual Contact

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-telegram-until-mutual-contact.trigger'

concurrency:
  group: fxga-telegram-until-mutual-contact
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: fxglobalavengerstradingacademy
  GCP_REGION: us-central1
  JOB_NAME: fxga-telegram-member-agent
  PREFLIGHT_JOB: fxga-telegram-member-agent-preflight
  SCHEDULER_NAME: fxga-telegram-member-agent-daily
  DEPLOY_SERVICE_ACCOUNT: fxga-github-deployer@fxglobalavengerstradingacademy.iam.gserviceaccount.com
  FIRESTORE_STATE_COLLECTION: agent_state
  FIRESTORE_STATE_DOCUMENT: telegram-member-agent
  DAILY_HARD_MAX: '50'
  RUN_SUCCESS_LIMIT: '10'
  MAX_SINGLE_USER_EXECUTIONS: '40'

jobs:
  guarded-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - id: auth-config
        name: Resolve Google authentication
        env:
          WIF_PROVIDER_SECRET: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_PROVIDER_VAR: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          set -euo pipefail
          WIF_PROVIDER="${WIF_PROVIDER_SECRET:-$WIF_PROVIDER_VAR}"
          test -n "$WIF_PROVIDER" || { echo '::error::GCP_WIF_PROVIDER is missing'; exit 1; }
          echo "wif_provider=$WIF_PROVIDER" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.auth-config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Prepare guarded controller
        working-directory: agents/telegram-member-agent
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID"
          npm install --omit=dev --no-audit --no-fund
          gcloud run jobs describe "$JOB_NAME" --region "$GCP_REGION" --format='value(metadata.name)' >/dev/null
          gcloud run jobs describe "$PREFLIGHT_JOB" --region "$GCP_REGION" --format='value(metadata.name)' >/dev/null
          gcloud scheduler jobs describe "$SCHEDULER_NAME" --location "$GCP_REGION" --format='value(name)' >/dev/null

      - id: gate
        name: Honor only explicit Telegram timed waits
        working-directory: agents/telegram-member-agent
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { Firestore, FieldValue } from '@google-cloud/firestore';
          const db = new Firestore();
          const ref = db.collection(process.env.FIRESTORE_STATE_COLLECTION).doc(process.env.FIRESTORE_STATE_DOCUMENT);
          const snap = await ref.get();
          const state = snap.exists ? snap.data() : {};
          const blockedUntil = state.blockedUntil?.toDate?.();
          const active = Boolean(blockedUntil && blockedUntil > new Date());

          if (active && state.lastError === 'PEER_FLOOD') {
            await ref.set({
              blockedUntil: FieldValue.delete(),
              syntheticPeerFloodCooldownClearedAt: FieldValue.serverTimestamp()
            }, { merge: true });
            console.log('Cleared the locally invented PEER_FLOOD fallback timer. Proceeding with an explicit user-requested guarded test.');
          } else if (active) {
            console.error(`::error::Telegram supplied/retained a timed wait until ${blockedUntil.toISOString()}. The run will not bypass an explicit timed wait.`);
            process.exit(5);
          } else {
            console.log('No active explicit Telegram timed wait.');
          }
          NODE

      - id: baseline
        name: Capture starting successful-add count
        working-directory: agents/telegram-member-agent
        run: |
          set -euo pipefail
          BASELINE="$(node --input-type=module <<'NODE'
          import { Firestore } from '@google-cloud/firestore';
          const db = new Firestore();
          const snap = await db.collection(process.env.FIRESTORE_STATE_COLLECTION).doc(process.env.FIRESTORE_STATE_DOCUMENT).get();
          const state = snap.exists ? snap.data() : {};
          process.stdout.write(String(Math.max(0, Number(state.dailyAdded || 0))));
          NODE
          )"
          TARGET=$((BASELINE + RUN_SUCCESS_LIMIT))
          if [ "$TARGET" -gt "$DAILY_HARD_MAX" ]; then
            TARGET="$DAILY_HARD_MAX"
          fi
          echo "baseline=$BASELINE" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Starting daily count: $BASELINE; guarded target: $TARGET; maximum new successful additions: $RUN_SUCCESS_LIMIT."

      - id: pause
        name: Pause normal daily scheduler
        run: |
          set -euo pipefail
          gcloud scheduler jobs pause "$SCHEDULER_NAME" --location "$GCP_REGION" --quiet || true
          echo 'Normal scheduler paused for guarded one-user-at-a-time operation.'

      - name: Run mandatory non-mutating preflight
        run: |
          set -euo pipefail
          gcloud run jobs execute "$PREFLIGHT_JOB" --region "$GCP_REGION" --wait --quiet
          echo 'Preflight passed.'

      - id: configure
        name: Configure worker for one attempted user per execution
        run: |
          set -euo pipefail
          gcloud run jobs update "$JOB_NAME" --region "$GCP_REGION" \
            --update-env-vars 'DAILY_TARGET_MIN=1,DAILY_TARGET_MAX=50,MAX_ATTEMPTS_PER_RUN=1,UNKNOWN_ERROR_RETRIES=0,ATTEMPT_DELAY_MS=5000' --quiet
          echo 'Worker configured for exactly one attempted queue member per Cloud Run execution.'

      - id: operate
        name: Add one-by-one up to 10 successes or mutual-contact stop
        working-directory: agents/telegram-member-agent
        env:
          START_COUNT: ${{ steps.baseline.outputs.baseline }}
          RUN_TARGET: ${{ steps.baseline.outputs.target }}
        run: |
          set -euo pipefail
          STOP_REASON=''
          EXECUTIONS=0

          for i in $(seq 1 "$MAX_SINGLE_USER_EXECUTIONS"); do
            EXECUTIONS=$i
            echo "Starting single-user execution $i."

            set +e
            gcloud run jobs execute "$JOB_NAME" --region "$GCP_REGION" --wait --quiet
            JOB_STATUS=$?
            set -e

            if [ "$JOB_STATUS" -ne 0 ]; then
              STOP_REASON='worker_job_failure'
              echo "::error::Single-user worker execution returned status $JOB_STATUS."
              break
            fi

            DECISION="$(node --input-type=module <<'NODE'
            import { Firestore } from '@google-cloud/firestore';
            const db = new Firestore();
            const snap = await db.collection(process.env.FIRESTORE_STATE_COLLECTION).doc(process.env.FIRESTORE_STATE_DOCUMENT).get();
            const state = snap.exists ? snap.data() : {};
            const s = state.lastRunSummary || {};
            const errors = s.errors || {};
            const blockedUntil = state.blockedUntil?.toDate?.();
            const blocked = Boolean(blockedUntil && blockedUntil > new Date());
            const dailyAdded = Math.max(0, Number(state.dailyAdded || s.dailyAddedTotal || 0));
            const attempted = Math.max(0, Number(s.attempted || 0));
            const added = Math.max(0, Number(s.added || 0));
            const target = Math.max(0, Number(process.env.RUN_TARGET || 0));

            console.error(`Redacted single-user result: attempted=${attempted}; added=${added}; dailyAdded=${dailyAdded}; rateLimited=${s.stoppedByRateLimit || blocked ? 'yes' : 'no'}; mutualContact=${Number(errors.USER_NOT_MUTUAL_CONTACT || 0) > 0 ? 'yes' : 'no'}.`);

            if (Number(errors.USER_NOT_MUTUAL_CONTACT || 0) > 0 || s.stoppedByMutualContact) {
              process.stdout.write('mutual_contact_required');
            } else if (s.stoppedByRateLimit || blocked) {
              process.stdout.write('rate_limit');
            } else if (s.fatalError) {
              process.stdout.write('fatal_error');
            } else if (dailyAdded >= target) {
              process.stdout.write('run_target');
            } else if (dailyAdded >= Number(process.env.DAILY_HARD_MAX || 50)) {
              process.stdout.write('daily_max');
            } else if (attempted === 0) {
              process.stdout.write('no_progress');
            } else {
              process.stdout.write('continue');
            }
            NODE
            )"

            case "$DECISION" in
              mutual_contact_required)
                STOP_REASON='mutual_contact_required'
                echo 'Telegram returned USER_NOT_MUTUAL_CONTACT. Stopping immediately as requested.'
                break
                ;;
              rate_limit)
                STOP_REASON='rate_limit'
                echo '::warning::Telegram returned a rate-limit condition. Stopping this run immediately.'
                break
                ;;
              fatal_error)
                STOP_REASON='fatal_error'
                echo '::error::Fatal Telegram/account/channel condition detected. Stopping.'
                break
                ;;
              run_target)
                STOP_REASON='run_target'
                echo "Guarded test reached its maximum of $RUN_SUCCESS_LIMIT new successful additions."
                break
                ;;
              daily_max)
                STOP_REASON='daily_max'
                echo 'Daily hard ceiling reached.'
                break
                ;;
              no_progress)
                STOP_REASON='no_progress'
                echo '::warning::Worker made no queue progress. Stopping to avoid a loop.'
                break
                ;;
              continue)
                ;;
              *)
                STOP_REASON='diagnostic_error'
                echo "::error::Unexpected controller decision: $DECISION"
                break
                ;;
            esac
          done

          if [ -z "$STOP_REASON" ]; then
            STOP_REASON='controller_execution_cap'
          fi

          echo "stop_reason=$STOP_REASON" >> "$GITHUB_OUTPUT"
          echo "executions=$EXECUTIONS" >> "$GITHUB_OUTPUT"

      - id: clear-peer-flood
        name: Do not persist invented PEER_FLOOD cooldowns
        if: always()
        working-directory: agents/telegram-member-agent
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { Firestore, FieldValue } from '@google-cloud/firestore';
          const db = new Firestore();
          const ref = db.collection(process.env.FIRESTORE_STATE_COLLECTION).doc(process.env.FIRESTORE_STATE_DOCUMENT);
          const snap = await ref.get();
          const state = snap.exists ? snap.data() : {};
          if (state.lastError === 'PEER_FLOOD' && state.blockedUntil) {
            await ref.set({
              blockedUntil: FieldValue.delete(),
              peerFloodObservedAt: FieldValue.serverTimestamp()
            }, { merge: true });
            console.log('Removed locally invented PEER_FLOOD fallback timer. The PEER_FLOOD event remains recorded.');
          } else {
            console.log('No synthetic PEER_FLOOD timer to remove.');
          }
          NODE

      - id: restore
        name: Restore normal production worker configuration
        if: always()
        run: |
          set -euo pipefail
          gcloud run jobs update "$JOB_NAME" --region "$GCP_REGION" \
            --update-env-vars 'DAILY_TARGET_MIN=20,DAILY_TARGET_MAX=50,MAX_ATTEMPTS_PER_RUN=100,UNKNOWN_ERROR_RETRIES=2,ATTEMPT_DELAY_MS=5000' --quiet
          echo 'Production worker configuration restored. Scheduler remains paused.'

      - name: Guarded operation summary
        if: always()
        run: |
          echo "Starting count: ${{ steps.baseline.outputs.baseline }}"
          echo "Guarded target: ${{ steps.baseline.outputs.target }}"
          echo "Stop reason: ${{ steps.operate.outputs.stop_reason }}"
          echo "Single-user executions: ${{ steps.operate.outputs.executions }}"
          echo "Scheduler remains paused after this guarded operation."
