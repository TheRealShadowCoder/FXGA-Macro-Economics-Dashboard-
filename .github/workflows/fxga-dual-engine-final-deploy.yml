name: FXGA Dual Engine Final Deploy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fxga-dual-engine-final-deploy.yml'
  workflow_dispatch:

concurrency:
  group: fxga-dual-engine-final-deploy
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  SERVICE: fxga-macro-dashboard
  GAR_REPOSITORY: fxga-containers
  GCP_PROJECT_ID: fxglobalavengerstradingacademy
  GCP_REGION: us-central1
  DEPLOY_SERVICE_ACCOUNT: fxga-github-deployer@fxglobalavengerstradingacademy.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: fxga-collector-runtime@fxglobalavengerstradingacademy.iam.gserviceaccount.com
  GEMINI_SECRET_NAME: gemini-api-key
  REPORT_SECRET_NAME: fxga-mt5-report-secret
  GEMINI_MODEL: gemini-3.5-flash-lite
  GEMINI_FALLBACK_MODEL: gemini-3.1-flash-lite
  GEMINI_RESERVE_MODEL: gemini-3.7-flash

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate final dual-engine contract
        working-directory: google-cloud-app
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check server.js
          node --check elliott-reports.js
          node --check elliott-ai.js
          grep -q "FXGA_60D_AI_DOSSIER_3_DUAL_ENGINE" elliott-reports.js
          grep -q "rsiBbEvidenceComplete" elliott-reports.js
          grep -q "rsiBbStrictNonRepaintComplete" elliott-reports.js
          grep -q "rsiBbEvidenceRequired:true" elliott-reports.js
          grep -q "bridgeVersion:'13.50'" elliott-reports.js
          grep -q "const rsiBbOk=" elliott-ai.js
          grep -q "EW-DOSSIER-AI-4-DUAL-ENGINE" elliott-ai.js

      - id: config
        name: Resolve Google authentication
        env:
          WIF_PROVIDER_SECRET: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_PROVIDER_VAR: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          set -euo pipefail
          WIF_PROVIDER="${WIF_PROVIDER_SECRET:-$WIF_PROVIDER_VAR}"
          test -n "$WIF_PROVIDER" || { echo '::error::GCP_WIF_PROVIDER is missing'; exit 1; }
          echo "wif_provider=$WIF_PROVIDER" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify deployment prerequisites
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud artifacts repositories describe "$GAR_REPOSITORY" --location "$GCP_REGION" >/dev/null
          gcloud secrets describe "$GEMINI_SECRET_NAME" >/dev/null
          gcloud secrets describe "$REPORT_SECRET_NAME" >/dev/null

      - name: Build and push final dual-engine image
        run: |
          set -euo pipefail
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY/$SERVICE:${GITHUB_SHA}"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build --pull -f google-cloud-app/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy final dual-engine Cloud Run API
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --cpu 1 \
            --memory 1Gi \
            --concurrency 80 \
            --min 0 \
            --max 3 \
            --timeout 3600 \
            --set-env-vars "GCP_PROJECT_ID=$GCP_PROJECT_ID,FXGA_ARCHITECTURE=google-cloud-processing-cloudflare-static-hosting,FXGA_PUBLIC_ORIGIN=https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev,GEMINI_MODEL=$GEMINI_MODEL,GEMINI_FALLBACK_MODEL=$GEMINI_FALLBACK_MODEL,GEMINI_RESERVE_MODEL=$GEMINI_RESERVE_MODEL,GEMINI_SECRET_NAME=$GEMINI_SECRET_NAME" \
            --set-secrets "GEMINI_API_KEY=$GEMINI_SECRET_NAME:latest,FXGA_MT5_REPORT_SECRET=$REPORT_SECRET_NAME:latest"
          APP_URL="$(gcloud run services describe "$SERVICE" --region "$GCP_REGION" --platform managed --format='value(status.url)')"
          test -n "$APP_URL"
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"

      - name: Verify live strict dual-engine contract
        run: |
          set -euo pipefail
          node <<'NODE'
          const base=process.env.APP_URL;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last;
          for(let i=0;i<30;i++){
            try{
              const h=await fetch(base+'/api/health',{headers:{'Cache-Control':'no-cache'}});
              const ht=await h.text();
              if(!h.ok) throw new Error(`health ${h.status}: ${ht.slice(0,300)}`);
              const health=JSON.parse(ht);
              const er=health.elliottReports||{};
              if(er.enabled!==true) throw new Error('elliottReports health disabled');
              if(er.dossierVersion!=='FXGA_60D_AI_DOSSIER_3_DUAL_ENGINE') throw new Error(`wrong dossier ${er.dossierVersion}`);
              if(er.defaultTimeframes!==21) throw new Error('expected 21 timeframes');
              if(er.aiInputMode!=='single-pdf-dossier') throw new Error('AI is not using one PDF');
              if(er.rsiBbEvidenceRequired!==true) throw new Error('RSI/BB evidence is not required');
              if(er.rsiBbEvidenceSchema!=='FXGA_RSI_BB_AI_EVIDENCE_1') throw new Error(`wrong RSI schema ${er.rsiBbEvidenceSchema}`);
              const r=await fetch(base+'/api/elliott-reports',{headers:{'Cache-Control':'no-cache'}});
              const rt=await r.text();
              if(!r.ok) throw new Error(`reports ${r.status}: ${rt.slice(0,300)}`);
              const reports=JSON.parse(rt);
              if(reports.dossierVersion!=='FXGA_60D_AI_DOSSIER_3_DUAL_ENGINE') throw new Error('listing dossier mismatch');
              console.log('FXGA_STRICT_DUAL_ENGINE_LIVE',JSON.stringify({base,dossier:er.dossierVersion,timeframes:er.defaultTimeframes,rsiRequired:er.rsiBbEvidenceRequired,rsiSchema:er.rsiBbEvidenceSchema,aiInputMode:er.aiInputMode,bridge:reports.bridge}));
              process.exit(0);
            }catch(e){last=e; await sleep(4000);}
          }
          throw last||new Error('final dual-engine Cloud Run API not ready');
          NODE
