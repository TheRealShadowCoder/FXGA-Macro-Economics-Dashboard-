name: Fix V4.14 Live Verifier

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-fix-v414-live-verifier.trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Fix direct verifier module syntax
        run: |
          python3 scripts/fix_v414_live_verifier_modules.py
          grep -q "node --input-type=module" .github/workflows/verify-v414-live-direct.yml
          grep -q "import fs from 'node:fs'" .github/workflows/verify-v414-live-direct.yml
      - name: Commit verifier fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/verify-v414-live-direct.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix direct live verifier module execution'
          git pull --rebase origin main
          git push origin HEAD:main
