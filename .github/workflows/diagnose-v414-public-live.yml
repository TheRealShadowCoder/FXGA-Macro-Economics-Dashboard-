name: Diagnose V4.14 Public Live State

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-diagnose-v414-public-live.trigger'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Inspect public research API
        run: |
          set +e
          URL='https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev/api/research'
          STATUS=$(curl --max-time 45 -sS -o /tmp/research.json -w '%{http_code}' -H 'Accept: application/json' -H 'Cache-Control: no-cache' "$URL")
          echo "$STATUS" > /tmp/status
          node <<'NODE'
          const fs=require('fs');
          const status=Number(fs.readFileSync('/tmp/status','utf8').trim()||0);let research=null,parseError=null;
          try{research=JSON.parse(fs.readFileSync('/tmp/research.json','utf8'));}catch(error){parseError=String(error.message||error);}
          const core=research?.decisionCore,pairs=core?.pairDecisions||[],required=['reactionFunctionGap','crossAsset','evidenceCompleteness','horizonCalibration','decisionChange','historicalAnalogues','structuralBreak','causalTransmission','counterfactual','temporalIntelligence','transitionRisk','evidenceIndependence'],missing=[];
          for(const pair of pairs)for(const field of required)if(pair?.[field]===undefined)missing.push(`${pair?.symbol||'pair'}:${field}`);
          const topMissing=[];
          if(!research?.structuralBreaks)topMissing.push('structuralBreaks');
          if(!research?.evidenceIndependence)topMissing.push('evidenceIndependence');
          if(!research?.turningPoints)topMissing.push('turningPoints');
          if(!research?.catalystSequence)topMissing.push('catalystSequence');
          if(!research?.decisionMemory?.decisionChanges)topMissing.push('decisionChanges');
          if(!research?.decisionMemory?.analogueLibrary)topMissing.push('analogueLibrary');
          if(!core?.crossPairConsistency)topMissing.push('crossPairConsistency');
          if(!core?.portfolioInteraction)topMissing.push('portfolioInteraction');
          const report={generatedAt:new Date().toISOString(),httpStatus:status,parseError,pairCount:pairs.length,decisionCoreVersion:core?.version??null,missingPairFields:missing,missingTopLevel:topMissing,publicContractReady:status===200&&!parseError&&pairs.length>=8&&!missing.length&&!topMissing.length,keys:research?Object.keys(research).sort():[],decisionCoreKeys:core?Object.keys(core).sort():[]};
          fs.writeFileSync('.github/v414-public-live-diagnostic.json',JSON.stringify(report,null,2)+'\n');console.log(JSON.stringify(report,null,2));
          NODE
      - name: Persist public diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/v414-public-live-diagnostic.json
          git commit -m 'Record public v4.14 live state diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main
