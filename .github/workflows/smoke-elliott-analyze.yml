name: Smoke Elliott Analyze Live

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-elliott-analyze.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Retry exact Elliott job/status endpoints
        env:
          API_BASE: https://fxga-macro-dashboard-kbjj66blka-uc.a.run.app
          JOB_ID: 4952806d-d7f8-47d4-9edb-3e13bc004a81
        run: |
          node <<'NODE'
          const base=process.env.API_BASE.replace(/\/+$/,'');
          const jobId=process.env.JOB_ID;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function raw(path){
            const r=await fetch(base+path,{headers:{Accept:'application/json','Cache-Control':'no-cache'},cache:'no-store'});
            const text=await r.text();
            let body={}; try{body=text?JSON.parse(text):{};}catch{body={raw:text};}
            return {status:r.status,ok:r.ok,body};
          }
          console.log('CHECK_JOB',jobId);
          for(let i=0;i<20;i++){
            const r=await raw('/api/elliott-reports/jobs/'+encodeURIComponent(jobId));
            console.log('JOB_POLL',i+1,'HTTP',r.status,JSON.stringify(r.body));
            if(r.ok){
              const list=await raw('/api/elliott-reports');
              console.log('LIST_HTTP',list.status,JSON.stringify(list.body));
              process.exit(0);
            }
            await sleep(3000);
          }
          throw new Error('Job status endpoint stayed unavailable for 60 seconds');
          NODE
