name: Deploy FXGA Macro Intelligence

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fxga-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Sync FRED API key to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4f260a0775a3df407e08512610c9898b
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -n "$FRED_API_KEY" ]; then
            printf '%s' "$FRED_API_KEY" | npx wrangler secret put FRED_API_KEY
          else
            echo "::error::FRED_API_KEY repository secret is not configured."
            exit 1
          fi
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4f260a0775a3df407e08512610c9898b
          wranglerVersion: '4.118.0'
          command: deploy
      - name: Verify live macro intelligence stack
        run: |
          node <<'NODE'
          const base = 'https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function getJson(path) {
            const response = await fetch(`${base}${path}`, { headers: { Accept: 'application/json' } });
            const text = await response.text();
            if (!response.ok) throw new Error(`${path} returned ${response.status}: ${text.slice(0, 1000)}`);
            try { return JSON.parse(text); } catch { throw new Error(`${path} did not return valid JSON`); }
          }

          let health = null;
          for (let attempt = 1; attempt <= 8; attempt += 1) {
            try {
              health = await getJson('/api/health');
              if (health?.configured?.fred && health?.configured?.browserRun && health?.configured?.durableCoordinator && health?.configured?.calendarScraping) break;
            } catch (error) {
              if (attempt === 8) throw error;
            }
            if (attempt < 8) await sleep(2000);
          }

          if (!health?.configured?.fred) throw new Error('Live Worker does not report FRED as configured after rollout polling');
          if (!health?.configured?.browserRun) throw new Error('Browser Run binding is not live after rollout polling');
          if (!health?.configured?.durableCoordinator) throw new Error('Durable Object coordinator is not live after rollout polling');
          if (!health?.configured?.calendarScraping) throw new Error('Scraped calendar mode is not enabled');
          if (!Array.isArray(health?.configured?.calendarSources) || !['Myfxbook', 'FXStreet', 'CNBC'].every((name) => health.configured.calendarSources.includes(name))) throw new Error('Expected Myfxbook, FXStreet and CNBC calendar source configuration');
          if (health?.safety?.workerSubrequestCeiling > 45) throw new Error('FXGA subrequest safety target exceeds 45');
          if (health?.safety?.collectorMaxConcurrentConnections > 5) throw new Error('FXGA collector concurrency exceeds five connections');
          if (health?.safety?.browserSoftBudgetSecondsPerUtcDay > 480) throw new Error('FXGA browser budget exceeds 480 seconds/day');

          const catalog = await getJson('/api/fred/catalog');
          if (!Array.isArray(catalog?.series) || catalog.series.length < 90) throw new Error(`FRED catalog is unexpectedly small: ${catalog?.series?.length ?? 0}`);
          if (!Array.isArray(catalog?.categories) || catalog.categories.length < 17) throw new Error(`FRED category catalog is unexpectedly small: ${catalog?.categories?.length ?? 0}`);

          const sampleCategories = ['inflation','labour','growth','liquidity','credit','housing','manufacturing','policy-rates','treasury-yields','yield-spreads','recession-risk','financial-conditions','usd-fx','volatility','consumption','business-activity','leading-indicators'];
          for (const category of sampleCategories) {
            const payload = await getJson(`/api/fred?category=${encodeURIComponent(category)}&limit=1`);
            const first = payload?.series?.[0];
            if (!first || first.value === null || !first.date) throw new Error(`Live FRED category ${category} returned no current observation`);
          }

          const analysis = await getJson('/api/analysis');
          if (!analysis?.regime?.name || !Array.isArray(analysis?.dimensions) || analysis.dimensions.length < 7) throw new Error('Macro analysis endpoint is incomplete');
          if (!Array.isArray(analysis?.assets) || analysis.assets.length < 4 || analysis?.coverage?.observed < 20) throw new Error('Macro analysis coverage is unexpectedly low');

          const releaseState = await getJson('/api/release-state');
          console.log('SCRAPED_CALENDAR_DIAGNOSTICS=' + JSON.stringify({
            initialized: releaseState?.initialized,
            reason: releaseState?.reason,
            mode: releaseState?.mode,
            sourceStatus: releaseState?.calendarSourceStatus,
            upcoming: releaseState?.upcoming?.length ?? 0,
            active: releaseState?.active?.length ?? 0,
          }));
          if (!releaseState?.initialized) throw new Error(`Event-driven release scheduler is not initialized. Diagnostics=${JSON.stringify(releaseState?.calendarSourceStatus ?? null)}`);
          if (releaseState?.mode !== 'scraped-calendar-consensus') throw new Error(`Unexpected calendar scheduler mode: ${releaseState?.mode}`);
          if (!Array.isArray(releaseState?.calendarSources) || !['Myfxbook', 'FXStreet', 'CNBC'].every((name) => releaseState.calendarSources.includes(name))) throw new Error('Release scheduler does not advertise all three requested calendar sources');
          const sourceStatus = releaseState?.calendarSourceStatus;
          if (!sourceStatus?.sources?.myfxbook || !sourceStatus?.sources?.fxstreet || !sourceStatus?.sources?.cnbc) throw new Error('Per-source calendar scrape status is incomplete');
          if (!(sourceStatus.sources.myfxbook.ok || sourceStatus.sources.fxstreet.ok)) throw new Error(`Neither primary calendar source returned events: ${JSON.stringify(sourceStatus.sources)}`);
          if (!(sourceStatus.mergedEvents > 0)) throw new Error('Scraped calendar consensus produced no merged events');

          const calendar = await getJson('/api/calendar?days=7&importance=1');
          if (!Array.isArray(calendar?.events) || calendar.events.length < 1) throw new Error('Cached scraped economic calendar returned no upcoming events');
          if (calendar?.mode !== 'scraped-calendar-consensus') throw new Error('Public calendar endpoint is not serving scraped consensus state');

          const acquisition = await getJson('/api/acquisition/catalog');
          if (!Array.isArray(acquisition?.methods) || acquisition.methods.length < 10) throw new Error('Acquisition method stack is incomplete');
          const requiredSources = ['myfxbook-calendar', 'fxstreet-calendar', 'cnbc-economy'];
          if (!Array.isArray(acquisition?.sources) || !requiredSources.every((id) => acquisition.sources.some((source) => source.id === id))) throw new Error('Acquisition source registry is missing one of the requested calendar scrapers');
          if (acquisition?.limits?.externalSubrequestsPerInvocation > 45) throw new Error('Acquisition subrequest guard exceeds safety target');
          if (acquisition?.limits?.collectorMaxConcurrentConnections > 5) throw new Error('Acquisition connection guard exceeds five');
          if (acquisition?.status?.browserBudget?.softLimitSeconds > 480) throw new Error('Browser Run safety budget exceeds 480 seconds/day');

          await new Promise((resolve, reject) => {
            if (typeof WebSocket === 'undefined') return reject(new Error('Node runner has no WebSocket implementation'));
            const ws = new WebSocket(base.replace('https://', 'wss://') + '/api/live');
            const timer = setTimeout(() => { try { ws.close(); } catch {} reject(new Error('WebSocket verification timed out')); }, 8000);
            ws.addEventListener('message', (event) => { try { const payload = JSON.parse(String(event.data)); if (payload?.type === 'connected') { clearTimeout(timer); ws.close(1000, 'CI verification complete'); resolve(); } } catch {} });
            ws.addEventListener('error', () => { clearTimeout(timer); reject(new Error('WebSocket verification failed')); });
          });

          console.log(`FXGA verification passed: ${catalog.total} FRED series, ${calendar.events.length} cached calendar events, calendar sources=${JSON.stringify(sourceStatus.sources)}.`);
          NODE
