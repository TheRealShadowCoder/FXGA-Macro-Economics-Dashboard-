name: Deploy FXGA Passive Cloudflare Edge

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'worker/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'index.html'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: fxga-cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build dashboard and passive Worker
        run: npm run build

      - name: Require passive-edge configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COLLECTOR_WEBHOOK_SECRET: ${{ secrets.COLLECTOR_WEBHOOK_SECRET }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          test -n "$COLLECTOR_WEBHOOK_SECRET" || { echo '::error::COLLECTOR_WEBHOOK_SECRET is missing'; exit 1; }
          node <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync('wrangler.jsonc','utf8');
          if(!text.includes('worker/index-v3.ts')) throw new Error('Cloudflare must deploy passive worker/index-v3.ts');
          if(!text.includes('"COLLECTOR_MODE": "external-webhook"')) throw new Error('Cloudflare must default to external-webhook mode');
          if(/"browser"\s*:/.test(text)) throw new Error('Cloudflare Browser binding must be removed');
          if(/"triggers"\s*:/.test(text)) throw new Error('Cloudflare scheduled collection must be removed');
          NODE

      - name: Sync only webhook authentication secret to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4f260a0775a3df407e08512610c9898b
          COLLECTOR_WEBHOOK_SECRET: ${{ secrets.COLLECTOR_WEBHOOK_SECRET }}
        run: |
          printf '%s' "$COLLECTOR_WEBHOOK_SECRET" | npx wrangler secret put COLLECTOR_WEBHOOK_SECRET
          npx wrangler secret delete FRED_API_KEY >/dev/null 2>&1 || true
          npx wrangler secret delete NEWS_API_KEY >/dev/null 2>&1 || true
          npx wrangler secret delete TRADING_ECONOMICS_API_KEY >/dev/null 2>&1 || true

      - name: Deploy passive Cloudflare Worker and UI
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4f260a0775a3df407e08512610c9898b
          wranglerVersion: '4.118.0'
          command: deploy

      - name: Verify zero-acquisition Cloudflare contract
        run: |
          node <<'NODE'
          const base='https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function fetchHealth(){
            let last;
            for(let i=0;i<20;i++){
              try{
                const r=await fetch(base+'/api/health',{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
                const text=await r.text();
                if(r.ok){
                  const h=JSON.parse(text);
                  if(h.collectorMode==='google-cloud-run-webhook') return h;
                  last=new Error(`Waiting for passive version; current mode ${h.collectorMode}`);
                }else last=new Error(`/api/health ${r.status}: ${text.slice(0,300)}`);
              }catch(e){last=e;}
              await sleep(1500);
            }
            throw last;
          }
          const h=await fetchHealth();
          if(h.configured?.browserRun!==false||h.configured?.calendarScraping!==false||h.configured?.officialNewsScraping!==false) throw new Error('Cloudflare acquisition is not fully disabled');
          const s=h.safety||{};
          for(const k of ['normalStateUpstreamCalendarRequests','normalStateUpstreamFredRequests','normalStateUpstreamNewsRequests','normalStateUpstreamMarketRequests']) if(Number(s[k]??-1)!==0) throw new Error(`${k} must be zero`);
          if(Number(s.browserSoftBudgetSecondsPerUtcDay??-1)!==0) throw new Error('Cloudflare Browser budget must be zero');
          const acquire=await fetch(base+'/api/acquire?source=fred',{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
          if(acquire.status!==409) throw new Error(`Cloudflare acquisition endpoint must be disabled, got ${acquire.status}`);
          console.log('Passive Cloudflare verified: signed webhook receive/persist/serve only; all upstream acquisition counters are zero.');
          NODE
