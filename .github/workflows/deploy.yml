name: Deploy FXGA Macro Intelligence

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fxga-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npm run build
      - name: Sync FRED API key to Cloudflare Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4f260a0775a3df407e08512610c9898b
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -n "$FRED_API_KEY" ]; then
            printf '%s' "$FRED_API_KEY" | npx wrangler secret put FRED_API_KEY
          else
            echo "::error::FRED_API_KEY repository secret is not configured."
            exit 1
          fi
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 4f260a0775a3df407e08512610c9898b
          wranglerVersion: '4.118.0'
          command: deploy
      - name: Verify live macro intelligence stack
        run: |
          node <<'NODE'
          const base = 'https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev';
          const expectedEngine = 'scraped-consensus-v4';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function getJson(path) {
            const response = await fetch(`${base}${path}`, { headers: { Accept: 'application/json' } });
            const text = await response.text();
            if (!response.ok) throw new Error(`${path} returned ${response.status}: ${text.slice(0, 1000)}`);
            try { return JSON.parse(text); } catch { throw new Error(`${path} did not return valid JSON`); }
          }

          let health = null;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              health = await getJson('/api/health');
              if (health?.calendarEngineVersion === expectedEngine && health?.configured?.fred && health?.configured?.browserRun && health?.configured?.durableCoordinator && health?.configured?.calendarScraping) break;
            } catch (error) {
              if (attempt === 12) throw error;
            }
            if (attempt < 12) await sleep(2000);
          }

          if (health?.calendarEngineVersion !== expectedEngine) throw new Error(`Live Worker is stale: expected ${expectedEngine}, got ${health?.calendarEngineVersion ?? 'none'}`);
          if (!health?.configured?.fred) throw new Error('FRED is not configured');
          if (!health?.configured?.browserRun || !health?.configured?.durableCoordinator) throw new Error('Cloudflare browser/coordinator bindings are not live');
          if (!Array.isArray(health?.configured?.calendarSources) || !['Myfxbook', 'FXStreet', 'CNBC'].every((name) => health.configured.calendarSources.includes(name))) throw new Error('Expected all requested calendar sources');
          if (health?.safety?.releaseWindowPrimary !== 'FXStreet public calendar feed') throw new Error('FXStreet public feed is not the release-window primary');
          if (health?.safety?.workerSubrequestCeiling > 45 || health?.safety?.collectorMaxConcurrentConnections > 5 || health?.safety?.browserSoftBudgetSecondsPerUtcDay > 480) throw new Error('Safety budget regression');

          const catalog = await getJson('/api/fred/catalog');
          if (catalog?.policy?.importantOnly !== true) throw new Error('FRED catalog is not marked important-only');
          if (!Array.isArray(catalog?.series) || catalog.series.length < 35 || catalog.series.length > 40) throw new Error(`Important FRED set should be 35-40 series, got ${catalog?.series?.length ?? 0}`);
          if (!Array.isArray(catalog?.categories) || catalog.categories.length < 12 || catalog.categories.length > 15) throw new Error(`Unexpected important FRED category count: ${catalog?.categories?.length ?? 0}`);
          if (catalog.series.some((series) => !['critical','high'].includes(series.importance))) throw new Error('FRED catalog contains a non-important series');

          const sampleCategories = ['inflation','labour','growth','liquidity','credit','policy-rates','treasury-yields','yield-spreads','recession-risk','financial-conditions','usd-fx','volatility','consumption','leading-indicators'];
          for (const category of sampleCategories) {
            const payload = await getJson(`/api/fred?category=${encodeURIComponent(category)}&limit=1`);
            const first = payload?.series?.[0];
            if (!first || first.value === null || !first.date) throw new Error(`Live important FRED category ${category} returned no observation`);
          }

          const analysis = await getJson('/api/analysis');
          if (!analysis?.regime?.name || !Array.isArray(analysis?.dimensions) || analysis.dimensions.length < 7) throw new Error('Macro analysis endpoint is incomplete');
          if (!Array.isArray(analysis?.assets) || analysis.assets.length < 4 || analysis?.coverage?.observed < 20) throw new Error('Macro analysis coverage is unexpectedly low');

          const releaseState = await getJson('/api/release-state');
          console.log('SCRAPED_CALENDAR_DIAGNOSTICS=' + JSON.stringify({ initialized: releaseState?.initialized, mode: releaseState?.mode, sourceStatus: releaseState?.calendarSourceStatus, upcoming: releaseState?.upcoming?.length ?? 0, active: releaseState?.active?.length ?? 0 }));
          if (!releaseState?.initialized || releaseState?.mode !== 'scraped-calendar-consensus') throw new Error('Event-driven release scheduler is not initialized in scraped consensus mode');
          const sourceStatus = releaseState?.calendarSourceStatus;
          if (!sourceStatus?.sources?.myfxbook || !sourceStatus?.sources?.fxstreet || !sourceStatus?.sources?.cnbc) throw new Error('Per-source calendar status is incomplete');
          if (!(sourceStatus.sources.myfxbook.ok || sourceStatus.sources.fxstreet.ok) || !(sourceStatus.mergedEvents > 0)) throw new Error(`No primary calendar source returned events: ${JSON.stringify(sourceStatus)}`);

          const calendar = await getJson('/api/calendar?days=7&importance=1');
          if (!Array.isArray(calendar?.events) || calendar.events.length < 1) throw new Error('Cached scraped economic calendar returned no events');
          if (calendar?.mode !== 'scraped-calendar-consensus') throw new Error('Calendar endpoint is not using scraped consensus state');
          if (!calendar?.analytics?.fxstreetDeviation || !calendar?.analytics?.normalizedSurprise || !calendar?.analytics?.revisionDelta) throw new Error('Calendar analytics flags are incomplete');

          const signals = await getJson('/api/session-signals');
          if (!Array.isArray(signals?.sessions) || signals.sessions.length !== 4) throw new Error(`Expected four session blocks, got ${signals?.sessions?.length ?? 0}`);
          for (const id of ['asia','london','new-york','overlap']) {
            const session = signals.sessions.find((item) => item.id === id);
            if (!session || !Array.isArray(session.signals) || session.signals.length < 4) throw new Error(`Session signals missing for ${id}`);
            if (session.signals.some((signal) => !['BUY','SELL','WAIT'].includes(signal.direction))) throw new Error(`Invalid signal direction in ${id}`);
          }

          const acquisition = await getJson('/api/acquisition/catalog');
          if (!Array.isArray(acquisition?.methods) || acquisition.methods.length < 10) throw new Error('Acquisition method stack is incomplete');
          const requiredSources = ['myfxbook-calendar', 'fxstreet-calendar', 'cnbc-economy'];
          if (!Array.isArray(acquisition?.sources) || !requiredSources.every((id) => acquisition.sources.some((source) => source.id === id))) throw new Error('Calendar source registry is incomplete');

          await new Promise((resolve, reject) => {
            if (typeof WebSocket === 'undefined') return reject(new Error('Node runner has no WebSocket implementation'));
            const ws = new WebSocket(base.replace('https://', 'wss://') + '/api/live');
            const timer = setTimeout(() => { try { ws.close(); } catch {} reject(new Error('WebSocket verification timed out')); }, 8000);
            ws.addEventListener('message', (event) => { try { const payload = JSON.parse(String(event.data)); if (payload?.type === 'connected') { clearTimeout(timer); ws.close(1000, 'CI verification complete'); resolve(); } } catch {} });
            ws.addEventListener('error', () => { clearTimeout(timer); reject(new Error('WebSocket verification failed')); });
          });

          console.log(`FXGA verification passed: ${catalog.total} important FRED series, ${calendar.events.length} calendar events, ${signals.sessions.length} session signal blocks.`);
          NODE
