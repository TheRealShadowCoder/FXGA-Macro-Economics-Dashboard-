name: Verify FXGA Gemini Live Response

on:
  workflow_run:
    workflows: ["Deploy FXGA Google Cloud Application"]
    types: [completed]

permissions:
  contents: read
  statuses: write

concurrency:
  group: fxga-gemini-live-response
  cancel-in-progress: true

env:
  API_BASE: https://fxga-macro-dashboard-kbjj66blka-uc.a.run.app
  STATUS_CONTEXT: fxga/gemini-live-response

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ask deployed Gemini to reply
        id: probe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          post_status() {
            local state="$1"
            local description="$2"
            local payload
            description="$(printf '%s' "$description" | tr '\r\n' ' ' | cut -c1-140)"
            payload="$(jq -nc \
              --arg state "$state" \
              --arg context "$STATUS_CONTEXT" \
              --arg description "$description" \
              --arg target_url "$RUN_URL" \
              '{state:$state,context:$context,description:$description,target_url:$target_url}')"
            curl -fsS \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${STATUS_SHA}" \
              -d "$payload" >/dev/null
          }

          post_status pending 'Calling deployed FXGA Gemini stream'

          set +e
          http_status=$(curl -sS --connect-timeout 15 --max-time 120 \
            -o /tmp/fxga-gemini-live.txt \
            -w '%{http_code}' \
            -X POST "${API_BASE}/api/gemini/chat-stream" \
            -H 'Content-Type: application/json' \
            -H 'Accept: text/event-stream' \
            --data '{"question":"Reply with a short greeting confirming the FXGA Gemini API is working.","task":"conversation"}')
          curl_status=$?
          set -e

          if [[ "$curl_status" -ne 0 ]]; then
            post_status failure "Live Gemini request transport failed (${curl_status})"
            exit 1
          fi
          if [[ "$http_status" -lt 200 || "$http_status" -ge 300 ]]; then
            post_status failure "Live Gemini endpoint returned HTTP ${http_status}"
            exit 1
          fi
          if grep -q '^event: error' /tmp/fxga-gemini-live.txt; then
            error_text=$(awk '/^event: error/{want=1;next} want && /^data: /{sub(/^data: /,"");print;exit}' /tmp/fxga-gemini-live.txt | jq -r 'try (.message // .error // .code // "Gemini stream error") catch "Gemini stream error"')
            post_status failure "${error_text:-Gemini stream returned an error}"
            exit 1
          fi

          answer=$(awk '
            /^event: delta/ { want=1; next }
            want && /^data: / {
              sub(/^data: /, "");
              print;
              want=0;
            }
          ' /tmp/fxga-gemini-live.txt | jq -r -s 'map(try fromjson catch empty) | map(.text // .delta // .content // empty) | join("")')

          model=$(awk '
            /^event: done/ { want=1; next }
            want && /^data: / {
              sub(/^data: /, "");
              print;
              exit;
            }
          ' /tmp/fxga-gemini-live.txt | jq -r 'try (.result.model // empty) catch ""')

          if [[ -z "$answer" ]]; then
            post_status failure 'Gemini returned no usable streamed text'
            exit 1
          fi
          if [[ -z "$model" || "$model" == fxga-local-* ]]; then
            post_status failure "Only FXGA local fallback replied (${model:-unknown model})"
            exit 1
          fi

          snippet="$(printf '%s' "$answer" | tr '\r\n' ' ' | cut -c1-105)"
          post_status success "${model}: ${snippet}"

          echo "MODEL=${model}"
          echo 'AI_ANSWER_BEGIN'
          printf '%s\n' "$answer"
          echo 'AI_ANSWER_END'
