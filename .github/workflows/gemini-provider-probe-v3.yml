name: Gemini Provider Probe V3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PRIMARY_MODEL: gemini-3.5-flash-lite
  RESERVE_MODEL: gemini-3.7-flash

jobs:
  probe:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[gemini-provider-probe-v3]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Direct Gemini provider test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set +e
          set -u
          R=/tmp/gemini-provider-result.json
          jq -nc --arg run "$GITHUB_RUN_ID" '{schema:"fxga.gemini.provider-probe.v3",runId:($run|tonumber),startedAt:(now|todate),bypasses:["Cloud Run","Firestore cache","FXGA provider cooldown","frontend"]}' > "$R"

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            jq '.fatal="missing_gemini_api_key"' "$R" >/tmp/x; mv /tmp/x "$R"
          else
            printf 'field,value\nprobe,FXGA_FILE_PROVIDER_OK\n' >/tmp/probe.csv
            B=$(wc -c </tmp/probe.csv | tr -d ' ')

            # 1. Files API upload first.
            curl -sS --connect-timeout 15 --max-time 60 -D /tmp/start.h -o /tmp/start.body -X POST 'https://generativelanguage.googleapis.com/upload/v1beta/files' \
              -H "x-goog-api-key: ${GEMINI_API_KEY}" -H 'X-Goog-Upload-Protocol: resumable' -H 'X-Goog-Upload-Command: start' \
              -H "X-Goog-Upload-Header-Content-Length: ${B}" -H 'X-Goog-Upload-Header-Content-Type: text/csv' -H 'Content-Type: application/json' \
              --data '{"file":{"display_name":"fxga-provider-probe.csv"}}'
            START_CURL=$?
            U=$(awk 'BEGIN{IGNORECASE=1} /^x-goog-upload-url:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' /tmp/start.h 2>/dev/null)
            jq --argjson c "$START_CURL" --arg has "$([ -n "$U" ] && echo true || echo false)" '.file={uploadStartCurlExit:$c,uploadUrlReturned:($has=="true")}' "$R" >/tmp/x; mv /tmp/x "$R"

            if [ -n "$U" ]; then
              UH=$(curl -sS --connect-timeout 15 --max-time 60 -o /tmp/upload.json -w '%{http_code}' -X POST "$U" -H "Content-Length: ${B}" -H 'Content-Type: text/csv' -H 'X-Goog-Upload-Offset: 0' -H 'X-Goog-Upload-Command: upload, finalize' --data-binary @/tmp/probe.csv)
              UC=$?
              [ -z "$UH" ] && UH=0
              N=$(jq -r '.file.name // empty' /tmp/upload.json 2>/dev/null); URI=$(jq -r '.file.uri // empty' /tmp/upload.json 2>/dev/null); S=$(jq -r '.file.state // "UNKNOWN"' /tmp/upload.json 2>/dev/null)
              for i in $(seq 1 20); do
                [ "$S" = ACTIVE ] && break; [ -z "$N" ] && break
                META=$(curl -sS --connect-timeout 10 --max-time 30 -H "x-goog-api-key: ${GEMINI_API_KEY}" "https://generativelanguage.googleapis.com/v1beta/${N}")
                S=$(printf '%s' "$META" | jq -r '.state // "UNKNOWN"' 2>/dev/null)
                [ "$S" = FAILED ] && break
                sleep 1
              done
              jq --arg h "$UH" --argjson c "$UC" --arg s "$S" '.file.uploadHttp=($h|tonumber?//0)|.file.uploadCurlExit=$c|.file.state=$s' "$R" >/tmp/x; mv /tmp/x "$R"
            fi

            # Honor the approximately 45 second Retry-After shown by production.
            sleep 50

            call_model(){
              KEY="$1"; MODEL="$2"; REQ="$3"
              CODE=$(curl -sS --connect-timeout 15 --max-time 120 -D "/tmp/${KEY}.h" -o "/tmp/${KEY}.json" -w '%{http_code}' -X POST 'https://generativelanguage.googleapis.com/v1/interactions' -H "x-goog-api-key: ${GEMINI_API_KEY}" -H 'Content-Type: application/json' --data-binary @"$REQ")
              CURL_EXIT=$?; [ -z "$CODE" ] && CODE=0
              RETRY=$(awk 'BEGIN{IGNORECASE=1} /^retry-after:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' "/tmp/${KEY}.h" 2>/dev/null)
              STATUS=$(jq -r '.error.status // empty' "/tmp/${KEY}.json" 2>/dev/null)
              MSG=$(jq -r '.error.message // empty' "/tmp/${KEY}.json" 2>/dev/null | head -c 300)
              ANSWER=$(jq -r '[.steps[]? | select(.type=="model_output") | .content[]? | select(.type=="text") | .text]|join("")' "/tmp/${KEY}.json" 2>/dev/null)
              jq --arg k "$KEY" --arg model "$MODEL" --arg code "$CODE" --argjson ce "$CURL_EXIT" --arg retry "$RETRY" --arg status "$STATUS" --arg msg "$MSG" --arg answer "$ANSWER" '.[$k]={model:$model,http:($code|tonumber?//0),curlExit:$ce,retryAfter:($retry|select(length>0)//null),errorStatus:($status|select(length>0)//null),errorMessage:($msg|select(length>0)//null),answer:$answer}' "$R" >/tmp/x; mv /tmp/x "$R"
            }

            # 2. File-backed Gemini interaction.
            if [ "${S:-UNKNOWN}" = ACTIVE ] && [ -n "${URI:-}" ]; then
              jq -nc --arg m "$PRIMARY_MODEL" --arg u "$URI" '{model:$m,input:[{type:"document",uri:$u,mime_type:"text/csv"},{type:"text",text:"Reply with exactly the probe value."}],store:false,generation_config:{max_output_tokens:32}}' >/tmp/file.req
              call_model fileInteraction "$PRIMARY_MODEL" /tmp/file.req
            fi

            # 3. Normal inline request on the primary model.
            sleep 10
            jq -nc --arg m "$PRIMARY_MODEL" '{model:$m,input:"Reply with exactly: FXGA_INLINE_PROVIDER_OK",store:false,generation_config:{max_output_tokens:32}}' >/tmp/primary.req
            call_model inlinePrimary "$PRIMARY_MODEL" /tmp/primary.req

            # 4. Normal inline request on the reserve model.
            sleep 10
            jq -nc --arg m "$RESERVE_MODEL" '{model:$m,input:"Reply with exactly: FXGA_INLINE_PROVIDER_OK",store:false,generation_config:{max_output_tokens:32}}' >/tmp/reserve.req
            call_model inlineReserve "$RESERVE_MODEL" /tmp/reserve.req
          fi

          jq '.completedAt=(now|todate)' "$R" >/tmp/x; mv /tmp/x "$R"
          cat "$R"

      - name: Persist sanitized result
        if: always()
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = 'diagnostics/gemini-provider-latest.json';
            const raw = fs.existsSync('/tmp/gemini-provider-result.json')
              ? fs.readFileSync('/tmp/gemini-provider-result.json', 'utf8')
              : JSON.stringify({schema:'fxga.gemini.provider-probe.v3',runId:Number(process.env.GITHUB_RUN_ID),fatal:'no_result'}, null, 2);
            let sha;
            try {
              const x = await github.rest.repos.getContent({owner:context.repo.owner, repo:context.repo.repo, path, ref:'main'});
              if (!Array.isArray(x.data)) sha = x.data.sha;
            } catch (e) { if (e.status !== 404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,message:'Record Gemini provider probe v3 [skip ci]',content:Buffer.from(raw).toString('base64'),branch:'main',...(sha?{sha}:{})});
