name: Test FXGA Firestore v9 Compatibility

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/firestore-v9-compatibility.trigger'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install collector with Firestore 9 in isolated workspace
        run: |
          cp -R cloud-run-collector /tmp/fxga-firestore9
          cd /tmp/fxga-firestore9
          npm install --ignore-scripts --no-fund --no-audit
          npm install --save-exact --ignore-scripts --no-fund --no-audit @google-cloud/firestore@9.0.0
          npm run check

      - name: Exercise Firestore APIs used by FXGA
        run: |
          cd /tmp/fxga-firestore9
          node --input-type=module <<'NODE'
          import { Firestore } from '@google-cloud/firestore';
          const db=new Firestore({projectId:'fxga-compatibility-test',ignoreUndefinedProperties:true});
          const collection=db.collection('fxga_collector_state');
          const doc=collection.doc('macro');
          const query=collection.where('updatedAt','>=','2026-01-01T00:00:00Z').orderBy('updatedAt','desc').limit(10);
          const batch=db.batch();
          if(doc.path!=='fxga_collector_state/macro')throw new Error('Document path API changed');
          if(typeof query.get!=='function')throw new Error('Query API changed');
          if(typeof batch.set!=='function'||typeof batch.commit!=='function')throw new Error('Batch API changed');
          if(typeof db.getAll!=='function')throw new Error('getAll API changed');
          console.log('Firestore 9 API surface used by FXGA is compatible.');
          NODE

      - name: Audit isolated Firestore 9 dependency tree
        run: |
          cd /tmp/fxga-firestore9
          npm audit --json > /tmp/firestore9-audit.json || true
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/firestore9-audit.json','utf8'));
          const v=x?.metadata?.vulnerabilities||{};
          console.log(JSON.stringify(v,null,2));
          if((v.high||0)>0||(v.critical||0)>0)throw new Error('Firestore 9 compatibility tree still contains high/critical advisories');
          NODE
