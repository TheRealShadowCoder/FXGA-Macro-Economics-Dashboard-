name: Apply Cross Asset Source Minimal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-cross-asset-minimal.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply and diagnose cross asset patch
        run: |
          set +e
          mkdir -p /tmp/cross-asset .github
          python3 scripts/apply_cross_asset_confirmation_v3.py > /tmp/cross-asset/patch.log 2>&1
          PATCH_RC=$?
          node --check cloud-run-collector/src/decision-intelligence-core.js > /tmp/cross-asset/check.log 2>&1
          CHECK_RC=$?
          grep -q 'function crossAssetConfirmation' cloud-run-collector/src/decision-intelligence-core.js
          G1=$?
          grep -q 'crossAsset:g.crossAsset' cloud-run-collector/src/decision-intelligence-core.js
          G2=$?
          grep -q 'crossAssetFactorValue' cloud-run-collector/src/decision-intelligence-core.js
          G3=$?
          CONTRACT_RC=$(( G1 || G2 || G3 ))
          {
            echo "generated_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "patch_exit=$PATCH_RC"
            echo "syntax_exit=$CHECK_RC"
            echo "contract_exit=$CONTRACT_RC"
            echo '--- patch output ---'
            cat /tmp/cross-asset/patch.log
            echo '--- syntax output ---'
            cat /tmp/cross-asset/check.log
          } > .github/cross-asset-v3-diagnostic.txt
          echo "$PATCH_RC" > /tmp/cross-asset/patch.rc
          echo "$CHECK_RC" > /tmp/cross-asset/check.rc
          echo "$CONTRACT_RC" > /tmp/cross-asset/contract.rc
      - name: Persist source or exact diagnostic
        run: |
          PATCH_RC=$(cat /tmp/cross-asset/patch.rc)
          CHECK_RC=$(cat /tmp/cross-asset/check.rc)
          CONTRACT_RC=$(cat /tmp/cross-asset/contract.rc)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/cross-asset-v3-diagnostic.txt
          if [ "$PATCH_RC" = 0 ] && [ "$CHECK_RC" = 0 ] && [ "$CONTRACT_RC" = 0 ]; then
            git add cloud-run-collector/src/decision-intelligence-core.js
            MSG='Integrate cross-asset confirmation source'
          else
            MSG='Record cross-asset v3 integration diagnostic'
          fi
          git commit -m "$MSG"
          git pull --rebase origin main
          git push origin HEAD:main
