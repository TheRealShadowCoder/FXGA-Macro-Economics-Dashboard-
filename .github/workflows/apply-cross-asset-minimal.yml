name: Apply Cross Asset Source Minimal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-cross-asset-minimal.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply cross asset patch
        run: python3 scripts/apply_cross_asset_confirmation_v2.py
      - name: Syntax check
        run: node --check cloud-run-collector/src/decision-intelligence-core.js
      - name: Assert contract
        run: |
          grep -q 'function crossAssetConfirmation' cloud-run-collector/src/decision-intelligence-core.js
          grep -q 'crossAsset:g.crossAsset' cloud-run-collector/src/decision-intelligence-core.js
          grep -q 'crossAssetFactorValue' cloud-run-collector/src/decision-intelligence-core.js
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud-run-collector/src/decision-intelligence-core.js
          git commit -m 'Integrate cross-asset confirmation source'
          git pull --rebase origin main
          git push origin HEAD:main
