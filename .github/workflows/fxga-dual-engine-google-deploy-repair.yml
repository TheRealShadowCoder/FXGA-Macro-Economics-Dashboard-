name: FXGA Dual Engine Google Deploy Repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fxga-dual-engine-google-deploy-repair.yml'
  workflow_dispatch:

concurrency:
  group: fxga-dual-engine-google-deploy-repair
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  SERVICE: fxga-macro-dashboard
  GAR_REPOSITORY: fxga-containers
  GCP_PROJECT_ID: fxglobalavengerstradingacademy
  GCP_REGION: us-central1
  DEPLOY_SERVICE_ACCOUNT: fxga-github-deployer@fxglobalavengerstradingacademy.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: fxga-collector-runtime@fxglobalavengerstradingacademy.iam.gserviceaccount.com
  GEMINI_SECRET_NAME: gemini-api-key
  REPORT_SECRET_NAME: fxga-mt5-report-secret
  GEMINI_MODEL: gemini-3.5-flash-lite
  GEMINI_FALLBACK_MODEL: gemini-3.1-flash-lite
  GEMINI_RESERVE_MODEL: gemini-3.7-flash

jobs:
  repair-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate dual-engine source
        working-directory: google-cloud-app
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check server.js
          node --check elliott-reports.js
          node --check elliott-ai.js
          grep -q "FXGA_60D_AI_DOSSIER_3_DUAL_ENGINE" elliott-reports.js
          grep -q "rsiBbEvidenceLines" elliott-reports.js
          grep -q "EW-DOSSIER-AI-4-DUAL-ENGINE" elliott-ai.js

      - id: config
        name: Resolve Google authentication
        env:
          WIF_PROVIDER_SECRET: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_PROVIDER_VAR: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          set -euo pipefail
          WIF_PROVIDER="${WIF_PROVIDER_SECRET:-$WIF_PROVIDER_VAR}"
          test -n "$WIF_PROVIDER" || { echo '::error::GCP_WIF_PROVIDER is missing'; exit 1; }
          echo "wif_provider=$WIF_PROVIDER" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Ensure Artifact Registry repository
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID"
          if gcloud artifacts repositories describe "$GAR_REPOSITORY" --location "$GCP_REGION" >/dev/null 2>&1; then
            echo "Artifact Registry $GAR_REPOSITORY already exists in $GCP_REGION."
          else
            echo "Creating Artifact Registry $GAR_REPOSITORY in $GCP_REGION..."
            gcloud artifacts repositories create "$GAR_REPOSITORY" \
              --repository-format=docker \
              --location="$GCP_REGION" \
              --description='FXGA Cloud Run application containers' \
              --quiet
          fi
          gcloud artifacts repositories describe "$GAR_REPOSITORY" --location "$GCP_REGION" --format='value(name)'

      - name: Ensure protected Gemini and MT5 secrets
        env:
          GEMINI_FROM_GITHUB: ${{ secrets.GEMINI_API_KEY }}
          MT5_FROM_GITHUB: ${{ secrets.FXGA_MT5_REPORT_SECRET }}
        run: |
          set -euo pipefail
          ensure_secret() {
            local name="$1" value="$2"
            if gcloud secrets describe "$name" >/dev/null 2>&1; then
              if [ -n "$value" ]; then
                printf '%s' "$value" | gcloud secrets versions add "$name" --data-file=- --quiet
              fi
            else
              test -n "$value" || { echo "::error::$name is missing from both Secret Manager and GitHub Actions"; exit 1; }
              printf '%s' "$value" | gcloud secrets create "$name" --replication-policy=automatic --data-file=- --quiet
            fi
          }
          ensure_secret "$GEMINI_SECRET_NAME" "${GEMINI_FROM_GITHUB:-}"
          ensure_secret "$REPORT_SECRET_NAME" "${MT5_FROM_GITHUB:-}"
          gcloud secrets add-iam-policy-binding "$GEMINI_SECRET_NAME" --member="serviceAccount:$RUNTIME_SERVICE_ACCOUNT" --role='roles/secretmanager.secretAccessor' --quiet || true
          gcloud secrets add-iam-policy-binding "$REPORT_SECRET_NAME" --member="serviceAccount:$RUNTIME_SERVICE_ACCOUNT" --role='roles/secretmanager.secretAccessor' --quiet || true

      - name: Build and push dual-engine API container
        run: |
          set -euo pipefail
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY/$SERVICE:${GITHUB_SHA}"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build --pull -f google-cloud-app/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy dual-engine Cloud Run API
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --cpu 1 \
            --memory 1Gi \
            --concurrency 80 \
            --min 0 \
            --max 3 \
            --timeout 3600 \
            --set-env-vars "GCP_PROJECT_ID=$GCP_PROJECT_ID,FXGA_ARCHITECTURE=google-cloud-processing-cloudflare-static-hosting,FXGA_PUBLIC_ORIGIN=https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev,GEMINI_MODEL=$GEMINI_MODEL,GEMINI_FALLBACK_MODEL=$GEMINI_FALLBACK_MODEL,GEMINI_RESERVE_MODEL=$GEMINI_RESERVE_MODEL,GEMINI_SECRET_NAME=$GEMINI_SECRET_NAME" \
            --set-secrets "GEMINI_API_KEY=$GEMINI_SECRET_NAME:latest,FXGA_MT5_REPORT_SECRET=$REPORT_SECRET_NAME:latest"
          APP_URL="$(gcloud run services describe "$SERVICE" --region "$GCP_REGION" --platform managed --format='value(status.url)')"
          test -n "$APP_URL"
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "Deployed $APP_URL"

      - name: Verify live dual-engine dossier contract
        run: |
          set -euo pipefail
          node <<'NODE'
          const base=process.env.APP_URL;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last;
          for(let i=0;i<30;i++){
            try{
              const h=await fetch(base+'/api/health',{headers:{'Cache-Control':'no-cache'}});
              const ht=await h.text();
              if(!h.ok) throw new Error(`health ${h.status}: ${ht.slice(0,300)}`);
              const health=JSON.parse(ht);
              if(health.elliottReports?.enabled!==true) throw new Error('elliottReports health disabled');
              if(health.elliottReports?.dossierVersion!=='FXGA_60D_AI_DOSSIER_3_DUAL_ENGINE') throw new Error(`wrong dossier ${health.elliottReports?.dossierVersion}`);
              if(health.elliottReports?.defaultTimeframes!==21) throw new Error('expected 21 timeframes');
              if(health.elliottReports?.aiInputMode!=='single-pdf-dossier') throw new Error('AI is not using the single PDF dossier');
              const r=await fetch(base+'/api/elliott-reports',{headers:{'Cache-Control':'no-cache'}});
              const rt=await r.text();
              if(!r.ok) throw new Error(`reports ${r.status}: ${rt.slice(0,300)}`);
              const reports=JSON.parse(rt);
              if(reports.dossierVersion!=='FXGA_60D_AI_DOSSIER_3_DUAL_ENGINE') throw new Error(`listing wrong dossier ${reports.dossierVersion}`);
              console.log('FXGA_DUAL_ENGINE_LIVE',JSON.stringify({base,dossier:reports.dossierVersion,timeframes:reports.timeframes?.length,storage:reports.storage,aiInputMode:reports.aiInputMode,bridge:reports.bridge}));
              process.exit(0);
            }catch(e){last=e; await sleep(4000);}
          }
          throw last||new Error('dual-engine Cloud Run API not ready');
          NODE
