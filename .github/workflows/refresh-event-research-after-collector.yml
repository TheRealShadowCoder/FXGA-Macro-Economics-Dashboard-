name: Refresh FXGA Event Research After Collector Deploy

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy FXGA Google Cloud Collector']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/force-event-research-refresh.trigger'

permissions:
  contents: read
  id-token: write

env:
  SERVICE: fxga-macro-collector
  GCP_PROJECT_ID: fxglobalavengerstradingacademy
  GCP_REGION: us-central1
  DEPLOY_SERVICE_ACCOUNT: fxga-github-deployer@fxglobalavengerstradingacademy.iam.gserviceaccount.com

jobs:
  rebuild:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - id: config
        env:
          WIF_PROVIDER_SECRET: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_PROVIDER_VAR: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          WIF_PROVIDER="${WIF_PROVIDER_SECRET:-$WIF_PROVIDER_VAR}"
          test -n "$WIF_PROVIDER" || { echo '::error::GCP_WIF_PROVIDER missing'; exit 1; }
          echo "wif_provider=$WIF_PROVIDER" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: service
        run: |
          gcloud config set project "$GCP_PROJECT_ID"
          SERVICE_URL=$(gcloud run services describe "$SERVICE" --region "$GCP_REGION" --format='value(status.url)')
          test -n "$SERVICE_URL"
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
      - id: invoke
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.url }}
          id_token_include_email: true
      - name: Rebuild 60-day evidence, profiles and OOS tests
        env:
          TOKEN: ${{ steps.invoke.outputs.id_token }}
        run: |
          STATUS=$(curl --max-time 900 -sS -o /tmp/event-research.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"days":60,"maxEvents":600,"force":true}' "$SERVICE_URL/event-study-backfill")
          echo "event research HTTP $STATUS"
          test "$STATUS" -ge 200 -a "$STATUS" -lt 300 || { head -c 4000 /tmp/event-research.json; exit 1; }
          cat /tmp/event-research.json | head -c 10000
      - name: Verify rebuilt research contracts
        env:
          TOKEN: ${{ steps.invoke.outputs.id_token }}
        run: |
          curl --max-time 90 -fsS -H "Authorization: Bearer $TOKEN" "$SERVICE_URL/state" > /tmp/state.json
          node <<'NODE'
          const fs=require('fs');const state=JSON.parse(fs.readFileSync('/tmp/state.json','utf8')),research=state?.eventStudies?.payload||{},pattern=research.patternResearch||{},backtest=research.backtestResearch||{};
          if(Number(research.studyCount||0)<1)throw new Error('No event studies after rebuild');
          if(!Array.isArray(research.preNewsWindows)||research.preNewsWindows.length!==9)throw new Error('Pre-news windows incomplete');
          if(!Array.isArray(research.horizons)||research.horizons.length!==9)throw new Error('Post-release horizons incomplete');
          if(!pattern.researchGovernance?.outOfSampleRequired)throw new Error('Pattern OOS governance missing');
          if(!backtest.schema?.startsWith('fxga.event-pattern-backtest.'))throw new Error('OOS backtest state missing');
          const report={schema:'fxga.event-research.refresh.v1',generatedAt:new Date().toISOString(),studyCount:Number(research.studyCount||0),preNewsWindows:research.preNewsWindows.length,horizons:research.horizons.length,profiles:Number(pattern.profiles||0),recurringProfiles:Number(pattern.recurringProfiles||0),tests:Number(backtest.tests||0),validatedCandidates:Number(backtest.validatedCandidates||0),backtestSchema:backtest.schema};
          fs.writeFileSync('/tmp/event-research-verified.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report,null,2));
          NODE
      - name: Upload verified research report
        uses: actions/upload-artifact@v4
        with:
          name: fxga-event-research-refresh
          path: /tmp/event-research-verified.json
          retention-days: 14

  attest:
    needs: rebuild
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download verified report
        if: ${{ needs.rebuild.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: fxga-event-research-refresh
          path: runtime
      - name: Publish event research refresh status
        env:
          CONCLUSION: ${{ needs.rebuild.result }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p runtime
          if [ -f runtime/event-research-verified.json ]; then
            mv runtime/event-research-verified.json runtime/event-research-refresh-status.json
          else
            node <<'NODE'
          const fs=require('fs');
          fs.writeFileSync('runtime/event-research-refresh-status.json',JSON.stringify({schema:'fxga.event-research.refresh.v1',generatedAt:new Date().toISOString(),conclusion:process.env.CONCLUSION,runId:Number(process.env.RUN_ID),error:`Event research rebuild ${process.env.CONCLUSION}`},null,2)+'\n');
          NODE
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/event-research-refresh-status.json
          git diff --cached --quiet || git commit -m 'Record event research refresh status [skip ci]'
          git push origin HEAD:main
