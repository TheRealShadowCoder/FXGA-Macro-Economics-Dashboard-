name: Gemini Provider Probe Final

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/gemini-provider-probe-final-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

env:
  PRIMARY_MODEL: gemini-3.5-flash-lite
  RESERVE_MODEL: gemini-3.7-flash

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Direct Gemini provider test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';

          const key = String(process.env.GEMINI_API_KEY || '').trim();
          const primary = process.env.PRIMARY_MODEL || 'gemini-3.5-flash-lite';
          const reserve = process.env.RESERVE_MODEL || 'gemini-3.7-flash';
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const out = '/tmp/gemini-provider-result.json';
          const result = {
            schema: 'fxga.gemini.provider-probe.final.v1',
            runId: Number(process.env.GITHUB_RUN_ID || 0),
            startedAt: new Date().toISOString(),
            bypasses: ['Cloud Run', 'Firestore cache', 'FXGA provider cooldown', 'frontend'],
            file: {},
          };
          const save = () => fs.writeFileSync(out, JSON.stringify(result, null, 2) + '\n');
          save();

          if (!key) {
            result.fatal = 'missing_gemini_api_key';
            result.completedAt = new Date().toISOString();
            save();
            process.exit(0);
          }

          let fileUri = '';
          let fileName = '';
          try {
            const csv = Buffer.from('field,value\nprobe,FXGA_FILE_PROVIDER_OK\n', 'utf8');
            const start = await fetch('https://generativelanguage.googleapis.com/upload/v1beta/files', {
              method: 'POST',
              headers: {
                'x-goog-api-key': key,
                'X-Goog-Upload-Protocol': 'resumable',
                'X-Goog-Upload-Command': 'start',
                'X-Goog-Upload-Header-Content-Length': String(csv.length),
                'X-Goog-Upload-Header-Content-Type': 'text/csv',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ file: { display_name: 'fxga-direct-provider-probe.csv' } }),
            });
            const uploadUrl = String(start.headers.get('x-goog-upload-url') || '');
            result.file.startHttp = start.status;
            result.file.uploadUrlReturned = Boolean(uploadUrl);
            if (!uploadUrl) {
              const body = await start.text().catch(() => '');
              result.file.startError = body.slice(0, 300);
            } else {
              const finish = await fetch(uploadUrl, {
                method: 'POST',
                headers: {
                  'Content-Length': String(csv.length),
                  'Content-Type': 'text/csv',
                  'X-Goog-Upload-Offset': '0',
                  'X-Goog-Upload-Command': 'upload, finalize',
                },
                body: csv,
              });
              result.file.uploadHttp = finish.status;
              const payload = await finish.json().catch(() => ({}));
              const file = payload.file || payload || {};
              fileUri = String(file.uri || '');
              fileName = String(file.name || '');
              let state = String(file.state || 'UNKNOWN');
              for (let i = 0; i < 20 && fileName && state !== 'ACTIVE' && state !== 'FAILED'; i++) {
                await sleep(1000);
                const meta = await fetch(`https://generativelanguage.googleapis.com/v1beta/${fileName}`, {
                  headers: { 'x-goog-api-key': key },
                });
                const data = await meta.json().catch(() => ({}));
                state = String(data.state || 'UNKNOWN');
              }
              result.file.state = state;
              result.file.mimeType = String(file.mimeType || file.mime_type || 'text/csv');
              result.file.hasUri = Boolean(fileUri);
              result.file.hasName = Boolean(fileName);
            }
          } catch (e) {
            result.file.exception = String(e?.message || e).slice(0, 300);
          }
          save();

          async function interaction(model, input) {
            try {
              const response = await fetch('https://generativelanguage.googleapis.com/v1/interactions', {
                method: 'POST',
                headers: {
                  'x-goog-api-key': key,
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  model,
                  input,
                  store: false,
                  generation_config: { max_output_tokens: 32 },
                }),
              });
              const retryAfter = response.headers.get('retry-after');
              const data = await response.json().catch(() => ({}));
              const answer = Array.isArray(data.steps)
                ? data.steps.flatMap(step => step?.type === 'model_output' && Array.isArray(step.content)
                    ? step.content.filter(x => x?.type === 'text').map(x => String(x.text || ''))
                    : []).join('')
                : '';
              return {
                model,
                http: response.status,
                retryAfter: retryAfter || null,
                errorStatus: data?.error?.status || null,
                errorMessage: data?.error?.message ? String(data.error.message).slice(0, 300) : null,
                answer,
              };
            } catch (e) {
              return { model, http: 0, retryAfter: null, errorStatus: 'NETWORK_EXCEPTION', errorMessage: String(e?.message || e).slice(0, 300), answer: '' };
            }
          }

          // Production reported about 45 seconds. Wait longer before any inference request.
          await sleep(50_000);

          if (result.file.state === 'ACTIVE' && fileUri) {
            result.fileInteraction = await interaction(primary, [
              { type: 'document', uri: fileUri, mime_type: 'text/csv' },
              { type: 'text', text: 'Reply with exactly the probe value.' },
            ]);
            save();
          }

          await sleep(10_000);
          result.inlinePrimary = await interaction(primary, 'Reply with exactly: FXGA_INLINE_PROVIDER_OK');
          save();

          await sleep(10_000);
          result.inlineReserve = await interaction(reserve, 'Reply with exactly: FXGA_INLINE_PROVIDER_OK');
          result.completedAt = new Date().toISOString();
          save();
          console.log(JSON.stringify(result, null, 2));
          NODE

      - name: Persist sanitized provider result
        if: always()
        uses: actions/github-script@v9
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = 'diagnostics/gemini-provider-latest.json';
            const raw = fs.existsSync('/tmp/gemini-provider-result.json')
              ? fs.readFileSync('/tmp/gemini-provider-result.json', 'utf8')
              : JSON.stringify({schema:'fxga.gemini.provider-probe.final.v1',runId:Number(process.env.GITHUB_RUN_ID),fatal:'no_result'}, null, 2);
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner:context.repo.owner, repo:context.repo.repo, path, ref:'main'});
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'Record definitive Gemini provider probe [skip ci]',
              content: Buffer.from(raw).toString('base64'),
              branch: 'main',
              ...(sha ? {sha} : {})
            });
