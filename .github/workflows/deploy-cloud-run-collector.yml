name: Deploy FXGA Google Cloud Collector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud-run-collector/**'
      - '.github/workflows/deploy-cloud-run-collector.yml'

permissions:
  contents: read
  id-token: write

env:
  SERVICE: fxga-macro-collector
  GAR_REPOSITORY: fxga-containers
  TASK_QUEUE: fxga-release-checks
  GCP_PROJECT_ID: fxglobalavengerstradingacademy
  GCP_REGION: us-central1
  DEPLOY_SERVICE_ACCOUNT: fxga-github-deployer@fxglobalavengerstradingacademy.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: fxga-collector-runtime@fxglobalavengerstradingacademy.iam.gserviceaccount.com

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate collector syntax
        working-directory: cloud-run-collector
        run: npm run check

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: config
        name: Check Google deployment configuration
        env:
          WIF_PROVIDER_SECRET: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_PROVIDER_VAR: ${{ vars.GCP_WIF_PROVIDER }}
          WEBHOOK_SECRET: ${{ secrets.COLLECTOR_WEBHOOK_SECRET }}
        run: |
          WIF_PROVIDER="${WIF_PROVIDER_SECRET:-$WIF_PROVIDER_VAR}"
          missing=0
          if [ -z "$WIF_PROVIDER" ]; then
            echo '::error::Missing GCP_WIF_PROVIDER. Add it under repository Settings > Secrets and variables > Actions as either a Variable or Secret.'
            missing=1
          fi
          if [ -z "$WEBHOOK_SECRET" ]; then
            echo '::error::Missing COLLECTOR_WEBHOOK_SECRET. Add it under repository Settings > Secrets and variables > Actions > Secrets.'
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "wif_provider=$WIF_PROVIDER" >> "$GITHUB_OUTPUT"
          echo 'Google Cloud deployment configuration is present.'

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure project and APIs
        run: |
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud services enable run.googleapis.com artifactregistry.googleapis.com firestore.googleapis.com cloudtasks.googleapis.com cloudscheduler.googleapis.com secretmanager.googleapis.com

      - name: Ensure Artifact Registry and Cloud Tasks queue
        run: |
          gcloud artifacts repositories describe "$GAR_REPOSITORY" --location "$GCP_REGION" >/dev/null 2>&1 || \
            gcloud artifacts repositories create "$GAR_REPOSITORY" --repository-format=docker --location "$GCP_REGION"
          gcloud tasks queues describe "$TASK_QUEUE" --location "$GCP_REGION" >/dev/null 2>&1 || \
            gcloud tasks queues create "$TASK_QUEUE" --location "$GCP_REGION" --max-concurrent-dispatches=2 --max-dispatches-per-second=4

      - name: Ensure collector secrets in Secret Manager
        env:
          COLLECTOR_WEBHOOK_SECRET: ${{ secrets.COLLECTOR_WEBHOOK_SECRET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          gcloud secrets describe fxga-collector-webhook-secret >/dev/null 2>&1 || gcloud secrets create fxga-collector-webhook-secret --replication-policy=automatic
          printf '%s' "$COLLECTOR_WEBHOOK_SECRET" | gcloud secrets versions add fxga-collector-webhook-secret --data-file=-
          if [ -z "$FRED_API_KEY" ]; then
            echo '::error::FRED_API_KEY repository secret is not configured.'
            exit 1
          fi
          gcloud secrets describe fxga-fred-api-key >/dev/null 2>&1 || gcloud secrets create fxga-fred-api-key --replication-policy=automatic
          printf '%s' "$FRED_API_KEY" | gcloud secrets versions add fxga-fred-api-key --data-file=-

      - name: Grant runtime secret access before deploy
        run: |
          gcloud secrets add-iam-policy-binding fxga-collector-webhook-secret \
            --member="serviceAccount:$RUNTIME_SERVICE_ACCOUNT" \
            --role=roles/secretmanager.secretAccessor >/dev/null
          gcloud secrets add-iam-policy-binding fxga-fred-api-key \
            --member="serviceAccount:$RUNTIME_SERVICE_ACCOUNT" \
            --role=roles/secretmanager.secretAccessor >/dev/null

      - name: Build and push container
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY/$SERVICE:${GITHUB_SHA}"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" cloud-run-collector
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy private Cloud Run service
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --platform managed \
            --no-allow-unauthenticated \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --cpu 1 \
            --memory 1Gi \
            --concurrency 20 \
            --min 0 \
            --max 2 \
            --timeout 300 \
            --set-env-vars "GCP_PROJECT_ID=$GCP_PROJECT_ID,GCP_REGION=$GCP_REGION,CLOUD_TASKS_QUEUE=$TASK_QUEUE,CLOUD_TASKS_INVOKER_SA=$RUNTIME_SERVICE_ACCOUNT,CALENDAR_DAYS=14,MAX_BROWSER_SECONDS=25,GLOBAL_FRED_TARGET=180,CLOUDFLARE_WEBHOOK_URL=https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev/api/collector-webhook" \
            --set-secrets "COLLECTOR_WEBHOOK_SECRET=fxga-collector-webhook-secret:latest,FRED_API_KEY=fxga-fred-api-key:latest"
          SERVICE_URL=$(gcloud run services describe "$SERVICE" --region "$GCP_REGION" --format='value(status.url)')
          gcloud run services update "$SERVICE" --region "$GCP_REGION" --update-env-vars "CLOUD_RUN_SERVICE_URL=$SERVICE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"

      - name: Configure Cloud Run invocation IAM
        run: |
          gcloud run services add-iam-policy-binding "$SERVICE" \
            --region "$GCP_REGION" \
            --member="serviceAccount:$RUNTIME_SERVICE_ACCOUNT" \
            --role=roles/run.invoker >/dev/null

      - name: Configure three free-tier scheduler jobs
        run: |
          upsert_job() {
            NAME="$1"; SCHEDULE="$2"; URI="$3"; BODY="$4"
            if gcloud scheduler jobs describe "$NAME" --location "$GCP_REGION" >/dev/null 2>&1; then
              gcloud scheduler jobs update http "$NAME" --location "$GCP_REGION" --schedule="$SCHEDULE" --time-zone='Etc/UTC' --uri="$URI" --http-method=POST --headers='Content-Type=application/json' --message-body="$BODY" --oidc-service-account-email="$RUNTIME_SERVICE_ACCOUNT" --oidc-token-audience="$SERVICE_URL"
            else
              gcloud scheduler jobs create http "$NAME" --location "$GCP_REGION" --schedule="$SCHEDULE" --time-zone='Etc/UTC' --uri="$URI" --http-method=POST --headers='Content-Type=application/json' --message-body="$BODY" --oidc-service-account-email="$RUNTIME_SERVICE_ACCOUNT" --oidc-token-audience="$SERVICE_URL"
            fi
          }
          upsert_job fxga-calendar-bootstrap '5 0 * * *' "$SERVICE_URL/bootstrap" '{}'
          upsert_job fxga-fast-global-macro '0 * * * *' "$SERVICE_URL/macro-sync?mode=fast" '{"mode":"fast"}'
          upsert_job fxga-full-global-macro '20 0 * * *' "$SERVICE_URL/macro-sync?mode=full" '{"mode":"full"}'

      - name: Deployment summary
        run: |
          echo "Cloud Run collector: $SERVICE_URL"
          echo "Google project: $GCP_PROJECT_ID"
          echo "Runtime identity: $RUNTIME_SERVICE_ACCOUNT"
          echo "Calendar bootstrap: daily at 00:05 UTC"
          echo "Fast macro/rates/FX/risk sync: hourly"
          echo "Full 109+ dynamic USA/Europe/UK/South Africa/Japan FRED sync: daily at 00:20 UTC"
          echo "Release checks: exact event-time Cloud Tasks"
