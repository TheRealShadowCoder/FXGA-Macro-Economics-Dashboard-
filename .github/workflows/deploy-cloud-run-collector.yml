name: Deploy FXGA Google Cloud Collector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud-run-collector/**'
      - '.github/workflows/deploy-cloud-run-collector.yml'

concurrency:
  group: fxga-google-cloud-production
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  SERVICE: fxga-macro-collector
  GAR_REPOSITORY: fxga-containers
  TASK_QUEUE: fxga-release-checks
  GCP_PROJECT_ID: fxglobalavengerstradingacademy
  GCP_REGION: us-central1
  DEPLOY_SERVICE_ACCOUNT: fxga-github-deployer@fxglobalavengerstradingacademy.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: fxga-collector-runtime@fxglobalavengerstradingacademy.iam.gserviceaccount.com

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install collector dependencies
        working-directory: cloud-run-collector
        run: npm install --ignore-scripts --no-fund --no-audit
      - name: Validate collector syntax and quota safeguards
        working-directory: cloud-run-collector
        run: npm run check
      - name: Enforce production dependency security
        working-directory: cloud-run-collector
        run: npm audit --omit=dev --audit-level=moderate

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: config
        name: Check Google deployment configuration
        env:
          WIF_PROVIDER_SECRET: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_PROVIDER_VAR: ${{ vars.GCP_WIF_PROVIDER }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          NASDAQ_DATA_LINK_API_KEY: ${{ secrets.NASDAQ_DATA_LINK_API_KEY }}
        run: |
          WIF_PROVIDER="${WIF_PROVIDER_SECRET:-$WIF_PROVIDER_VAR}"
          missing=0
          require_value() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::error::Missing required production setting: $name"
              missing=1
            fi
          }
          require_value GCP_WIF_PROVIDER "$WIF_PROVIDER"
          require_value FRED_API_KEY "$FRED_API_KEY"
          require_value ALPHA_VANTAGE_API_KEY "$ALPHA_VANTAGE_API_KEY"
          require_value TWELVE_DATA_API_KEY "$TWELVE_DATA_API_KEY"
          require_value FINNHUB_API_KEY "$FINNHUB_API_KEY"
          require_value MARKETSTACK_API_KEY "$MARKETSTACK_API_KEY"
          require_value FMP_API_KEY "$FMP_API_KEY"
          require_value NASDAQ_DATA_LINK_API_KEY "$NASDAQ_DATA_LINK_API_KEY"
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "wif_provider=$WIF_PROVIDER" >> "$GITHUB_OUTPUT"
          echo 'Google Cloud deployment configuration and all market-data credentials are present.'

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Google Cloud services
        run: |
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud services enable run.googleapis.com artifactregistry.googleapis.com firestore.googleapis.com cloudtasks.googleapis.com cloudscheduler.googleapis.com secretmanager.googleapis.com

      - name: Ensure Artifact Registry and Cloud Tasks queue
        run: |
          gcloud artifacts repositories describe "$GAR_REPOSITORY" --location "$GCP_REGION" >/dev/null 2>&1 || \
            gcloud artifacts repositories create "$GAR_REPOSITORY" --repository-format=docker --location "$GCP_REGION"
          gcloud tasks queues describe "$TASK_QUEUE" --location "$GCP_REGION" >/dev/null 2>&1 || \
            gcloud tasks queues create "$TASK_QUEUE" --location "$GCP_REGION" --max-concurrent-dispatches=2 --max-dispatches-per-second=4

      - name: Ensure Google Secret Manager provider credentials
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          NASDAQ_DATA_LINK_API_KEY: ${{ secrets.NASDAQ_DATA_LINK_API_KEY }}
        run: |
          ensure_secret() {
            local secret_name="$1" secret_value="$2"
            test -n "$secret_value" || { echo "::error::Required repository secret for $secret_name is empty."; exit 1; }
            gcloud secrets describe "$secret_name" >/dev/null 2>&1 || gcloud secrets create "$secret_name" --replication-policy=automatic
            printf '%s' "$secret_value" | gcloud secrets versions add "$secret_name" --data-file=- >/dev/null
          }
          ensure_secret fxga-fred-api-key "$FRED_API_KEY"
          ensure_secret fxga-alpha-vantage-api-key "$ALPHA_VANTAGE_API_KEY"
          ensure_secret fxga-twelve-data-api-key "$TWELVE_DATA_API_KEY"
          ensure_secret fxga-finnhub-api-key "$FINNHUB_API_KEY"
          ensure_secret fxga-marketstack-api-key "$MARKETSTACK_API_KEY"
          ensure_secret fxga-fmp-api-key "$FMP_API_KEY"
          ensure_secret fxga-nasdaq-data-link-api-key "$NASDAQ_DATA_LINK_API_KEY"
          echo 'COLLECTOR_SECRET_BINDINGS=FRED_API_KEY=fxga-fred-api-key:latest,ALPHA_VANTAGE_API_KEY=fxga-alpha-vantage-api-key:latest,TWELVE_DATA_API_KEY=fxga-twelve-data-api-key:latest,FINNHUB_API_KEY=fxga-finnhub-api-key:latest,MARKETSTACK_API_KEY=fxga-marketstack-api-key:latest,FMP_API_KEY=fxga-fmp-api-key:latest,NASDAQ_DATA_LINK_API_KEY=fxga-nasdaq-data-link-api-key:latest' >> "$GITHUB_ENV"
          echo 'ALL_SECRET_NAMES=fxga-fred-api-key fxga-alpha-vantage-api-key fxga-twelve-data-api-key fxga-finnhub-api-key fxga-marketstack-api-key fxga-fmp-api-key fxga-nasdaq-data-link-api-key' >> "$GITHUB_ENV"

      - name: Grant collector runtime secret access
        run: |
          for SECRET_NAME in $ALL_SECRET_NAMES; do
            gcloud secrets add-iam-policy-binding "$SECRET_NAME" --member="serviceAccount:$RUNTIME_SERVICE_ACCOUNT" --role=roles/secretmanager.secretAccessor >/dev/null
          done

      - name: Build and push private collector
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY/$SERVICE:${GITHUB_SHA}"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" cloud-run-collector
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - id: service
        name: Deploy private Google Cloud collector
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --platform managed \
            --no-allow-unauthenticated \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --command node \
            --args src/launcher-google-cloud.js \
            --cpu 1 \
            --memory 1Gi \
            --concurrency 20 \
            --min 0 \
            --max 2 \
            --timeout 900 \
            --set-env-vars "GCP_PROJECT_ID=$GCP_PROJECT_ID,GCP_REGION=$GCP_REGION,CLOUD_TASKS_QUEUE=$TASK_QUEUE,CLOUD_TASKS_INVOKER_SA=$RUNTIME_SERVICE_ACCOUNT,CALENDAR_DAYS=14,MAX_BROWSER_SECONDS=25,GLOBAL_FRED_TARGET=180,FXGA_ARCHITECTURE=google-cloud-only" \
            --set-secrets "$COLLECTOR_SECRET_BINDINGS"
          SERVICE_URL=$(gcloud run services describe "$SERVICE" --region "$GCP_REGION" --format='value(status.url)')
          gcloud run services update "$SERVICE" --region "$GCP_REGION" --update-env-vars "CLOUD_RUN_SERVICE_URL=$SERVICE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

      - name: Configure private invocation IAM
        run: |
          gcloud run services add-iam-policy-binding "$SERVICE" --region "$GCP_REGION" --member="serviceAccount:$RUNTIME_SERVICE_ACCOUNT" --role=roles/run.invoker >/dev/null

      - id: invoke
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.url }}
          id_token_include_email: true

      - name: Verify provider credentials and zero Cloudflare runtime bindings
        env:
          TOKEN: ${{ steps.invoke.outputs.id_token }}
        run: |
          code=$(curl --max-time 120 -sS -o /tmp/health.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$SERVICE_URL/health")
          test "$code" -eq 200 || { cat /tmp/health.json; exit 1; }
          gcloud run services describe "$SERVICE" --region "$GCP_REGION" --format=json > /tmp/service.json
          node <<'NODE'
          const fs=require('fs');
          const health=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const required=['alpha_vantage','twelve_data','finnhub','marketstack','fmp','nasdaq_data_link'];
          const providers=health?.freeTierMarketData?.providers||{};
          const missing=required.filter(id=>providers[id]?.configured!==true);
          if(missing.length)throw new Error(`Running Cloud Run revision is missing provider credentials: ${missing.join(', ')}`);
          const service=JSON.parse(fs.readFileSync('/tmp/service.json','utf8'));
          const env=service?.spec?.template?.spec?.containers?.[0]?.env||service?.template?.containers?.[0]?.env||[];
          const names=env.map(x=>String(x.name||''));
          for(const forbidden of ['CLOUDFLARE_WEBHOOK_URL','COLLECTOR_WEBHOOK_SECRET'])if(names.includes(forbidden))throw new Error(`Forbidden Cloudflare runtime binding remains: ${forbidden}`);
          console.log('Google Cloud only collector verified. Providers:',required.join(', '));
          NODE

      - name: Configure Google Cloud Scheduler jobs
        run: |
          upsert_job() {
            NAME="$1"; SCHEDULE="$2"; URI="$3"; BODY="$4"; DEADLINE="$5"
            if gcloud scheduler jobs describe "$NAME" --location "$GCP_REGION" >/dev/null 2>&1; then
              gcloud scheduler jobs update http "$NAME" --location "$GCP_REGION" --schedule="$SCHEDULE" --time-zone='Etc/UTC' --uri="$URI" --http-method=POST --update-headers='Content-Type=application/json' --message-body="$BODY" --oidc-service-account-email="$RUNTIME_SERVICE_ACCOUNT" --oidc-token-audience="$SERVICE_URL" --attempt-deadline="$DEADLINE"
            else
              gcloud scheduler jobs create http "$NAME" --location "$GCP_REGION" --schedule="$SCHEDULE" --time-zone='Etc/UTC' --uri="$URI" --http-method=POST --headers='Content-Type=application/json' --message-body="$BODY" --oidc-service-account-email="$RUNTIME_SERVICE_ACCOUNT" --oidc-token-audience="$SERVICE_URL" --attempt-deadline="$DEADLINE"
            fi
          }
          upsert_job fxga-calendar-bootstrap '5 0 * * *' "$SERVICE_URL/bootstrap" '{}' '180s'
          upsert_job fxga-fast-global-macro '0 * * * *' "$SERVICE_URL/macro-sync?mode=fast" '{"mode":"fast"}' '180s'
          upsert_job fxga-full-global-macro '20 0 * * *' "$SERVICE_URL/macro-sync?mode=full" '{"mode":"full"}' '900s'

      - name: Deployment summary
        run: |
          echo "Private collector: $SERVICE_URL"
          echo "Compute: Google Cloud Run only"
          echo "State: Google Cloud Firestore"
          echo "Scheduling: Google Cloud Scheduler + Cloud Tasks"
          echo "Secrets: Google Secret Manager"
          echo "Cloudflare processing: DISABLED"
          echo "Direct Cloudflare egress: BLOCKED by launcher-google-cloud.js"
          echo "Free-tier market router: persistent Firestore budgets and hard quota reserves enabled"
