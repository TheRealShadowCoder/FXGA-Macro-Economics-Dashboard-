name: Audit FXGA Production and Publish Result

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-production-and-publish.yml'
      - 'scripts/production-audit.mjs'
  workflow_run:
    workflows:
      - 'Deploy FXGA Cloudflare Static Website'
      - 'Deploy FXGA Google Cloud Application'
      - 'Deploy FXGA Google Cloud MT5 Signal Ingress'
    types: [completed]

permissions:
  contents: write

concurrency:
  group: fxga-production-published-audit
  cancel-in-progress: true

jobs:
  audit:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate audit harness
        run: node --check scripts/production-audit.mjs

      - name: Run production audit
        id: audit
        continue-on-error: true
        run: |
          rm -f runtime/production-audit.json
          node scripts/production-audit.mjs

      - name: Publish audit report
        if: always()
        run: |
          mkdir -p runtime
          test -f runtime/production-audit.json || printf '%s\n' '{"schema":"fxga.production.audit.v2","passed":false,"generatedAt":"unknown","summary":{"passed":0,"failed":1,"total":1},"checks":[{"name":"audit-runner","passed":false,"error":"report was not generated"}]}' > runtime/production-audit.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/production-audit.json
          if git diff --cached --quiet; then
            echo 'Audit report unchanged.'
          else
            git commit -m "Publish FXGA production audit result [skip ci]"
            git push origin HEAD:main
          fi

      - name: Fail workflow if audit failed
        if: always()
        run: |
          node -e "const r=JSON.parse(require('fs').readFileSync('runtime/production-audit.json','utf8'));if(!r.passed){console.error(JSON.stringify(r,null,2));process.exit(1)}"
