name: Deploy FXGA Google Cloud MT5 Signal Ingress

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'google-cloud-mt5-ingress/**'
      - '.github/workflows/deploy-google-cloud-mt5-ingress.yml'

concurrency:
  group: fxga-google-cloud-mt5-ingress
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

env:
  SERVICE: fxga-mt5-signal-ingress
  GAR_REPOSITORY: fxga-containers
  GCP_PROJECT_ID: fxglobalavengerstradingacademy
  GCP_REGION: us-central1
  DEPLOY_SERVICE_ACCOUNT: fxga-github-deployer@fxglobalavengerstradingacademy.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: fxga-collector-runtime@fxglobalavengerstradingacademy.iam.gserviceaccount.com
  PUBLIC_ORIGIN: https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev
  MT5_SECRET_NAME: fxga-mt5-token-sha256

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate MT5 ingress
        working-directory: google-cloud-mt5-ingress
        run: |
          npm install --no-audit --no-fund
          npm run check
          node --check price-cache.js
          node --check mt5-smc-engine.js
          node --check server.js
          ! grep -Eq "FXGA_MT5_TOKEN_SHA256\|\|'[a-f0-9]{64}'" server.js || { echo '::error::Repository-static MT5 credential fallback detected'; exit 1; }

      - id: config
        name: Resolve Google authentication
        env:
          WIF_PROVIDER_SECRET: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_PROVIDER_VAR: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          WIF_PROVIDER="${WIF_PROVIDER_SECRET:-$WIF_PROVIDER_VAR}"
          test -n "$WIF_PROVIDER" || { echo '::error::GCP_WIF_PROVIDER is missing'; exit 1; }
          echo "wif_provider=$WIF_PROVIDER" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Ensure secret-backed MT5 authentication
        env:
          OPTIONAL_BOOTSTRAP_HASH: ${{ secrets.FXGA_MT5_TOKEN_SHA256 }}
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud services enable secretmanager.googleapis.com run.googleapis.com

          if ! gcloud secrets describe "$MT5_SECRET_NAME" >/dev/null 2>&1; then
            VALUE="${OPTIONAL_BOOTSTRAP_HASH:-}"
            if [ -z "$VALUE" ] && gcloud run services describe "$SERVICE" --region "$GCP_REGION" >/dev/null 2>&1; then
              # One-time migration from the currently deployed Cloud Run revision. The value
              # is captured into a shell variable and is never echoed to Actions logs.
              VALUE=$(gcloud run services describe "$SERVICE" --region "$GCP_REGION" --format=json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);const env=x?.spec?.template?.spec?.containers?.[0]?.env||[];process.stdout.write(String(env.find(e=>e.name==='FXGA_MT5_TOKEN_SHA256')?.value||''))})")
            fi
            printf '%s' "$VALUE" | grep -Eq '^[A-Fa-f0-9]{64}$' || { echo '::error::No valid MT5 token hash exists to migrate. Set GitHub secret FXGA_MT5_TOKEN_SHA256 once for bootstrap.'; exit 1; }
            gcloud secrets create "$MT5_SECRET_NAME" --replication-policy=automatic --quiet
            printf '%s' "$VALUE" | gcloud secrets versions add "$MT5_SECRET_NAME" --data-file=- --quiet >/dev/null
            unset VALUE
            echo 'Created MT5 authentication secret from an existing trusted value.'
          else
            echo 'MT5 authentication secret already exists.'
          fi

          gcloud secrets add-iam-policy-binding "$MT5_SECRET_NAME" \
            --member="serviceAccount:$RUNTIME_SERVICE_ACCOUNT" \
            --role="roles/secretmanager.secretAccessor" \
            --quiet >/dev/null

      - name: Build and push MT5 ingress
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud services enable run.googleapis.com artifactregistry.googleapis.com firestore.googleapis.com
          gcloud artifacts repositories describe "$GAR_REPOSITORY" --location "$GCP_REGION" >/dev/null 2>&1 || \
            gcloud artifacts repositories create "$GAR_REPOSITORY" --repository-format=docker --location "$GCP_REGION"
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY/$SERVICE:${GITHUB_SHA}"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build -f google-cloud-mt5-ingress/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - id: deploy
        name: Deploy public authenticated MT5 ingress
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --cpu 1 \
            --memory 256Mi \
            --concurrency 40 \
            --min 0 \
            --max 2 \
            --timeout 30 \
            --set-env-vars "GCP_PROJECT_ID=$GCP_PROJECT_ID,FXGA_PUBLIC_ORIGIN=$PUBLIC_ORIGIN,FXGA_ARCHITECTURE=google-cloud-direct" \
            --set-secrets "FXGA_MT5_TOKEN_SHA256=$MT5_SECRET_NAME:latest"
          MT5_URL=$(gcloud run services describe "$SERVICE" --region "$GCP_REGION" --format='value(status.url)')
          test -n "$MT5_URL" || { echo '::error::MT5 Cloud Run URL missing'; exit 1; }
          echo "MT5_URL=$MT5_URL" >> "$GITHUB_ENV"
          echo "url=$MT5_URL" >> "$GITHUB_OUTPUT"

      - name: Verify 60-day canonical M1 FIFO and SMC fusion contract
        run: |
          curl --fail --silent --show-error "$MT5_URL/health" -o /tmp/health.json
          node <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if(!h.ok||h.source!=='MetaTrader5'||h.schema!=='fxga.smc.signal.v3'||h.cloudflareProcessing!==false) process.exit(1);
          if(h.authentication?.configured!==true||h.authentication?.mode!=='sha256-token-secret') throw new Error('Secret-backed MT5 authentication contract missing');
          if(h.priceCache?.schema!=='fxga.mt5.price-cache.v2'||h.priceCache?.cacheEnvelopeBytes!==200000000||h.priceCache?.payloadHardBytes!==190000000) process.exit(1);
          if(h.priceCache?.initialBarsPerAsset!==86400||h.priceCache?.incrementalBarsPerSync!==160||h.priceCache?.syncSeconds!==300) process.exit(1);
          if(!Array.isArray(h.priceCache?.allowedSymbols)||h.priceCache.allowedSymbols.length!==16) process.exit(1);
          for(const asset of ['DXY','EURUSD','GBPUSD','USDJPY','USDZAR','US2Y','US10Y','SPX','NASDAQ','DJI','VIX','GOLD','WTI','BRENT','BTCUSD','ETHUSD']) if(!h.priceCache.allowedSymbols.includes(asset)) process.exit(1);
          if(h.smc?.canonicalTimeframe!=='M1'||!String(h.smc?.snapshot||'').includes('smc-snapshot')) process.exit(1);
          console.log('MT5 health contract verified');
          NODE

          curl --fail --silent --show-error "$MT5_URL/api/mt5/price-cache/status" -o /tmp/cache.json
          node <<'NODE'
          const fs=require('fs');
          const c=JSON.parse(fs.readFileSync('/tmp/cache.json','utf8'));
          if(c.retentionDays!==60) throw new Error(`Expected 60-day retention, received ${c.retentionDays}`);
          if(c.cacheEnvelopeBytes!==200000000||c.payloadHardBytes!==190000000||c.evictTargetBytes!==175000000) throw new Error('Cache safety envelope mismatch');
          if(c.initialBarsPerAsset!==86400||c.incrementalBarsPerSync!==160||c.syncSeconds!==300) throw new Error('60-day ingestion contract mismatch');
          if(!c.databaseHealth||typeof c.databaseHealth.assetsOnline!=='number'||c.databaseHealth.assetsExpected!==16) throw new Error('Database health contract missing');
          if(!c.management?.evictionArmed||!c.management?.timeFifoActive||c.management?.retentionDays!==60||!c.management?.compressionActive||!c.management?.deduplicationActive||!c.management?.integrityMonitoring||!c.management?.canonicalM1Only||!c.management?.reconstructionOnDemand) throw new Error('Storage-management contract mismatch');
          if(!c.sizeCalculator||c.sizeCalculator.retentionDays!==60||c.sizeCalculator.initialBarsPerAsset!==86400||c.sizeCalculator.incrementalBarsPerSync!==160||c.sizeCalculator.totalInitialTargetBars!==1382400) throw new Error('60-day capacity projection mismatch');
          if(!Array.isArray(c.derivedTimeframes)||!c.derivedTimeframes.includes('M30')||!c.derivedTimeframes.includes('H4')||!c.derivedTimeframes.includes('D1')) throw new Error('Derived timeframe contract missing');
          for(const asset of c.allowedSymbols){const row=c.series?.[`${asset}_M1`];if(!row||typeof row.integrityScore!=='number'||!Array.isArray(row.alerts)||!row.size||row.retentionDays!==60) throw new Error(`Series contract missing for ${asset}`);}
          console.log('60-day MT5 cache contract verified',c.databaseHealth,c.management,c.sizeCalculator);
          NODE

          curl --fail --silent --show-error "$MT5_URL/api/mt5/smc-snapshot" -o /tmp/smc.json
          node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('/tmp/smc.json','utf8'));if(s.canonicalTimeframe!=='M1'||s.methodology!=='canonical-mt5-m1-reconstructed-multi-timeframe-smc'||!s.counts)process.exit(1);console.log('SMC fusion verified',s.counts)"

          code=$(curl -sS -o /tmp/reject.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' "$MT5_URL/api/mt5/webhook")
          test "$code" -eq 403 || { cat /tmp/reject.json; exit 1; }
          code=$(curl -sS -o /tmp/cache-reject.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' "$MT5_URL/api/mt5/price-cache")
          test "$code" -eq 403 || { cat /tmp/cache-reject.json; exit 1; }

      - name: Publish resolved MT5 endpoint
        run: |
          mkdir -p runtime public
          printf '%s\n' "$MT5_URL/api/mt5/webhook" > runtime/mt5-cloud-url.txt
          node - <<'NODE'
          const fs=require('fs');
          const base=process.env.MT5_URL;
          const symbols=['DXY','EURUSD','GBPUSD','USDJPY','USDZAR','US2Y','US10Y','SPX','NASDAQ','DJI','VIX','GOLD','WTI','BRENT','BTCUSD','ETHUSD'];
          const payload={
            service:'fxga-mt5-signal-ingress',
            project:process.env.GCP_PROJECT_ID,
            region:process.env.GCP_REGION,
            baseUrl:base,
            webhookUrl:`${base}/api/mt5/webhook`,
            healthUrl:`${base}/health`,
            priceCacheIngestUrl:`${base}/api/mt5/price-cache`,
            priceCacheStatusUrl:`${base}/api/mt5/price-cache/status`,
            priceQueryUrl:`${base}/api/mt5/prices`,
            smcSnapshotUrl:`${base}/api/mt5/smc-snapshot`,
            priceCache:{
              source:'MetaTrader5',
              symbols,
              sourceTimeframe:'M1',
              retentionDays:60,
              maximumM1BarsPer24x7Asset:86400,
              incrementalBarsPerSync:160,
              syncSeconds:300,
              envelopeBytes:200000000,
              payloadHardBytes:190000000,
              evictionTargetBytes:175000000,
              policy:'rolling 60-day canonical M1 + gzip + timestamp dedupe + time FIFO + capacity FIFO + integrity diagnostics + deterministic higher-timeframe reconstruction'
            },
            authentication:{mode:'google-secret-manager-backed-sha256-token',repositoryFallback:false},
            updatedAt:new Date().toISOString(),
            cloudflareProcessing:false
          };
          fs.writeFileSync('runtime/mt5-cloud.json',JSON.stringify(payload,null,2)+'\n');
          fs.writeFileSync('public/mt5-cloud.json',JSON.stringify(payload,null,2)+'\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/mt5-cloud-url.txt runtime/mt5-cloud.json public/mt5-cloud.json
          if git diff --cached --quiet; then
            echo "Resolved MT5 endpoint is unchanged."
          else
            git commit -m "Record current MT5 Cloud Run endpoint [skip ci]"
            git push origin HEAD:main
          fi

      - name: Production summary
        run: |
          echo "MT5 Google Cloud service: $MT5_URL"
          echo "MT5 signal webhook: $MT5_URL/api/mt5/webhook"
          echo "MT5 price ingest: $MT5_URL/api/mt5/price-cache"
          echo "MT5 price query: $MT5_URL/api/mt5/prices"
          echo "MT5 SMC snapshot: $MT5_URL/api/mt5/smc-snapshot"
          echo "Authentication: Google Secret Manager-backed SHA-256 token digest; no repository fallback"
          echo "Canonical cache: rolling 60 calendar days of M1 for the 16 website assets; 160-bar overlap every 300 seconds"
          echo "Maximum 24/7 M1 observations per asset: 86,400; session-limited instruments retain fewer bars over the same 60-day clock window"
          echo "Storage: time FIFO first; 200 MB envelope / 190 MB payload hard ceiling / 175 MB capacity FIFO target"
          echo "SMC: M1 canonical; M5/M15/M30/H1/H4/D1 reconstructed deterministically"
          echo "Cloudflare processing: NONE"
