name: Verify Google Cloud Only Architecture

on:
  workflow_run:
    workflows: ['Deploy FXGA Google Cloud Application']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: fxglobalavengerstradingacademy
  GCP_REGION: us-central1
  APP_SERVICE: fxga-macro-dashboard
  COLLECTOR_SERVICE: fxga-macro-collector
  DEPLOY_SERVICE_ACCOUNT: fxga-github-deployer@fxglobalavengerstradingacademy.iam.gserviceaccount.com

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Enforce repository production boundary
        run: |
          test ! -e .github/workflows/deploy.yml || { echo '::error::Legacy Cloudflare deployment workflow must not exist'; exit 1; }
          test ! -e wrangler.jsonc || { echo '::error::Wrangler production configuration must not exist'; exit 1; }
          node <<'NODE'
          const fs=require('fs');
          const productionFiles=['package.json','vite.config.ts','google-cloud-app/server.js','google-cloud-app/Dockerfile','.github/workflows/deploy-google-cloud-app.yml'];
          const forbidden=[/@cloudflare\/vite-plugin/i,/wrangler\s+deploy/i,/workers\.dev/i,/CLOUDFLARE_API_TOKEN/i,/COLLECTOR_WEBHOOK_SECRET/i,/CLOUDFLARE_WEBHOOK_URL/i];
          for(const file of productionFiles){
            const text=fs.readFileSync(file,'utf8');
            for(const pattern of forbidden)if(pattern.test(text))throw new Error(`${file} violates Google Cloud only production boundary: ${pattern}`);
          }
          console.log('Repository production boundary is Google Cloud only.');
          NODE

      - id: config
        name: Resolve Google Cloud authentication
        env:
          WIF_PROVIDER_SECRET: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_PROVIDER_VAR: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          WIF_PROVIDER="${WIF_PROVIDER_SECRET:-$WIF_PROVIDER_VAR}"
          test -n "$WIF_PROVIDER" || { echo '::error::GCP_WIF_PROVIDER is missing'; exit 1; }
          echo "wif_provider=$WIF_PROVIDER" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Verify deployed Google Cloud services contain no Cloudflare runtime bindings
        run: |
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud run services describe "$APP_SERVICE" --region "$GCP_REGION" --format=json > /tmp/app.json
          gcloud run services describe "$COLLECTOR_SERVICE" --region "$GCP_REGION" --format=json > /tmp/collector.json
          APP_URL=$(gcloud run services describe "$APP_SERVICE" --region "$GCP_REGION" --format='value(status.url)')
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          node <<'NODE'
          const fs=require('fs');
          const forbidden=['CLOUDFLARE_WEBHOOK_URL','COLLECTOR_WEBHOOK_SECRET','CLOUDFLARE_API_TOKEN','CLOUDFLARE_ACCOUNT_ID'];
          for(const file of ['/tmp/app.json','/tmp/collector.json']){
            const service=JSON.parse(fs.readFileSync(file,'utf8'));
            const containers=service?.spec?.template?.spec?.containers||service?.template?.containers||[];
            const env=(containers[0]?.env||[]).map(x=>String(x.name||''));
            const found=forbidden.filter(name=>env.includes(name));
            if(found.length)throw new Error(`${file} contains forbidden Cloudflare runtime bindings: ${found.join(', ')}`);
          }
          console.log('Both Cloud Run services contain zero Cloudflare runtime bindings.');
          NODE

      - name: Verify live public application is Google Cloud only
        run: |
          node <<'NODE'
          const r=await fetch(process.env.APP_URL+'/api/health',{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
          const text=await r.text();
          if(!r.ok)throw new Error(`/api/health ${r.status}: ${text.slice(0,500)}`);
          const h=JSON.parse(text);
          if(h.architecture!=='google-cloud-only')throw new Error(`Unexpected architecture: ${h.architecture}`);
          if(h.compute!=='Google Cloud Run')throw new Error(`Unexpected compute: ${h.compute}`);
          if(h.state!=='Google Cloud Firestore')throw new Error(`Unexpected state: ${h.state}`);
          if(h.cloudflareProcessing!==false)throw new Error('Cloudflare processing must be false');
          console.log(JSON.stringify({architecture:h.architecture,compute:h.compute,state:h.state,cloudflareProcessing:h.cloudflareProcessing},null,2));
          NODE
