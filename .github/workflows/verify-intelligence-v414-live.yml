name: Verify Live Decision Intelligence V4.14

on:
  workflow_run:
    workflows: ['Deploy FXGA Google Cloud Collector']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  SERVICE: fxga-macro-collector
  GCP_PROJECT_ID: fxglobalavengerstradingacademy
  GCP_REGION: us-central1
  DEPLOY_SERVICE_ACCOUNT: fxga-github-deployer@fxglobalavengerstradingacademy.iam.gserviceaccount.com

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: config
        name: Resolve production authentication
        env:
          WIF_PROVIDER_SECRET: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_PROVIDER_VAR: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          WIF_PROVIDER="${WIF_PROVIDER_SECRET:-$WIF_PROVIDER_VAR}"
          test -n "$WIF_PROVIDER" || { echo '::error::GCP_WIF_PROVIDER is missing'; exit 1; }
          echo "wif_provider=$WIF_PROVIDER" >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: service
        name: Resolve private production data service
        run: |
          gcloud config set project "$GCP_PROJECT_ID"
          SERVICE_URL=$(gcloud run services describe "$SERVICE" --region "$GCP_REGION" --format='value(status.url)')
          test -n "$SERVICE_URL" || { echo '::error::Production data service missing'; exit 1; }
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"

      - id: invoke
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.url }}
          id_token_include_email: true

      - name: Refresh and verify private intelligence state
        env:
          TOKEN: ${{ steps.invoke.outputs.id_token }}
        run: |
          set -euo pipefail
          post(){ local name="$1" path="$2" body="${3:-{}}" code; code=$(curl --max-time 300 -sS -o "/tmp/$name.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$body" "$SERVICE_URL$path"); echo "$name HTTP $code"; test "$code" -ge 200 -a "$code" -lt 300 || { cat "/tmp/$name.json" | head -c 1800; exit 1; }; }
          get(){ local name="$1" path="$2" code; code=$(curl --max-time 120 -sS -o "/tmp/$name.json" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$SERVICE_URL$path"); echo "$name HTTP $code"; test "$code" -ge 200 -a "$code" -lt 300 || { cat "/tmp/$name.json" | head -c 1800; exit 1; }; }
          get health /health
          post market /market-sync '{}'
          post intelligence /refresh-intelligence '{"forceNews":false}'
          get state /state
          node <<'NODE'
          const fs=require('fs');
          const health=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if(!health.ok)throw new Error('Production data service is unhealthy');
          const version=String(health.version||'0.0.0').split('.').map(x=>Number(x)||0);
          if(version[0]<4||(version[0]===4&&version[1]<14))throw new Error(`Expected service >=4.14, got ${health.version}`);
          const requiredProviders=['alpha_vantage','twelve_data','finnhub','marketstack','fmp','nasdaq_data_link'];
          const providers=health?.freeTierMarketData?.providers||{};
          const unmounted=requiredProviders.filter(id=>providers[id]?.configured!==true);
          if(unmounted.length)throw new Error(`Free-tier provider secrets not mounted: ${unmounted.join(', ')}`);
          const state=JSON.parse(fs.readFileSync('/tmp/state.json','utf8'));
          const intel=state?.intelligence?.payload,research=intel?.research,core=intel?.decisionGovernance,pairs=core?.pairDecisions||[];
          if(!intel||!research||!core)throw new Error('Current intelligence state is incomplete');
          if(pairs.length<8)throw new Error(`Expected 8 governed pairs, got ${pairs.length}`);
          const required=['bayesian','refined','reactionFunctionGap','crossAsset','causalTransmission','counterfactual','temporalIntelligence','transitionRisk','structuralBreak','evidenceIndependence','evidenceCompleteness','scenarioRobustness','riskControls','modelHealth','historicalCalibration','horizonCalibration','decisionChange','historicalAnalogues','uncertainty','premortem','thesis','final'];
          for(const pair of pairs)for(const field of required)if(pair?.[field]===undefined)throw new Error(`${pair?.symbol||'pair'} missing ${field}`);
          if(!core.crossPairConsistency?.checks?.length)throw new Error('Cross-pair consistency missing');
          if(!core.portfolioInteraction?.pairControls)throw new Error('Portfolio interaction missing');
          if(!research.structuralBreaks?.series)throw new Error('Structural-break research missing');
          if(!research.turningPoints?.rows||!research.evidenceIndependence||!research.catalystSequence?.currencies)throw new Error('Adaptive research layers missing');
          if(!Array.isArray(research.releaseAnalytics?.persistence))throw new Error('Surprise persistence missing');
          const calibrated=(research.forecasts||[]).filter(x=>x.modelWeights&&Number(x.validationPoints||0)>0);
          const distributed=calibrated.filter(x=>x.distribution&&Number(x.distribution.residualCount||0)>0);
          if(!calibrated.length)throw new Error('Walk-forward calibrated forecasts missing');
          if(!distributed.length)throw new Error('Distributional forecasts missing');
          if(!intel.decisionMemory||typeof intel.decisionMemory!=='object')throw new Error('Decision memory missing');
          console.log(JSON.stringify({serviceVersion:health.version,pairs:pairs.length,configuredProviders:requiredProviders,evidenceQuality:core.evidenceQuality?.score??null,modelHealth:research.modelHealth?.status??null,calibratedForecasts:calibrated.length,distributedForecasts:distributed.length,triangleChecks:core.crossPairConsistency.checks.length,decisionMemorySamples:intel.decisionMemory.sampledDecisions||0},null,2));
          NODE

      - name: Verify public v4.14 research contract
        run: |
          node <<'NODE'
          const base='https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev',sleep=ms=>new Promise(r=>setTimeout(r,ms));let last;
          for(let attempt=0;attempt<40;attempt++){
            try{
              const r=await fetch(base+'/api/research',{headers:{Accept:'application/json','Cache-Control':'no-cache'}}),text=await r.text();
              if(!r.ok)throw new Error(`/api/research ${r.status}: ${text.slice(0,500)}`);
              const research=JSON.parse(text),core=research?.decisionCore,pairs=core?.pairDecisions||[];
              const ok=pairs.length>=8&&pairs.every(p=>p.reactionFunctionGap&&p.crossAsset&&p.evidenceCompleteness&&p.horizonCalibration&&p.decisionChange&&p.historicalAnalogues&&p.structuralBreak&&p.causalTransmission&&p.counterfactual&&p.temporalIntelligence&&p.transitionRisk&&p.evidenceIndependence);
              if(ok&&research.structuralBreaks&&research.evidenceIndependence&&research.turningPoints&&research.catalystSequence&&research.decisionMemory&&core.crossPairConsistency&&core.portfolioInteraction){
                console.log('PUBLIC V4.14 INTELLIGENCE VERIFIED',JSON.stringify({pairs:pairs.length,decisionMemorySamples:research.decisionMemory.sampledDecisions||0}));
                process.exit(0);
              }
              last=new Error('Waiting for current v4.14 public research state');
            }catch(error){last=error;}
            await sleep(4000);
          }
          throw last||new Error('Public v4.14 intelligence contract did not become ready');
          NODE
