name: Canary FXGA Firestore 9 Write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/firestore-v9-write-canary.trigger'

permissions:
  contents: read
  id-token: write

env:
  CANARY_JOB: fxga-firestore9-write-canary-job
  GAR_REPOSITORY: fxga-containers
  GCP_PROJECT_ID: fxglobalavengerstradingacademy
  GCP_REGION: us-central1
  DEPLOY_SERVICE_ACCOUNT: fxga-github-deployer@fxglobalavengerstradingacademy.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: fxga-collector-runtime@fxglobalavengerstradingacademy.iam.gserviceaccount.com

jobs:
  write-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: config
        name: Resolve production authentication
        env:
          WIF_PROVIDER_SECRET: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_PROVIDER_VAR: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          WIF_PROVIDER="${WIF_PROVIDER_SECRET:-$WIF_PROVIDER_VAR}"
          test -n "$WIF_PROVIDER" || { echo '::error::GCP_WIF_PROVIDER is missing'; exit 1; }
          echo "wif_provider=$WIF_PROVIDER" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Prepare minimal Firestore 9 job image
        run: |
          rm -rf /tmp/fxga-firestore9-job
          mkdir -p /tmp/fxga-firestore9-job
          cat > /tmp/fxga-firestore9-job/package.json <<'JSON'
          {
            "name": "fxga-firestore9-write-canary-job",
            "private": true,
            "version": "1.0.0",
            "type": "module",
            "engines": { "node": ">=24" },
            "dependencies": { "@google-cloud/firestore": "9.0.0" }
          }
          JSON
          cat > /tmp/fxga-firestore9-job/probe.js <<'NODE'
          import crypto from 'node:crypto';
          import { Firestore } from '@google-cloud/firestore';

          const db=new Firestore({ignoreUndefinedProperties:true});
          const collection=db.collection('fxga_firestore9_canary');
          const id=`probe-${Date.now()}-${crypto.randomUUID().slice(0,8)}`;
          const ref=collection.doc(id);
          const nonce=crypto.randomUUID();

          try {
            await ref.set({nonce,writtenAt:new Date().toISOString(),purpose:'temporary-firestore9-runtime-write-probe'},{merge:false});
            const read=await ref.get();
            if(!read.exists||read.data()?.nonce!==nonce)throw new Error('Canary write/read verification failed');
            await ref.delete();
            const afterDelete=await ref.get();
            if(afterDelete.exists)throw new Error('Canary document deletion verification failed');
            console.log(JSON.stringify({ok:true,written:true,readBack:true,deleted:true,collection:'fxga_firestore9_canary'}));
            console.log('FIRESTORE 9 WRITE PROBE VERIFIED');
          } catch (error) {
            try { await ref.delete(); } catch {}
            console.error('FIRESTORE 9 WRITE PROBE FAILED',error);
            process.exitCode=1;
          } finally {
            await db.terminate().catch(()=>{});
          }
          NODE
          cat > /tmp/fxga-firestore9-job/Dockerfile <<'DOCKER'
          FROM node:24-bookworm-slim
          WORKDIR /app
          COPY package.json ./
          RUN npm install --omit=dev --no-audit --no-fund
          COPY probe.js ./
          CMD ["node","probe.js"]
          DOCKER
          cd /tmp/fxga-firestore9-job
          npm install --ignore-scripts --no-fund --no-audit
          node --check probe.js
          npm audit --omit=dev --json > /tmp/write-canary-audit.json || true
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/write-canary-audit.json','utf8')),v=x?.metadata?.vulnerabilities||{};
          console.log('WRITE JOB AUDIT',JSON.stringify(v));
          if((v.moderate||0)+(v.high||0)+(v.critical||0)>0)throw new Error('Firestore 9 write-job dependency tree is not clean');
          NODE

      - name: Build and push minimal canary image
        run: |
          gcloud config set project "$GCP_PROJECT_ID"
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY/firestore9-write-job:${GITHUB_SHA}"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" /tmp/fxga-firestore9-job
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Deploy one-shot Firestore 9 canary job
        run: |
          gcloud run jobs deploy "$CANARY_JOB" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --tasks 1 \
            --max-retries 0 \
            --task-timeout 120s \
            --set-env-vars "GCP_PROJECT_ID=$GCP_PROJECT_ID,GCP_REGION=$GCP_REGION"

      - name: Execute isolated write read delete probe
        run: |
          gcloud run jobs execute "$CANARY_JOB" --region "$GCP_REGION" --wait
          EXECUTION=$(gcloud run jobs executions list --job "$CANARY_JOB" --region "$GCP_REGION" --limit=1 --sort-by='~metadata.creationTimestamp' --format='value(metadata.name)')
          test -n "$EXECUTION" || { echo '::error::Canary execution missing'; exit 1; }
          STATUS=$(gcloud run jobs executions describe "$EXECUTION" --region "$GCP_REGION" --format='value(status.conditions[0].type,status.conditions[0].status,status.failedCount,status.succeededCount)')
          echo "Execution $EXECUTION: $STATUS"
          SUCCEEDED=$(gcloud run jobs executions describe "$EXECUTION" --region "$GCP_REGION" --format='value(status.succeededCount)')
          FAILED=$(gcloud run jobs executions describe "$EXECUTION" --region "$GCP_REGION" --format='value(status.failedCount)')
          test "${SUCCEEDED:-0}" = "1" || { echo '::error::Firestore 9 write job did not succeed'; exit 1; }
          test "${FAILED:-0}" = "0" || { echo '::error::Firestore 9 write job reported failures'; exit 1; }
          echo 'FIRESTORE 9 WRITE READ DELETE JOB VERIFIED'

      - name: Delete write canary job
        if: always()
        run: |
          gcloud run jobs delete "$CANARY_JOB" --region "$GCP_REGION" --quiet >/dev/null 2>&1 || true
