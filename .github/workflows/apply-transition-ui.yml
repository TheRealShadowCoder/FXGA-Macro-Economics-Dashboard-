name: Apply Transition Research UI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-transition-ui.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply transition research UI
        run: python3 scripts/apply_transition_ui.py
      - name: Validate production frontend build
        run: |
          npm install
          npm run build
      - name: Commit transition research UI
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/ResearchView.tsx
          if git diff --cached --quiet; then echo 'No changes to commit.'; exit 0; fi
          git commit -m 'Integrate transition and catalyst research UI'
          git pull --rebase origin main
          git push origin HEAD:main
