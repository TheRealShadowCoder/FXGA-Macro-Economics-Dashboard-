name: Apply FXGA Release Baseline Sampling

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/release-baseline-sampling.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Harden pre-release market baselines
        run: python3 scripts/patch-release-baseline.py

      - name: Validate collector
        run: |
          cd cloud-run-collector
          npm install --ignore-scripts --no-fund --no-audit
          npm run check

      - name: Commit baseline sampling upgrade
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud-run-collector/src/server-v2.js cloud-run-collector/src/launcher.js cloud-run-collector/package.json
          git diff --cached --quiet && exit 0
          git commit -m 'Guarantee awaited pre-release market baselines'
          git pull --rebase origin main
          git push origin HEAD:main
