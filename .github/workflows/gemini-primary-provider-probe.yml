name: Gemini Primary Provider Comparison Probe

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/gemini-primary-provider-probe-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

env:
  MODEL: gemini-3.5-flash-lite

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Upload file then compare file and inline inference
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const key = String(process.env.GEMINI_API_KEY || '').trim();
          const model = process.env.MODEL || 'gemini-3.5-flash-lite';
          const sleep = ms => new Promise(r => setTimeout(r, ms));
          const result = {schema:'fxga.gemini.primary-provider-probe.v1',runId:Number(process.env.GITHUB_RUN_ID||0),model,startedAt:new Date().toISOString(),bypasses:['Cloud Run','Firestore','FXGA routing','frontend'],file:{}};
          const save = () => fs.writeFileSync('/tmp/result.json', JSON.stringify(result,null,2)+'\n');
          save();
          if (!key) { result.fatal='missing_gemini_api_key'; save(); process.exit(0); }

          const timeout = ms => AbortSignal.timeout(ms);
          try {
            const csv = Buffer.from('field,value\nprobe,FXGA_FILE_PROVIDER_OK\n');
            const start = await fetch('https://generativelanguage.googleapis.com/upload/v1beta/files', {method:'POST',signal:timeout(30000),headers:{'x-goog-api-key':key,'X-Goog-Upload-Protocol':'resumable','X-Goog-Upload-Command':'start','X-Goog-Upload-Header-Content-Length':String(csv.length),'X-Goog-Upload-Header-Content-Type':'text/csv','Content-Type':'application/json'},body:JSON.stringify({file:{display_name:'fxga-primary-provider-probe.csv'}})});
            const uploadUrl = start.headers.get('x-goog-upload-url') || '';
            result.file.startHttp=start.status; result.file.uploadUrlReturned=Boolean(uploadUrl);
            if (uploadUrl) {
              const finish = await fetch(uploadUrl,{method:'POST',signal:timeout(30000),headers:{'Content-Length':String(csv.length),'Content-Type':'text/csv','X-Goog-Upload-Offset':'0','X-Goog-Upload-Command':'upload, finalize'},body:csv});
              result.file.uploadHttp=finish.status;
              const p=await finish.json().catch(()=>({})); const f=p.file||p||{}; result.file.mimeType=f.mimeType||f.mime_type||'text/csv'; result.file.hasUri=Boolean(f.uri); result.file.hasName=Boolean(f.name); result.file.state=f.state||'UNKNOWN';
              let state=result.file.state;
              for(let i=0;i<15 && f.name && state!=='ACTIVE' && state!=='FAILED';i++){await sleep(1000); const m=await fetch(`https://generativelanguage.googleapis.com/v1beta/${f.name}`,{signal:timeout(15000),headers:{'x-goog-api-key':key}}); const d=await m.json().catch(()=>({})); state=d.state||'UNKNOWN';}
              result.file.state=state; result._fileUri=f.uri||'';
            }
          } catch(e) { result.file.exception=String(e?.message||e).slice(0,300); }
          save();

          async function call(input){
            const started=Date.now();
            try{
              const r=await fetch('https://generativelanguage.googleapis.com/v1/interactions',{method:'POST',signal:timeout(30000),headers:{'x-goog-api-key':key,'Content-Type':'application/json'},body:JSON.stringify({model,input,store:false,generation_config:{max_output_tokens:32}})});
              const d=await r.json().catch(()=>({}));
              const answer=Array.isArray(d.steps)?d.steps.flatMap(s=>s?.type==='model_output'&&Array.isArray(s.content)?s.content.filter(x=>x?.type==='text').map(x=>String(x.text||'')):[]).join(''):'';
              return {http:r.status,durationMs:Date.now()-started,retryAfter:r.headers.get('retry-after')||null,errorStatus:d?.error?.status||null,errorMessage:d?.error?.message?String(d.error.message).slice(0,300):null,answer};
            }catch(e){return {http:0,durationMs:Date.now()-started,retryAfter:null,errorStatus:e?.name||'NETWORK_EXCEPTION',errorMessage:String(e?.message||e).slice(0,300),answer:''};}
          }

          await sleep(50_000);
          if(result.file.state==='ACTIVE' && result._fileUri){result.fileInteraction=await call([{type:'document',uri:result._fileUri,mime_type:'text/csv'},{type:'text',text:'Reply with exactly the probe value.'}]); save();}
          await sleep(10_000);
          result.inlineInteraction=await call('Reply with exactly: FXGA_INLINE_PROVIDER_OK');
          delete result._fileUri;
          result.completedAt=new Date().toISOString(); save();
          console.log(JSON.stringify(result,null,2));
          NODE

      - name: Persist sanitized result
        if: always()
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const fs=require('fs'); const path='diagnostics/gemini-primary-provider-latest.json';
            const raw=fs.existsSync('/tmp/result.json')?fs.readFileSync('/tmp/result.json','utf8'):JSON.stringify({schema:'fxga.gemini.primary-provider-probe.v1',runId:Number(process.env.GITHUB_RUN_ID),fatal:'no_result'});
            let sha; try{const x=await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'main'});if(!Array.isArray(x.data))sha=x.data.sha;}catch(e){if(e.status!==404)throw e;}
            await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,message:'Record Gemini primary provider comparison [skip ci]',content:Buffer.from(raw).toString('base64'),branch:'main',...(sha?{sha}:{})});
