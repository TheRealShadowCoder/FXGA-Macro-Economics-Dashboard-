name: Smoke Test FXGA AI Hi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smoke-test-fxga-hi.yml'

permissions:
  contents: read

env:
  API_BASE: https://fxga-macro-dashboard-kbjj66blka-uc.a.run.app

jobs:
  say-hi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send hi to direct live FXGA Gemini stream
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS --connect-timeout 15 --max-time 100 \
            -o /tmp/fxga-hi-stream.txt \
            -w '%{http_code}' \
            -X POST "${API_BASE}/api/gemini/chat-stream" \
            -H 'Content-Type: application/json' \
            -H 'Accept: text/event-stream' \
            --data '{"question":"hi","task":"conversation"}')

          echo "HTTP_STATUS=${status}"
          echo 'RAW_RESPONSE_BEGIN'
          cat /tmp/fxga-hi-stream.txt
          echo
          echo 'RAW_RESPONSE_END'

          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            echo "Direct FXGA Gemini hi request failed with HTTP ${status}" >&2
            exit 1
          fi

          if grep -q '^event: error' /tmp/fxga-hi-stream.txt; then
            echo 'Direct stream returned an error event.' >&2
            exit 1
          fi

          answer=$(awk '
            /^event: delta/ { want=1; next }
            want && /^data: / {
              sub(/^data: /, "");
              print;
              want=0;
            }
          ' /tmp/fxga-hi-stream.txt | jq -r -s 'map(try fromjson catch empty) | map(.delta // .text // .content // empty) | join("")')

          if [[ -z "${answer}" ]]; then
            echo 'No usable streamed AI text was returned.' >&2
            exit 1
          fi

          echo 'AI_ANSWER_BEGIN'
          printf '%s\n' "$answer"
          echo 'AI_ANSWER_END'
