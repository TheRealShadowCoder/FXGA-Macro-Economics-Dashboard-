name: Verify FXGA Production Data Contract R0

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy FXGA R0 Cloudflare Runtime']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-fxstreet-analytics.yml'

permissions:
  contents: read

concurrency:
  group: fxga-production-contract-r0
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify live R0 production and member-access contract
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = 'https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function raw(path, options={}) {
            return fetch(`${base}${path}`, {
              cache: 'no-store',
              redirect: 'manual',
              ...options,
              headers: { Accept: 'application/json', 'Cache-Control': 'no-cache', ...(options.headers || {}) },
            });
          }

          async function getJson(path) {
            const response = await raw(path);
            const text = await response.text();
            if (!response.ok) throw new Error(`${path} returned ${response.status}: ${text.slice(0, 800)}`);
            try { return JSON.parse(text); }
            catch { throw new Error(`${path} returned invalid JSON: ${text.slice(0, 400)}`); }
          }

          async function verifyOnce() {
            const [health, auth, ai] = await Promise.all([
              getJson('/api/health'),
              getJson('/api/auth/status'),
              getJson('/api/gemini/intelligence-health'),
            ]);

            if (health.architecture !== 'cloudflare-r0') throw new Error(`Architecture mismatch: ${health.architecture}`);
            if (health.compute !== 'Cloudflare Workers Free') throw new Error(`Compute mismatch: ${health.compute}`);
            if (health.database !== 'Cloudflare D1 Free') throw new Error(`Database mismatch: ${health.database}`);
            if (health.staticHosting !== 'Cloudflare Workers Static Assets') throw new Error(`Static hosting mismatch: ${health.staticHosting}`);
            if (health.googleCloudRuntime !== false) throw new Error('Google Cloud runtime must remain disabled');
            if (auth.accessModel !== 'owner-approved-google-email-allowlist') throw new Error(`Unexpected access model: ${auth.accessModel}`);
            if (!String(auth.loginUrl || '').includes('/member')) throw new Error('Member login URL missing');
            if (ai.configured !== true) throw new Error('Gemini AI is not configured');

            if (auth.enforced === true) {
              const dashboard = await raw('/api/dashboard');
              if (dashboard.status !== 401) throw new Error(`Unauthenticated dashboard must be blocked with 401; got ${dashboard.status}`);
              const root = await raw(`/?contract=${Date.now()}`, { headers: { Accept: 'text/html' } });
              if (root.status !== 302) throw new Error(`Unauthenticated application root must redirect; got ${root.status}`);
              if (!String(root.headers.get('location') || '').includes('/member')) throw new Error('Unauthenticated root did not redirect to FXGA member login');
              return {
                architecture: health.architecture,
                database: health.database,
                googleCloudRuntime: health.googleCloudRuntime,
                memberAuthEnforced: true,
                unauthorizedApiBlocked: true,
                unauthorizedSpaBlocked: true,
                geminiConfigured: ai.configured,
              };
            }

            const [dashboard, analysis, sessions, market, technical, quality, prompts, mt5] = await Promise.all([
              getJson('/api/dashboard'),
              getJson('/api/analysis'),
              getJson('/api/session-signals'),
              getJson('/api/market-prices'),
              getJson('/api/technical'),
              getJson('/api/data-quality'),
              getJson('/api/gemini/prompts'),
              getJson('/api/mt5/latest'),
            ]);

            if (dashboard?._r0?.architecture !== 'cloudflare-r0') throw new Error('Dashboard is not served by the R0 compatibility runtime');
            for (const key of ['macro','market','calendar','sources','errors']) if (!Array.isArray(dashboard[key])) throw new Error(`Dashboard ${key} contract is invalid`);
            if (dashboard.macro.length < 1 || dashboard.market.length < 1) throw new Error('Dashboard data is empty');
            if (!analysis?.regime || !analysis?.policy || !analysis?.coverage || !Array.isArray(analysis?.dimensions)) throw new Error('Analysis contract invalid');
            if (!Array.isArray(sessions?.sessions) || sessions.sessions.length < 5) throw new Error('Session contract invalid');
            if (market.schema !== 'fxga.r0.market-data.v1' || market?._r0?.source !== 'cloudflare-d1') throw new Error('Market R0 contract invalid');
            if (!Array.isArray(market.canonicalFx) || market.canonicalFx.length < 4) throw new Error('Canonical FX coverage too small');
            if (!technical?.counts || typeof technical?.assets !== 'object' || Number(technical.counts.assets || 0) < 1) throw new Error('Technical contract invalid');
            if (quality?.architecture !== 'cloudflare-r0' || quality?.budget?.firestore !== false) throw new Error('Data-quality R0 contract invalid');
            if (!Array.isArray(prompts.prompts) || prompts.prompts.length < 6) throw new Error('Prompt endpoint incomplete');
            if (mt5.ok !== true) throw new Error('MT5 compatibility endpoint unhealthy');

            const root = await raw(`/?contract=${Date.now()}`, { headers: { Accept: 'text/html' } });
            if (!root.ok) throw new Error(`Static application returned HTTP ${root.status}`);
            const html = await root.text();
            if (!html.includes('<div id="root"')) throw new Error('Static application missing React mount point');

            return {
              architecture: health.architecture,
              database: health.database,
              googleCloudRuntime: health.googleCloudRuntime,
              memberAuthEnforced: false,
              memberAuthPendingGoogleSetup: true,
              dashboardMacro: dashboard.macro.length,
              dashboardMarket: dashboard.market.length,
              canonicalFx: market.canonicalFx.length,
              technicalAssets: technical.counts.assets,
              geminiConfigured: ai.configured,
            };
          }

          let lastError;
          for (let attempt = 1; attempt <= 12; attempt += 1) {
            try {
              const result = await verifyOnce();
              console.log(JSON.stringify({ ok: true, ...result }, null, 2));
              console.log('PRODUCTION R0 + MEMBER ACCESS CONTRACT PASSED');
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.log(`Contract verification ${attempt}/12: ${String(error?.message || error)}`);
              if (attempt < 12) await sleep(5000);
            }
          }
          throw lastError || new Error('Production R0 contract did not become ready');
          NODE
