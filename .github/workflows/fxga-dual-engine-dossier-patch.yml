name: FXGA dual-engine dossier patch

"on":
  push:
    branches:
      - feature/elliott-60d-ai-dossier-20260826
    paths:
      - scripts/apply_dual_engine_dossier_patch.py
      - .github/workflows/fxga-dual-engine-dossier-patch.yml
      - docs/.trigger-dual-engine-dossier
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/elliott-60d-ai-dossier-20260826
          fetch-depth: 0

      - name: Apply dual-engine patch
        run: python scripts/apply_dual_engine_dossier_patch.py

      - name: Static JavaScript syntax checks
        run: |
          node --check google-cloud-app/elliott-reports.js
          node --check google-cloud-app/elliott-ai.js

      - name: Commit patched source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "mt5/EA Bridge.mq5" google-cloud-app/elliott-reports.js google-cloud-app/elliott-ai.js
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "Wire RSI BB confirmation into Elliott AI dossier [skip ci]"
          git push origin HEAD:feature/elliott-60d-ai-dossier-20260826
