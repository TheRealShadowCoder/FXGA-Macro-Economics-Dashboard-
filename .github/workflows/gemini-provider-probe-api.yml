name: Gemini Provider Probe API

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  PRIMARY_MODEL: gemini-3.5-flash-lite
  RESERVE_MODEL: gemini-3.7-flash

jobs:
  probe:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[gemini-provider-probe-api]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Direct provider test
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -u
          test -n "${GEMINI_API_KEY:-}" || { echo '::error::GEMINI_API_KEY missing'; exit 1; }
          R=/tmp/gemini-provider-result.json
          jq -nc '{schema:"fxga.gemini.provider-probe.v2",startedAt:(now|todate),bypasses:["Cloud Run","Firestore cache","FXGA provider cooldown","frontend"]}' > "$R"

          # FILES API FIRST: upload a tiny CSV without consuming model inference.
          printf 'field,value\nprobe,FXGA_FILE_PROVIDER_OK\n' >/tmp/probe.csv
          B=$(wc -c </tmp/probe.csv | tr -d ' ')
          curl -sS -D /tmp/s.h -o /tmp/s.b -X POST 'https://generativelanguage.googleapis.com/upload/v1beta/files' \
            -H "x-goog-api-key: ${GEMINI_API_KEY}" -H 'X-Goog-Upload-Protocol: resumable' -H 'X-Goog-Upload-Command: start' \
            -H "X-Goog-Upload-Header-Content-Length: ${B}" -H 'X-Goog-Upload-Header-Content-Type: text/csv' -H 'Content-Type: application/json' \
            --data '{"file":{"display_name":"fxga-provider-probe.csv"}}' || true
          U=$(awk 'BEGIN{IGNORECASE=1} /^x-goog-upload-url:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' /tmp/s.h)
          if [ -z "$U" ]; then
            jq '.file={uploadStart:false}' "$R" >/tmp/x && mv /tmp/x "$R"
          else
            UH=$(curl -sS -o /tmp/u.json -w '%{http_code}' -X POST "$U" -H "Content-Length: ${B}" -H 'Content-Type: text/csv' -H 'X-Goog-Upload-Offset: 0' -H 'X-Goog-Upload-Command: upload, finalize' --data-binary @/tmp/probe.csv || echo 000)
            N=$(jq -r '.file.name // empty' /tmp/u.json 2>/dev/null); URI=$(jq -r '.file.uri // empty' /tmp/u.json 2>/dev/null); S=$(jq -r '.file.state // "UNKNOWN"' /tmp/u.json 2>/dev/null)
            for i in $(seq 1 20); do
              [ "$S" = ACTIVE ] && break; [ -z "$N" ] && break
              M=$(curl -sS -H "x-goog-api-key: ${GEMINI_API_KEY}" "https://generativelanguage.googleapis.com/v1beta/${N}" || true)
              S=$(printf '%s' "$M" | jq -r '.state // "UNKNOWN"' 2>/dev/null); [ "$S" = FAILED ] && break; sleep 1
            done
            jq --arg h "$UH" --arg s "$S" '.file={uploadHttp:($h|tonumber?//0),state:$s}' "$R" >/tmp/x && mv /tmp/x "$R"
          fi

          # Respect the retry window visible in production before model inference.
          sleep 50

          record_call(){ KEY="$1" MODEL="$2" REQ="$3"; HFILE="/tmp/${KEY}.h"; BODY="/tmp/${KEY}.json"; CODE=$(curl -sS -D "$HFILE" -o "$BODY" -w '%{http_code}' -X POST 'https://generativelanguage.googleapis.com/v1/interactions' -H "x-goog-api-key: ${GEMINI_API_KEY}" -H 'Content-Type: application/json' --data-binary @"$REQ" || echo 000); RETRY=$(awk 'BEGIN{IGNORECASE=1} /^retry-after:/ {sub(/^[^:]+:[[:space:]]*/, ""); gsub(/\r/, ""); print; exit}' "$HFILE"); STATUS=$(jq -r '.error.status // empty' "$BODY" 2>/dev/null); MSG=$(jq -r '.error.message // empty' "$BODY" 2>/dev/null | head -c 260); ANSWER=$(jq -r '[.steps[]? | select(.type=="model_output") | .content[]? | select(.type=="text") | .text]|join("")' "$BODY" 2>/dev/null); jq --arg key "$KEY" --arg model "$MODEL" --arg code "$CODE" --arg retry "$RETRY" --arg status "$STATUS" --arg msg "$MSG" --arg answer "$ANSWER" '.[$key]={model:$model,http:($code|tonumber?//0),retryAfter:($retry|select(length>0)//null),errorStatus:($status|select(length>0)//null),errorMessage:($msg|select(length>0)//null),answer:$answer}' "$R" >/tmp/x && mv /tmp/x "$R"; }

          if [ "${S:-UNKNOWN}" = ACTIVE ] && [ -n "${URI:-}" ]; then
            jq -nc --arg m "$PRIMARY_MODEL" --arg u "$URI" '{model:$m,input:[{type:"document",uri:$u,mime_type:"text/csv"},{type:"text",text:"Reply with exactly the probe value."}],store:false,generation_config:{max_output_tokens:32}}' >/tmp/file.req
            record_call fileInteraction "$PRIMARY_MODEL" /tmp/file.req
          fi

          sleep 10
          jq -nc --arg m "$PRIMARY_MODEL" '{model:$m,input:"Reply with exactly: FXGA_INLINE_PROVIDER_OK",store:false,generation_config:{max_output_tokens:32}}' >/tmp/p.req
          record_call inlinePrimary "$PRIMARY_MODEL" /tmp/p.req

          sleep 10
          jq -nc --arg m "$RESERVE_MODEL" '{model:$m,input:"Reply with exactly: FXGA_INLINE_PROVIDER_OK",store:false,generation_config:{max_output_tokens:32}}' >/tmp/r.req
          record_call inlineReserve "$RESERVE_MODEL" /tmp/r.req

          jq '.completedAt=(now|todate) | .interpretation = (if (.file.uploadHttp//0)>=200 and (.file.uploadHttp//0)<300 and .file.state=="ACTIVE" then "files_api_healthy" else "files_api_problem" end)' "$R" >/tmp/final && mv /tmp/final "$R"
          cat "$R"

      - name: Persist sanitized result through GitHub API
        if: always()
        uses: actions/github-script@v8
        env:
          RESULT_PATH: /tmp/gemini-provider-result.json
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const path = 'diagnostics/gemini-provider-latest.json';
            const raw = fs.existsSync(process.env.RESULT_PATH)
              ? fs.readFileSync(process.env.RESULT_PATH, 'utf8')
              : JSON.stringify({schema:'fxga.gemini.provider-probe.v2',fatal:'probe_did_not_produce_result'}, null, 2);
            let sha;
            try {
              const existing = await github.rest.repos.getContent({owner:context.repo.owner, repo:context.repo.repo, path, ref:'main'});
              if (!Array.isArray(existing.data)) sha = existing.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'Record Gemini provider probe [skip ci]',
              content: Buffer.from(raw).toString('base64'),
              branch: 'main',
              ...(sha ? {sha} : {})
            });
