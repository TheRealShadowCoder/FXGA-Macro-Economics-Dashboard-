name: Apply FXGA Event Study Upgrade

on:
  push:
    paths:
      - '.github/workflows/apply-event-studies.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fxga-event-study-upgrade
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply event-study integration
        run: python3 scripts/apply_event_studies.py
      - name: Validate collector and application
        run: |
          node --check cloud-run-collector/src/event-study.js
          node --check cloud-run-collector/src/advanced-technical.js
          node --check cloud-run-collector/src/technical-engine.js
          node --check cloud-run-collector/src/server-v2.js
          npm install --no-audit --no-fund
          npm run build
      - name: Commit event-study integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add cloud-run-collector/src/server-v2.js cloud-run-collector/package.json worker/index-v3.ts
          git commit -m "Integrate economic release market-reaction studies"
          git pull --rebase origin main
          git push origin HEAD:main
