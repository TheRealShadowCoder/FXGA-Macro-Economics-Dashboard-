name: Activate Google Cloud FXGA 9705 Engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/activate-google-v4.trigger'

permissions:
  contents: read
  id-token: write

env:
  SERVICE: fxga-macro-collector
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}

jobs:
  activate-v4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install

      - name: Require activation configuration
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          WEBHOOK_SECRET: ${{ secrets.COLLECTOR_WEBHOOK_SECRET }}
        run: |
          for name in PROJECT_ID WIF_PROVIDER DEPLOY_SA WEBHOOK_SECRET; do
            test -n "${!name}" || { echo "::error::$name is not configured"; exit 1; }
          done

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: service
        name: Resolve private Google Cloud Run service
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          gcloud config set project "$PROJECT_ID"
          SERVICE_URL=$(gcloud run services describe "$SERVICE" --region "$GCP_REGION" --format='value(status.url)')
          test -n "$SERVICE_URL" || { echo '::error::Cloud Run service missing'; exit 1; }
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"

      - id: invoke
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.url }}
          id_token_include_email: true

      - name: Prove data acquisition and build critical intelligence
        env:
          TOKEN: ${{ steps.invoke.outputs.id_token }}
        run: |
          req(){
            NAME="$1"; METHOD="$2"; URL="$3"; BODY="${4:-}"
            OUT="/tmp/$NAME.json"
            if [ "$METHOD" = POST ]; then STATUS=$(curl -sS -o "$OUT" -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$URL"); else STATUS=$(curl -sS -o "$OUT" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL"); fi
            echo "$NAME HTTP $STATUS"
            if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then cat "$OUT" | head -c 1000; exit 1; fi
          }
          req health GET "$SERVICE_URL/health"
          node - <<'NODE'
          const h=require('/tmp/health.json');
          if(!h.ok||Number(h.version)<4)throw new Error(`Expected Google collector v4+, got ${h.version}`);
          if(h.architecture!=='google-cloud-only-acquisition-and-intelligence')throw new Error('Google-only architecture marker missing');
          if(h.methodRegistry?.totalMethods!==9705||h.methodRegistry?.totalFamilies!==150)throw new Error('9705 registry health contract failed');
          NODE

          req bootstrap POST "$SERVICE_URL/bootstrap" '{}'
          req prestate GET "$SERVICE_URL/state"
          if node - <<'NODE'
          const s=require('/tmp/prestate.json'),m=s?.macro?.payload,i=s?.intelligence?.payload;
          const fresh=Date.now()-Date.parse(m?.generatedAt||0)<6*3600000;
          process.exit((m?.observations?.length>=100&&fresh&&i?.schemaVersion>=4)?0:1);
          NODE
          then echo 'Fresh Google macro state already present.'; else req macro POST "$SERVICE_URL/macro-sync?mode=full" '{"mode":"full"}'; fi

          req intelligence POST "$SERVICE_URL/refresh-intelligence" '{"forceNews":true}'
          req state GET "$SERVICE_URL/state"
          node - <<'NODE'
          const s=require('/tmp/state.json'),events=s?.calendar?.payload?.events||[],obs=s?.macro?.payload?.observations||[],i=s?.intelligence?.payload,h=i?.operationalHealth||{},d=i?.sessionSignals;
          if(events.length<1)throw new Error('Google calendar empty');
          if(obs.length<100)throw new Error(`Google macro state too small: ${obs.length}`);
          if(i?.schemaVersion!==4)throw new Error(`Expected schema v4, got ${i?.schemaVersion}`);
          if(i?.registry?.totalMethods!==9705||i?.registry?.totalFamilies!==150)throw new Error('9705 registry missing');
          if(i?.economyAnalysis?.economies?.length!==5)throw new Error('Five-economy engine missing');
          if(!i?.intelligenceMatrix?.equations?.pairScore||!i?.intelligenceMatrix?.equations?.decision)throw new Error('Critical decision equations missing');
          if(d?.rankedOpportunities?.length!==8||new Set(d.rankedOpportunities.map(x=>x.symbol)).size!==8)throw new Error('Unique pair matrix incomplete');
          if(h.macroObservations<100||h.calendarEvents<1)throw new Error('Operational health incomplete');
          for(const e of ['USA','EUROPE','UK','SOUTH_AFRICA','JAPAN'])if(Number(h.economyCounts?.[e]||0)<5)throw new Error(`${e} coverage too low`);
          console.log(JSON.stringify({events:events.length,observations:obs.length,news:h.officialNewsItems,fredFailures:h.fredFailures,staleRetained:h.staleMacroRetained,eligible:i.coverage?.eligibleMethods,activeFamilies:i.coverage?.activeFamilies,actionable:d.decisionSummary?.actionableCount,wait:d.decisionSummary?.waitCount}));
          NODE

      - id: replay_auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.url }}
          id_token_include_email: true

      - name: Replay Google state to passive Cloudflare
        env:
          TOKEN: ${{ steps.replay_auth.outputs.id_token }}
          WEBHOOK_SECRET: ${{ secrets.COLLECTOR_WEBHOOK_SECRET }}
        run: |
          curl -fsS -H "Authorization: Bearer $TOKEN" "$SERVICE_URL/state" > /tmp/google-state.json
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),state=JSON.parse(fs.readFileSync('/tmp/google-state.json','utf8')),secret=process.env.WEBHOOK_SECRET,url='https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev/api/collector-webhook';
          async function send(type,payload){const body=JSON.stringify({version:1,type,generatedAt:new Date().toISOString(),payload}),timestamp=String(Date.now()),requestId=crypto.randomUUID(),signature=crypto.createHmac('sha256',secret).update(`${timestamp}.${requestId}.${body}`).digest('hex'),r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-FXGA-Timestamp':timestamp,'X-FXGA-Request-Id':requestId,'X-FXGA-Signature':`sha256=${signature}`},body}),text=await r.text();if(!r.ok)throw new Error(`${type} ${r.status}: ${text.slice(0,500)}`);console.log(`${type}: ${r.status}`);}
          (async()=>{await send('calendar-snapshot',state.calendar.payload);await send('macro-snapshot',state.macro.payload);await send('intelligence-snapshot',state.intelligence.payload);})().catch(err=>{console.error(err);process.exit(1);});
          NODE

      - name: Verify passive edge and live v4 intelligence
        run: |
          node <<'NODE'
          const base='https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev';
          async function get(path){const r=await fetch(base+path,{headers:{Accept:'application/json','Cache-Control':'no-cache'}}),t=await r.text();if(!r.ok)throw new Error(`${path} ${r.status}: ${t.slice(0,700)}`);return JSON.parse(t);}
          (async()=>{
            const health=await get('/api/health');for(const k of ['normalStateUpstreamCalendarRequests','normalStateUpstreamFredRequests','normalStateUpstreamNewsRequests','normalStateUpstreamMarketRequests'])if(Number(health.safety?.[k]??-1)!==0)throw new Error(`${k} must remain zero`);
            const intel=await get('/api/super-economist'),signals=await get('/api/session-signals');if(intel.schemaVersion!==4||intel.executionLocation!=='Google Cloud Run')throw new Error('v4 intelligence not live');if(signals.rankedOpportunities?.length!==8)throw new Error('v4 pair matrix not live');
            const acq=await fetch(base+'/api/acquire?source=fred');if(acq.status!==409)throw new Error('Cloudflare acquisition unexpectedly enabled');
            console.log(`V4 CUTOVER VERIFIED: ${intel.coverage?.eligibleMethods}/9705 eligible, ${signals.decisionSummary?.actionableCount} actionable, Cloudflare upstream requests = 0.`);
          })().catch(err=>{console.error(err);process.exit(1);});
          NODE
