name: Apply FXGA Advanced Technical Upgrade

on:
  push:
    paths:
      - '.github/workflows/apply-advanced-technical.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fxga-advanced-technical-upgrade
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Apply advanced technical integration
        run: python3 scripts/apply_advanced_technical.py

      - name: Validate collector and dashboard
        run: |
          node --check cloud-run-collector/src/advanced-technical.js
          node --check cloud-run-collector/src/technical-engine.js
          node --check cloud-run-collector/src/server-v2.js
          npm install --no-audit --no-fund
          npm run build

      - name: Commit integrated upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No source changes were produced."
            exit 0
          fi
          git add cloud-run-collector/src/technical-engine.js cloud-run-collector/package.json
          git commit -m "Integrate advanced SMC evidence layer"
          git push origin HEAD:main
