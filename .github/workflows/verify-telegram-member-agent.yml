name: Verify FXGA Telegram Member Agent

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'agents/telegram-member-agent/**'
      - 'agents/README.md'
      - '.github/workflows/deploy-telegram-member-agent.yml'
      - '.github/workflows/start-telegram-member-agent.yml'
      - '.github/workflows/verify-telegram-member-agent.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install and validate
        working-directory: agents/telegram-member-agent
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check
          node -e "const p=require('./package.json'); if(p.version !== '1.3.0') process.exit(1); if(!p.dependencies.teleproto || !p.dependencies['@google-cloud/firestore'] || !p.dependencies['@google-cloud/secret-manager']) process.exit(1)"

      - name: Reject credentials and member datasets in source
        working-directory: agents/telegram-member-agent
        run: |
          set -euo pipefail
          ! grep -REn "(api[_-]?hash|session)[[:space:]]*[:=][[:space:]]*['\"][A-Za-z0-9_=-]{20,}" . \
            --exclude='package-lock.json' || { echo '::error::Possible Telegram credential committed to source'; exit 1; }
          ! grep -REn "[0-9]{6,12}:AA[A-Za-z0-9_-]{20,}" . \
            --exclude='package-lock.json' || { echo '::error::Possible Telegram bot token committed to source'; exit 1; }
          ! find . -maxdepth 3 \( -name '*.xlsx' -o -name '*.xls' -o -name '*.csv' -o -name '*.session' \) -print -quit | grep -q . \
            || { echo '::error::Member/source data must not be committed under the agent directory'; exit 1; }

      - name: Verify persistence, preflight and super-admin contracts
        working-directory: agents/telegram-member-agent
        run: |
          set -euo pipefail
          grep -q 'dailyAdded' index.js
          grep -q 'missingInvitees' index.js
          grep -q 'MAX_ATTEMPTS_PER_RUN' index.js
          grep -q 'FLOOD_WAIT' index.js
          grep -q 'PEER_FLOOD' index.js
          grep -q 'lastImportedAt' scripts/import-members.mjs
          grep -q 'TELEGRAM_MEMBER_QUEUE_EMPTY' scripts/preflight.mjs
          grep -q 'checkAuthorization' scripts/preflight.mjs
          grep -q 'SecretManagerServiceClient' admin-server.js
          grep -q 'getMe' admin-server.js
          grep -q 'addSecretVersion' admin-server.js
          grep -q 'introspect-admin-session' admin-server.js
          grep -q "payload?.member?.role !== 'super_admin'" admin-server.js
          grep -q "url.pathname === '/api/run'" admin-server.js
          ! grep -En 'FXGA_AGENT_ADMIN_KEY|X-FXGA-Agent-Admin-Key' admin-server.js \
            || { echo '::error::Legacy standalone Telegram admin-password gate must not return'; exit 1; }
          echo 'Persistence, safe preflight and FXGA super-admin control contracts verified.'

      - name: Verify gated operations workflow
        run: |
          set -euo pipefail
          grep -q 'fxga-telegram-member-agent-preflight' .github/workflows/start-telegram-member-agent.yml
          grep -q 'Production preflight passed' .github/workflows/start-telegram-member-agent.yml
          grep -q 'gcloud run jobs execute "$JOB_NAME"' .github/workflows/start-telegram-member-agent.yml
          echo 'Operations can only start after the production preflight succeeds.'

      - name: Verify protected Telegram bot token
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${TELEGRAM_BOT_TOKEN:-}" || { echo '::error::TELEGRAM_BOT_TOKEN is not configured in GitHub Actions secrets'; exit 1; }
          echo 'TELEGRAM_BOT_TOKEN is configured in GitHub Actions.'
          node <<'NODE'
          const token = process.env.TELEGRAM_BOT_TOKEN;
          const response = await fetch(`https://api.telegram.org/bot${token}/getMe`, {
            headers: { Accept: 'application/json' },
            cache: 'no-store'
          });
          const payload = await response.json().catch(() => null);
          if (!response.ok || payload?.ok !== true || !payload?.result) {
            console.error('::error::Telegram rejected TELEGRAM_BOT_TOKEN');
            process.exit(1);
          }
          const username = payload.result.username ? `@${payload.result.username}` : '(no username)';
          console.log(`Telegram Bot API verified: ${username}; bot id ${payload.result.id}.`);
          NODE

      - name: Enforce direct-add-only Telegram contract
        working-directory: agents/telegram-member-agent
        run: |
          set -euo pipefail
          # Telegram names its channel/supergroup direct-add RPC channels.inviteToChannel.
          # This must remain the only member action: no DMs, invite links, join links, or fallback messaging.
          grep -q 'Api.channels.InviteToChannel' index.js
          ! grep -REn 'sendMessage|SendMessage|CreateChatInvite|ExportChatInvite|ImportChatInvite|CheckChatInvite|createChatInviteLink|exportChatInvite|importChatInvite' \
            index.js scripts \
            || { echo '::error::Direct-add-only contract violated: messaging or invite-link code detected'; exit 1; }
          echo 'Direct-add-only contract verified: no invitation links or private messages.'
