name: Activate Google Cloud Collector

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/activate-google-collector.trigger'

permissions:
  contents: read
  id-token: write

env:
  SERVICE: fxga-macro-collector
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install

      - name: Require Google and shared-secret configuration
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          COLLECTOR_WEBHOOK_SECRET: ${{ secrets.COLLECTOR_WEBHOOK_SECRET }}
        run: |
          for name in PROJECT_ID WIF_PROVIDER DEPLOY_SA COLLECTOR_WEBHOOK_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured."
              exit 1
            fi
          done

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: service
        name: Resolve deployed Cloud Run service
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          gcloud config set project "$PROJECT_ID"
          SERVICE_URL=$(gcloud run services describe "$SERVICE" --region "$GCP_REGION" --format='value(status.url)')
          if [ -z "$SERVICE_URL" ]; then
            echo '::error::Cloud Run collector service is not deployed.'
            exit 1
          fi
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"

      - id: invoke_auth
        name: Mint Cloud Run ID token
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.url }}
          id_token_include_email: true

      - name: Prove Cloud Run collector is deployed and ready
        env:
          TOKEN: ${{ steps.invoke_auth.outputs.id_token }}
        run: |
          request_json() {
            NAME="$1"; METHOD="$2"; URL="$3"; BODY="${4:-}"
            OUT="/tmp/${NAME}.json"
            if [ "$METHOD" = "POST" ]; then
              STATUS=$(curl -sS -o "$OUT" -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$URL")
            else
              STATUS=$(curl -sS -o "$OUT" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL")
            fi
            echo "$NAME HTTP $STATUS"
            if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
              node -e 'const fs=require("fs");let s=fs.readFileSync(process.argv[1],"utf8");try{const j=JSON.parse(s);console.error(JSON.stringify({error:j.error||"collector request failed"}))}catch{console.error(s.slice(0,500))}' "$OUT"
              exit 1
            fi
          }

          request_json health GET "$SERVICE_URL/health"
          node -e '
            const h=require("/tmp/health.json");
            if(!h.ok || h.service!=="fxga-cloud-run-collector" || Number(h.version||0)<2) throw new Error("Collector v2 health check failed");
            console.log(`Collector v${h.version} health passed; FRED=${Boolean(h.fredConfigured)} tasks=${Boolean(h.tasksConfigured)} webhook=${Boolean(h.webhookConfigured)}`);
          '

          request_json bootstrap POST "$SERVICE_URL/bootstrap" '{}'
          node -e 'const b=require("/tmp/bootstrap.json");console.log(`Bootstrap returned ${b.events||0} events; changed=${Boolean(b.changed)}; task clusters=${b.scheduled?.clusters||0}; tasks=${b.scheduled?.tasksCreated||0}`)'

          request_json macro POST "$SERVICE_URL/macro-sync?mode=full" '{"mode":"full"}'
          node -e 'const m=require("/tmp/macro.json");console.log(`Full macro sync returned ${m.observations||0} observations from ${m.requested||0} requested; failures=${m.failures||0}`)'

          request_json state GET "$SERVICE_URL/state"
          node -e '
            const state=require("/tmp/state.json");
            const events=state?.calendar?.payload?.events?.length||0;
            const observations=state?.macro?.payload?.observations?.length||0;
            const universe=state?.fredUniverse?.payload?.summary;
            console.log(`Collector state proof: events=${events}, observations=${observations}, curatedBase=${universe?.curatedBase||0}, universeTotal=${universe?.total||0}`);
            if(events<1) throw new Error("Collector calendar state is empty");
            if(observations<100) throw new Error(`Collector full macro state is too small: ${observations}`);
            if((universe?.curatedBase||0)<109) throw new Error(`Curated FRED base is below 109: ${universe?.curatedBase||0}`);
          '

      - name: Sync collector webhook secret to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4f260a0775a3df407e08512610c9898b
          COLLECTOR_WEBHOOK_SECRET: ${{ secrets.COLLECTOR_WEBHOOK_SECRET }}
        run: printf '%s' "$COLLECTOR_WEBHOOK_SECRET" | npx wrangler secret put COLLECTOR_WEBHOOK_SECRET

      - id: replay_auth
        name: Refresh Cloud Run ID token for replay
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.url }}
          id_token_include_email: true

      - name: Replay fresh Cloud Run state into Cloudflare
        env:
          TOKEN: ${{ steps.replay_auth.outputs.id_token }}
          COLLECTOR_WEBHOOK_SECRET: ${{ secrets.COLLECTOR_WEBHOOK_SECRET }}
        run: |
          STATE=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$SERVICE_URL/state")
          printf '%s' "$STATE" > /tmp/cloud-run-state.json
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const state = JSON.parse(fs.readFileSync('/tmp/cloud-run-state.json','utf8'));
          const secret = process.env.COLLECTOR_WEBHOOK_SECRET;
          const url = 'https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev/api/collector-webhook';
          async function send(type, payload) {
            const body = JSON.stringify({version:1,type,generatedAt:new Date().toISOString(),payload});
            const timestamp=String(Date.now());
            const requestId=crypto.randomUUID();
            const signature=crypto.createHmac('sha256',secret).update(`${timestamp}.${requestId}.${body}`).digest('hex');
            const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-FXGA-Timestamp':timestamp,'X-FXGA-Request-Id':requestId,'X-FXGA-Signature':`sha256=${signature}`},body});
            if(!r.ok) throw new Error(`${type} replay failed ${r.status}: ${(await r.text()).slice(0,300)}`);
          }
          (async()=>{
            await send('calendar-snapshot', state.calendar.payload);
            await send('macro-snapshot', state.macro.payload);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Deploy Worker in external webhook mode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4f260a0775a3df407e08512610c9898b
        run: npx wrangler deploy --var COLLECTOR_MODE:external-webhook

      - name: Verify passive Cloudflare mode with populated global state
        run: |
          node <<'NODE'
          const base = 'https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev';
          const sleep = ms => new Promise(r=>setTimeout(r,ms));
          let health;
          for(let i=0;i<10;i++){
            const r=await fetch(base+'/api/health',{headers:{Accept:'application/json'}});
            health=await r.json();
            if(health?.collectorMode==='google-cloud-run-webhook') break;
            await sleep(1500);
          }
          if(health?.collectorMode!=='google-cloud-run-webhook') throw new Error('External collector mode did not activate');
          if(health?.safety?.normalStateUpstreamCalendarRequests!==0 || health?.safety?.normalStateUpstreamFredRequests!==0) throw new Error('Passive-mode upstream request guard failed');
          if(health?.safety?.browserSoftBudgetSecondsPerUtcDay!==0) throw new Error('Cloudflare Browser Run was not disabled');
          const state=await (await fetch(base+'/api/release-state')).json();
          if(!state?.initialized || !state?.baseline?.analysis || (state?.baseline?.observations?.length||0)<100 || !(state?.upcoming?.length>0)) throw new Error('Cloudflare external state is not fully populated');
          const globalMacro=await (await fetch(base+'/api/global-macro')).json();
          if((globalMacro?.totalObservations||0)<100 || !Array.isArray(globalMacro?.targetEconomies) || globalMacro.targetEconomies.length!==5) throw new Error('Global macro API is incomplete after cutover');
          console.log('Cutover verified: Cloudflare is passive and serving 100+ Google collector observations across five target economies.');
          NODE
