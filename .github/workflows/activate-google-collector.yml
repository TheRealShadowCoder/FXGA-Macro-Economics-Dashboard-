name: Activate Google Cloud Collector

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install

      - name: Require shared webhook secret
        env:
          COLLECTOR_WEBHOOK_SECRET: ${{ secrets.COLLECTOR_WEBHOOK_SECRET }}
        run: |
          if [ -z "$COLLECTOR_WEBHOOK_SECRET" ]; then
            echo '::error::COLLECTOR_WEBHOOK_SECRET is not configured.'
            exit 1
          fi

      - name: Sync collector webhook secret to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4f260a0775a3df407e08512610c9898b
          COLLECTOR_WEBHOOK_SECRET: ${{ secrets.COLLECTOR_WEBHOOK_SECRET }}
        run: printf '%s' "$COLLECTOR_WEBHOOK_SECRET" | npx wrangler secret put COLLECTOR_WEBHOOK_SECRET

      - name: Deploy Worker in external webhook mode
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4f260a0775a3df407e08512610c9898b
        run: npx wrangler deploy --var COLLECTOR_MODE:external-webhook

      - name: Verify passive Cloudflare mode
        run: |
          node <<'NODE'
          const base = 'https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
          let health;
          for (let i = 0; i < 10; i += 1) {
            const response = await fetch(base + '/api/health', { headers: { Accept: 'application/json' } });
            health = await response.json();
            if (health?.collectorMode === 'google-cloud-run-webhook') break;
            await sleep(1500);
          }
          if (health?.collectorMode !== 'google-cloud-run-webhook') throw new Error('External collector mode did not activate');
          if (health?.safety?.normalStateUpstreamCalendarRequests !== 0 || health?.safety?.normalStateUpstreamFredRequests !== 0) throw new Error('Passive-mode upstream request guard failed');
          if (health?.safety?.browserSoftBudgetSecondsPerUtcDay !== 0) throw new Error('Cloudflare Browser Run was not disabled');
          console.log('Cloudflare is now passive: signed webhook + Durable Object + WebSocket only.');
          NODE
