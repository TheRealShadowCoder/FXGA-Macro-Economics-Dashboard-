name: Activate Google Cloud FXGA 9705 Engine

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/activate-google-collector.trigger'

permissions:
  contents: read
  id-token: write

env:
  SERVICE: fxga-macro-collector
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}

jobs:
  activate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm install

      - name: Require Google and shared-secret configuration
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          COLLECTOR_WEBHOOK_SECRET: ${{ secrets.COLLECTOR_WEBHOOK_SECRET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for name in PROJECT_ID WIF_PROVIDER DEPLOY_SA COLLECTOR_WEBHOOK_SECRET CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::$name is not configured"; exit 1; fi
          done

      - id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: service
        name: Resolve deployed private Cloud Run service
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          gcloud config set project "$PROJECT_ID"
          SERVICE_URL=$(gcloud run services describe "$SERVICE" --region "$GCP_REGION" --format='value(status.url)')
          test -n "$SERVICE_URL" || { echo '::error::Cloud Run collector service is not deployed'; exit 1; }
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"

      - id: invoke_auth
        name: Mint private Cloud Run ID token
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.url }}
          id_token_include_email: true

      - name: Bootstrap Google data and build FXGA 9705 intelligence
        env:
          TOKEN: ${{ steps.invoke_auth.outputs.id_token }}
        run: |
          request_json() {
            NAME="$1"; METHOD="$2"; URL="$3"; BODY="${4:-}"
            OUT="/tmp/${NAME}.json"
            if [ "$METHOD" = "POST" ]; then
              STATUS=$(curl -sS -o "$OUT" -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' -d "$BODY" "$URL")
            else
              STATUS=$(curl -sS -o "$OUT" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$URL")
            fi
            echo "$NAME HTTP $STATUS"
            if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
              node -e 'const fs=require("fs");const s=fs.readFileSync(process.argv[1],"utf8");try{const j=JSON.parse(s);console.error(JSON.stringify({error:j.error||"request failed"}))}catch{console.error(s.slice(0,700))}' "$OUT"
              exit 1
            fi
          }

          request_json health GET "$SERVICE_URL/health"
          node - <<'NODE'
          const h=require('/tmp/health.json');
          if(!h.ok||Number(h.version)!==3) throw new Error(`Expected Google collector v3, got ${h.version}`);
          if(h.architecture!=='google-cloud-only-acquisition-and-intelligence') throw new Error('Google-only architecture marker missing');
          if(Number(h.methodRegistry?.totalMethods)!==9705||Number(h.methodRegistry?.totalFamilies)!==150) throw new Error('FXGA 9705 registry contract failed');
          if(h.cloudflareRole!=='signed-webhook-receiver-and-serving-only') throw new Error('Cloudflare passive-role contract missing');
          console.log(`Google v3 health: ${h.methodRegistry.totalMethods} methods / ${h.methodRegistry.totalFamilies} families`);
          NODE

          request_json bootstrap POST "$SERVICE_URL/bootstrap" '{}'
          request_json macro POST "$SERVICE_URL/macro-sync?mode=full" '{"mode":"full"}'
          request_json intelligence POST "$SERVICE_URL/refresh-intelligence" '{"forceNews":true}'
          request_json state GET "$SERVICE_URL/state"

          node - <<'NODE'
          const state=require('/tmp/state.json');
          const events=state?.calendar?.payload?.events?.length||0;
          const observations=state?.macro?.payload?.observations?.length||0;
          const universe=state?.fredUniverse?.payload?.summary||{};
          const intel=state?.intelligence?.payload;
          if(events<1) throw new Error('Google calendar state is empty');
          if(observations<100) throw new Error(`Google full macro state too small: ${observations}`);
          if(Number(universe.curatedBase||0)<109) throw new Error(`Curated FRED base below 109: ${universe.curatedBase||0}`);
          if(Number(intel?.registry?.totalMethods)!==9705||Number(intel?.registry?.totalFamilies)!==150) throw new Error('Google intelligence does not contain the FXGA 9705 registry');
          if(!Array.isArray(intel?.economyAnalysis?.economies)||intel.economyAnalysis.economies.length!==5) throw new Error('Five-economy engine is incomplete');
          if(Number(intel?.globalMacro?.totalObservations||0)<100) throw new Error('Google intelligence global macro state is incomplete');
          if(intel?.executionLocation!=='Google Cloud Run') throw new Error('Decision engine is not marked Google Cloud Run');
          console.log(JSON.stringify({events,observations,universeTotal:universe.total,eligibleMethods:intel.coverage?.eligibleMethods,activeFamilies:intel.coverage?.activeFamilies,economies:intel.economyAnalysis.economies.map(x=>x.id)}));
          NODE

      - name: Sync only webhook authentication secret to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4f260a0775a3df407e08512610c9898b
          COLLECTOR_WEBHOOK_SECRET: ${{ secrets.COLLECTOR_WEBHOOK_SECRET }}
        run: |
          printf '%s' "$COLLECTOR_WEBHOOK_SECRET" | npx wrangler secret put COLLECTOR_WEBHOOK_SECRET
          npx wrangler secret delete FRED_API_KEY >/dev/null 2>&1 || true
          npx wrangler secret delete NEWS_API_KEY >/dev/null 2>&1 || true
          npx wrangler secret delete TRADING_ECONOMICS_API_KEY >/dev/null 2>&1 || true

      - name: Deploy strict passive Cloudflare edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4f260a0775a3df407e08512610c9898b
        run: npx wrangler deploy

      - id: replay_auth
        name: Refresh private Cloud Run ID token for replay
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.url }}
          id_token_include_email: true

      - name: Replay complete Google state into passive Cloudflare
        env:
          TOKEN: ${{ steps.replay_auth.outputs.id_token }}
          COLLECTOR_WEBHOOK_SECRET: ${{ secrets.COLLECTOR_WEBHOOK_SECRET }}
        run: |
          curl -fsS -H "Authorization: Bearer $TOKEN" "$SERVICE_URL/state" > /tmp/google-state.json
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const state=JSON.parse(fs.readFileSync('/tmp/google-state.json','utf8'));
          const secret=process.env.COLLECTOR_WEBHOOK_SECRET;
          const url='https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev/api/collector-webhook';
          async function send(type,payload){
            if(!payload) throw new Error(`${type} replay payload missing`);
            const body=JSON.stringify({version:1,type,generatedAt:new Date().toISOString(),payload});
            const timestamp=String(Date.now()),requestId=crypto.randomUUID();
            const signature=crypto.createHmac('sha256',secret).update(`${timestamp}.${requestId}.${body}`).digest('hex');
            const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-FXGA-Timestamp':timestamp,'X-FXGA-Request-Id':requestId,'X-FXGA-Signature':`sha256=${signature}`},body});
            const text=await r.text();
            if(!r.ok) throw new Error(`${type} replay failed ${r.status}: ${text.slice(0,400)}`);
            console.log(`${type}: ${r.status}`);
          }
          (async()=>{
            await send('calendar-snapshot',state.calendar.payload);
            await send('macro-snapshot',state.macro.payload);
            await send('intelligence-snapshot',state.intelligence.payload);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Verify Cloudflare has zero upstream acquisition and serves Google intelligence
        run: |
          node <<'NODE'
          const base='https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(path){
            let last;
            for(let i=0;i<12;i++){
              try{const r=await fetch(base+path,{headers:{Accept:'application/json','Cache-Control':'no-cache'}}),t=await r.text();if(!r.ok)throw new Error(`${path} ${r.status}: ${t.slice(0,500)}`);return JSON.parse(t);}catch(e){last=e;if(i<11)await sleep(1200);}
            }
            throw last;
          }
          const h=await get('/api/health');
          if(h.collectorMode!=='google-cloud-run-webhook') throw new Error('Cloudflare external mode is not active');
          if(h.configured?.browserRun!==false||h.configured?.calendarScraping!==false||h.configured?.officialNewsScraping!==false) throw new Error('Cloudflare acquisition is still enabled');
          for(const k of ['normalStateUpstreamCalendarRequests','normalStateUpstreamFredRequests','normalStateUpstreamNewsRequests','normalStateUpstreamMarketRequests']) if(Number(h.safety?.[k]??-1)!==0) throw new Error(`${k} is not zero`);
          if(Number(h.safety?.browserSoftBudgetSecondsPerUtcDay??-1)!==0) throw new Error('Cloudflare browser budget is not zero');
          const intel=await get('/api/super-economist');
          if(intel.registry?.totalMethods!==9705||intel.registry?.totalFamilies!==150) throw new Error('FXGA 9705 intelligence missing from Cloudflare cache');
          if(intel.executionLocation!=='Google Cloud Run') throw new Error('Intelligence execution location is incorrect');
          const global=await get('/api/global-macro');
          if(global.totalObservations<100||global.targetEconomies?.length!==5) throw new Error('Global macro webhook state is incomplete');
          const economy=await get('/api/economy-analysis');
          if(economy.economies?.length!==5) throw new Error('Five economy states missing');
          const signals=await get('/api/session-signals');
          if(!signals.sessions?.length||!signals.rankedOpportunities?.length) throw new Error('Google decision signals missing');
          console.log(`CUTOVER VERIFIED: Cloudflare makes zero upstream acquisition requests and serves Google FXGA 9705 intelligence (${intel.coverage?.eligibleMethods}/${intel.registry.totalMethods} methods currently data-eligible).`);
          NODE
