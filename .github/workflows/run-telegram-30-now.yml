name: Run FXGA Telegram One Member

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-telegram-one-member.trigger'

concurrency:
  group: fxga-telegram-member-agent-single-add
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: fxglobalavengerstradingacademy
  GCP_REGION: us-central1
  JOB_NAME: fxga-telegram-member-agent
  PREFLIGHT_JOB: fxga-telegram-member-agent-preflight
  SCHEDULER_NAME: fxga-telegram-member-agent-daily
  DEPLOY_SERVICE_ACCOUNT: fxga-github-deployer@fxglobalavengerstradingacademy.iam.gserviceaccount.com
  TIME_ZONE: Africa/Johannesburg
  FIRESTORE_STATE_COLLECTION: agent_state
  FIRESTORE_STATE_DOCUMENT: telegram-member-agent
  REQUESTED_ADDS: '1'

jobs:
  single-add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - id: config
        name: Resolve Google authentication
        env:
          WIF_PROVIDER_SECRET: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_PROVIDER_VAR: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          set -euo pipefail
          WIF_PROVIDER="${WIF_PROVIDER_SECRET:-$WIF_PROVIDER_VAR}"
          test -n "$WIF_PROVIDER" || { echo '::error::GCP_WIF_PROVIDER is missing'; exit 1; }
          echo "wif_provider=$WIF_PROVIDER" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Prepare guarded single-add controller
        working-directory: agents/telegram-member-agent
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID"
          npm install --omit=dev --no-audit --no-fund
          gcloud run jobs describe "$JOB_NAME" --region "$GCP_REGION" --format='value(metadata.name)' >/dev/null
          gcloud run jobs describe "$PREFLIGHT_JOB" --region "$GCP_REGION" --format='value(metadata.name)' >/dev/null
          gcloud scheduler jobs describe "$SCHEDULER_NAME" --location "$GCP_REGION" --format='value(name)' >/dev/null

      - id: state
        name: Check cooldown and determine one-member ceiling
        working-directory: agents/telegram-member-agent
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { Firestore } from '@google-cloud/firestore';

          const db = new Firestore();
          const snap = await db.collection(process.env.FIRESTORE_STATE_COLLECTION).doc(process.env.FIRESTORE_STATE_DOCUMENT).get();
          const state = snap.exists ? snap.data() : {};
          const now = new Date();
          const blockedUntil = state.blockedUntil?.toDate?.();

          if (blockedUntil && blockedUntil > now) {
            console.error(`::error::Telegram cooldown is active until ${blockedUntil.toISOString()}. No member-add attempt will be made.`);
            process.exit(5);
          }

          const parts = new Intl.DateTimeFormat('en-US', {
            timeZone: process.env.TIME_ZONE,
            year: 'numeric', month: '2-digit', day: '2-digit'
          }).formatToParts(now);
          const values = Object.fromEntries(parts.map(p => [p.type, p.value]));
          const today = `${values.year}-${values.month}-${values.day}`;
          const baseline = state.dailyDate === today ? Math.max(0, Number(state.dailyAdded || 0)) : 0;
          const target = baseline + 1;

          if (!Number.isInteger(baseline) || target > 50) {
            console.error(`::error::Cannot run one-member add: today's verified total is ${baseline} and the 50/day safety ceiling must remain intact.`);
            process.exit(3);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `today=${today}\nbaseline=${baseline}\ntarget=${target}\n`);
          console.log(`Single-add controller: baseline=${baseline}; exact ceiling=${target}.`);
          NODE

      - id: pause
        name: Pause normal daily scheduler
        run: |
          set -euo pipefail
          gcloud scheduler jobs pause "$SCHEDULER_NAME" --location "$GCP_REGION" --quiet
          echo 'Normal scheduler paused for one controlled member addition.'

      - name: Run mandatory preflight
        run: |
          set -euo pipefail
          gcloud run jobs execute "$PREFLIGHT_JOB" --region "$GCP_REGION" --wait --quiet
          echo 'Preflight passed before member mutation.'

      - id: controlled
        name: Add one successful member and stop
        working-directory: agents/telegram-member-agent
        env:
          BASELINE: ${{ steps.state.outputs.baseline }}
          TARGET: ${{ steps.state.outputs.target }}
          TODAY: ${{ steps.state.outputs.today }}
        run: |
          set -euo pipefail

          gcloud run jobs update "$JOB_NAME" --region "$GCP_REGION" \
            --update-env-vars "DAILY_TARGET_MIN=$TARGET,DAILY_TARGET_MAX=$TARGET,MAX_ATTEMPTS_PER_RUN=100" --quiet

          set +e
          gcloud run jobs execute "$JOB_NAME" --region "$GCP_REGION" --wait --quiet
          EXEC_STATUS=$?
          set -e

          node --input-type=module <<'NODE'
          import { Firestore } from '@google-cloud/firestore';
          const db = new Firestore();
          const snap = await db.collection(process.env.FIRESTORE_STATE_COLLECTION).doc(process.env.FIRESTORE_STATE_DOCUMENT).get();
          const state = snap.exists ? snap.data() : {};
          const baseline = Number(process.env.BASELINE);
          const target = Number(process.env.TARGET);
          const current = state.dailyDate === process.env.TODAY ? Math.max(0, Number(state.dailyAdded || 0)) : 0;
          const delta = current - baseline;
          const blocked = Boolean(state.blockedUntil?.toDate?.() && state.blockedUntil.toDate() > new Date());
          const errorCode = typeof state.lastError === 'string' ? state.lastError.replace(/[^A-Z0-9_]/gi, '').slice(0, 80) : '';

          console.log(`Single-add result: ${delta}/1 new successful addition; daily total=${current}; rateLimitBlock=${blocked ? 'yes' : 'no'}${errorCode ? `; lastError=${errorCode}` : ''}.`);
          if (current !== target || delta !== 1) {
            console.error('::error::No verified successful addition was completed. No further member will be forced in this execution.');
            process.exit(4);
          }
          NODE

          if [ "$EXEC_STATUS" -ne 0 ]; then
            echo "::error::Cloud Run direct-add job returned status $EXEC_STATUS despite the counter verification."
            exit "$EXEC_STATUS"
          fi

      - id: restore
        name: Restore normal 20-50 production job configuration
        if: always()
        run: |
          set -euo pipefail
          gcloud run jobs update "$JOB_NAME" --region "$GCP_REGION" \
            --update-env-vars 'DAILY_TARGET_MIN=20,DAILY_TARGET_MAX=50,MAX_ATTEMPTS_PER_RUN=100' --quiet
          echo 'Production worker limits restored to 20-50/day.'

      - id: postflight
        name: Run post-add non-mutating preflight
        if: steps.controlled.outcome == 'success' && steps.restore.outcome == 'success'
        run: |
          set -euo pipefail
          gcloud run jobs execute "$PREFLIGHT_JOB" --region "$GCP_REGION" --wait --quiet
          echo 'Post-add preflight passed.'

      - id: resume
        name: Resume normal daily scheduler
        if: steps.controlled.outcome == 'success' && steps.restore.outcome == 'success' && steps.postflight.outcome == 'success'
        run: |
          set -euo pipefail
          gcloud scheduler jobs resume "$SCHEDULER_NAME" --location "$GCP_REGION" --quiet
          echo 'Normal daily scheduler resumed after the verified single-member addition.'

      - name: Single-add summary
        if: always()
        env:
          BASELINE: ${{ steps.state.outputs.baseline }}
          TARGET: ${{ steps.state.outputs.target }}
        run: |
          echo "Maximum successful additions this execution: 1"
          echo "Starting daily count: ${BASELINE:-unavailable}"
          echo "Exact controlled ceiling: ${TARGET:-unavailable}"
          echo "Single-add outcome: ${{ steps.controlled.outcome }}"
          echo "Production configuration restore: ${{ steps.restore.outcome }}"
          echo "Postflight: ${{ steps.postflight.outcome }}"
          echo "Scheduler pause: ${{ steps.pause.outcome }}"
          echo "Scheduler resume: ${{ steps.resume.outcome }}"
          if [ "${{ steps.controlled.outcome }}" != 'success' ] || [ "${{ steps.restore.outcome }}" != 'success' ] || [ "${{ steps.postflight.outcome }}" != 'success' ] || [ "${{ steps.resume.outcome }}" != 'success' ]; then
            if [ "${{ steps.pause.outcome }}" = 'success' ] && [ "${{ steps.resume.outcome }}" != 'success' ]; then
              echo 'Scheduler remains paused because the guarded single-add did not finish all safety gates.'
            else
              echo 'The guarded single-add did not finish all safety gates; no unverified success is being reported.'
            fi
            exit 1
          fi
          echo 'Verified result: exactly one new successful direct addition completed; worker stopped at the one-member ceiling.'
