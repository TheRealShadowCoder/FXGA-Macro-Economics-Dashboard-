name: Deploy FXGA Cloudflare Static Website

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy FXGA Google Cloud Application']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare-static.yml'

concurrency:
  group: fxga-cloudflare-static-website
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: fxglobalavengerstradingacademy
  GCP_REGION: us-central1
  GCP_APP_SERVICE: fxga-macro-dashboard
  GCP_DEPLOY_SERVICE_ACCOUNT: fxga-github-deployer@fxglobalavengerstradingacademy.iam.gserviceaccount.com
  CLOUDFLARE_ACCOUNT_ID: 4f260a0775a3df407e08512610c9898b
  CLOUDFLARE_SITE_URL: https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev
  RELEASE_NAME: cross-asset-mt5-60d-event-research

jobs:
  deploy-static-site:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - id: release
        name: Resolve release commit
        run: |
          set -euo pipefail
          RELEASE_SHA=$(git rev-parse HEAD)
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          echo "Deploying current main release: $RELEASE_SHA"

      - id: config
        name: Resolve Google Cloud authentication
        env:
          WIF_PROVIDER_SECRET: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_PROVIDER_VAR: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          set -euo pipefail
          WIF_PROVIDER="${WIF_PROVIDER_SECRET:-$WIF_PROVIDER_VAR}"
          test -n "$WIF_PROVIDER" || { echo '::error::GCP_WIF_PROVIDER is missing'; exit 1; }
          echo "wif_provider=$WIF_PROVIDER" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve and warm the Google Cloud API
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID"
          APP_URL=$(gcloud run services describe "$GCP_APP_SERVICE" \
            --region "$GCP_REGION" \
            --platform managed \
            --format='value(status.url)')
          test -n "$APP_URL" || { echo '::error::Google Cloud application URL is missing'; exit 1; }
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "APP_SERVICE=$GCP_APP_SERVICE" >> "$GITHUB_ENV"
          echo "VITE_GOOGLE_CLOUD_API_BASE=$APP_URL" >> "$GITHUB_ENV"

          APP_URL="$APP_URL" node <<'NODE'
          const base=process.env.APP_URL;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function timed(url,ms){
            const controller=new AbortController();
            const timer=setTimeout(()=>controller.abort(),ms);
            try{return await fetch(url,{headers:{Accept:'application/json','Cache-Control':'no-cache'},cache:'no-store',signal:controller.signal});}
            finally{clearTimeout(timer);}
          }
          let last;
          for(let attempt=1;attempt<=24;attempt++){
            try{
              const healthResponse=await timed(base+'/api/health',30000);
              if(!healthResponse.ok)throw new Error(`/api/health ${healthResponse.status}`);
              const h=await healthResponse.json();
              if(h.compute!=='Google Cloud Run'||h.state!=='Google Cloud Firestore')throw new Error('Google Cloud health contract mismatch');

              const dashboardResponse=await timed(base+'/api/dashboard',45000);
              if(!dashboardResponse.ok)throw new Error(`/api/dashboard ${dashboardResponse.status}`);
              const d=await dashboardResponse.json();
              if(!Array.isArray(d.market)||!Array.isArray(d.sources))throw new Error('Dashboard payload contract missing market/sources');
              console.log('Google Cloud macro API ready:',base,'assets=',d.market.length,'attempt=',attempt);
              process.exit(0);
            }catch(error){
              last=error;
              console.log(`Backend warm-up attempt ${attempt}/24 failed:`,String(error?.message||error));
              await sleep(5000);
            }
          }
          throw last||new Error('Google Cloud macro API did not become ready');
          NODE

      - name: Build Cloudflare static frontend and stamp release
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const marker={
            commit:process.env.RELEASE_SHA,
            builtAt:new Date().toISOString(),
            release:process.env.RELEASE_NAME,
            backendService:process.env.APP_SERVICE||null,
            backendUrl:process.env.APP_URL||null,
            features:[
              'cross-asset-tabs',
              'mt5-data-smc-fusion',
              '60-day-canonical-m1',
              'incremental-mt5-sync',
              'event-price-research',
              'pre-news-price-action',
              'time-signatures',
              'pattern-profiling',
              'cold-start-aware-api-client',
              'live-signal-intelligence',
              'smc2000-indicator-signals',
              '100-advanced-ai-prompts',
              'realtime-trade-management',
              'sticky-cross-asset-tabs'
            ]
          };
          fs.writeFileSync('public/fxga-build.json',JSON.stringify(marker,null,2)+'\n');
          NODE

          npm install --no-audit --no-fund
          npm run build

          grep -R -F "$APP_URL" dist >/dev/null || { echo '::error::Frontend build is not pinned to the discovered Google Cloud API'; exit 1; }
          grep -R -F "MT5 Data + SMC Fusion" dist >/dev/null || { echo '::error::Compiled frontend is missing the Cross Asset MT5 Data + SMC Fusion tab'; exit 1; }
          grep -R -F "Cross Asset Board" dist >/dev/null || { echo '::error::Compiled frontend is missing the Cross Asset Board tab'; exit 1; }
          grep -R -F "Event Study & Backtesting" dist >/dev/null || { echo '::error::Compiled frontend is missing Event Study & Backtesting'; exit 1; }
          grep -R -F "Price action before and after every economic release" dist >/dev/null || { echo '::error::Compiled frontend is missing the pre/post-news event-price research workspace'; exit 1; }
          grep -R -F "Live Signal Intelligence" dist >/dev/null || { echo '::error::Compiled frontend is missing Live Signal Intelligence navigation'; exit 1; }
          grep -R -F "Ask FXGA AI" dist >/dev/null || { echo '::error::Compiled frontend is missing the FXGA AI chatbot'; exit 1; }
          test -f dist/fxga-intelligence-live.html || { echo '::error::Compiled frontend is missing the live intelligence journal'; exit 1; }
          grep -F "Ask anything about FXGA" dist/fxga-intelligence-live.html >/dev/null || { echo '::error::Live intelligence journal is missing its program chatbot'; exit 1; }
          test -f dist/fxga-build.json || { echo '::error::Release marker was not copied into the static build'; exit 1; }

          node <<'NODE'
          const fs=require('fs');
          const marker=JSON.parse(fs.readFileSync('dist/fxga-build.json','utf8'));
          if(marker.commit!==process.env.RELEASE_SHA)throw new Error(`Build marker commit mismatch: ${marker.commit}`);
          if(marker.release!==process.env.RELEASE_NAME)throw new Error(`Unexpected release marker: ${marker.release}`);
          for(const feature of ['60-day-canonical-m1','event-price-research','pre-news-price-action','cold-start-aware-api-client','smc2000-indicator-signals','100-advanced-ai-prompts','realtime-trade-management']){
            if(!marker.features?.includes(feature))throw new Error(`Release marker missing ${feature}`);
          }
          console.log('VERIFIED BEFORE DEPLOY:',marker);
          NODE

      - name: Enforce static-only Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          node <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if(config.main)throw new Error('Cloudflare must not have a Worker script');
          if(config.assets?.directory!=='./dist')throw new Error('Cloudflare must serve only the compiled static frontend');
          if(config.assets?.not_found_handling!=='single-page-application')throw new Error('SPA static fallback is required');
          const forbidden=['durable_objects','kv_namespaces','r2_buckets','d1_databases','services','queues','triggers','browser','ai','vectorize','workflows','vars'];
          for(const key of forbidden)if(config[key]!==undefined)throw new Error(`Cloudflare static host must not configure ${key}`);
          if(fs.existsSync('worker'))throw new Error('Cloudflare application Worker source must not exist');
          console.log('Cloudflare contract verified: static asset hosting only; zero application processing.');
          NODE

      - name: Deploy static website to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.123.0'
          command: deploy

      - name: Verify exact release is live on Cloudflare
        run: |
          node <<'NODE'
          const site=process.env.CLOUDFLARE_SITE_URL;
          const api=process.env.APP_URL;
          const sha=process.env.RELEASE_SHA;
          const release=process.env.RELEASE_NAME;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let root,marker,last;
          for(let i=0;i<60;i++){
            try{
              root=await fetch(site+'/?release='+encodeURIComponent(sha),{headers:{'Cache-Control':'no-cache'},cache:'no-store'});
              const markerResponse=await fetch(site+'/fxga-build.json?release='+encodeURIComponent(sha),{headers:{Accept:'application/json','Cache-Control':'no-cache'},cache:'no-store'});
              if(root.ok&&markerResponse.ok){
                const candidate=await markerResponse.json();
                if(candidate.commit===sha&&candidate.release===release&&candidate.features?.includes('100-advanced-ai-prompts')&&candidate.features?.includes('realtime-trade-management')){
                  marker=candidate;
                  break;
                }
                last=new Error(`Cloudflare still serves another release: ${candidate.commit||'unknown'} / ${candidate.release||'unknown'}`);
              }
            }catch(error){last=error;}
            await sleep(2000);
          }
          if(!root?.ok)throw new Error('Cloudflare static website did not become ready');
          if(!marker)throw last||new Error('Exact 100-prompt intelligence release marker did not become live');

          const cloud=await fetch(api+'/api/health',{headers:{Accept:'application/json','Cache-Control':'no-cache'},cache:'no-store'});
          const h=await cloud.json();
          if(!cloud.ok||h.compute!=='Google Cloud Run'||h.state!=='Google Cloud Firestore')throw new Error('Google Cloud processing contract failed');
          console.log('VERIFIED LIVE RELEASE:',marker);
          NODE
