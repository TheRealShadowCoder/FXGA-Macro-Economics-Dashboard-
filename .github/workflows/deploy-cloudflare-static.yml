name: Deploy FXGA Cloudflare Static Website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare-static.yml'

concurrency:
  group: fxga-cloudflare-static-website
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: fxglobalavengerstradingacademy
  GCP_REGION: us-central1
  GCP_APP_SERVICE: fxga-macro-dashboard
  GCP_DEPLOY_SERVICE_ACCOUNT: fxga-github-deployer@fxglobalavengerstradingacademy.iam.gserviceaccount.com
  CLOUDFLARE_ACCOUNT_ID: 4f260a0775a3df407e08512610c9898b
  CLOUDFLARE_SITE_URL: https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev

jobs:
  deploy-static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - id: config
        name: Resolve Google Cloud authentication
        env:
          WIF_PROVIDER_SECRET: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_PROVIDER_VAR: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          WIF_PROVIDER="${WIF_PROVIDER_SECRET:-$WIF_PROVIDER_VAR}"
          test -n "$WIF_PROVIDER" || { echo '::error::GCP_WIF_PROVIDER is missing'; exit 1; }
          echo "wif_provider=$WIF_PROVIDER" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Discover live FXGA macro API and verify contract
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID"

          APP_URL=''
          APP_SERVICE=''

          # Do not trust a hard-coded Cloud Run service name. The project has had
          # multiple FXGA services over time (macro app, MT5 ingress, collector).
          # Select the service by behavior: it must expose the macro dashboard API.
          for attempt in $(seq 1 120); do
            while IFS=$'\t' read -r service url; do
              [ -n "${url:-}" ] || continue
              if FXGA_CANDIDATE_URL="$url" node <<'NODE'
          const base=process.env.FXGA_CANDIDATE_URL;
          const timeout=ms=>new Promise((_,reject)=>setTimeout(()=>reject(new Error('timeout')),ms));
          async function main(){
            try{
              const healthResponse=await Promise.race([
                fetch(base+'/api/health',{headers:{Accept:'application/json','Cache-Control':'no-cache'}}),
                timeout(5000)
              ]);
              if(!healthResponse.ok)process.exit(1);
              const h=await healthResponse.json();
              if(h.compute!=='Google Cloud Run')process.exit(1);
              if(h.state!=='Google Cloud Firestore')process.exit(1);
              const dashboardResponse=await Promise.race([
                fetch(base+'/api/dashboard',{headers:{Accept:'application/json','Cache-Control':'no-cache'}}),
                timeout(8000)
              ]);
              if(!dashboardResponse.ok)process.exit(1);
              const d=await dashboardResponse.json();
              if(!d||!Array.isArray(d.market)||!Array.isArray(d.sources))process.exit(1);
              console.log('FXGA macro API candidate accepted:',base,'market assets=',d.market.length);
              process.exit(0);
            }catch{process.exit(1);}
          }
          main();
          NODE
              then
                APP_URL="$url"
                APP_SERVICE="$service"
                break
              fi
            done < <(gcloud run services list --region "$GCP_REGION" --platform managed --format='value(metadata.name,status.url)' 2>/dev/null || true)

            if [ -n "$APP_URL" ]; then
              echo "Discovered FXGA macro backend service: $APP_SERVICE"
              echo "Discovered FXGA macro backend URL: $APP_URL"
              break
            fi

            # The dedicated API workflow may still be creating/recreating the service.
            echo "No valid FXGA macro API discovered yet ($attempt/120). Waiting 5 seconds..."
            sleep 5
          done

          test -n "$APP_URL" || { echo '::error::No Cloud Run service exposing the FXGA /api/dashboard contract was found within 10 minutes'; exit 1; }
          export APP_URL
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "APP_SERVICE=$APP_SERVICE" >> "$GITHUB_ENV"
          echo "VITE_GOOGLE_CLOUD_API_BASE=$APP_URL" >> "$GITHUB_ENV"

          node <<'NODE'
          const base=process.env.APP_URL;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last;
          for(let i=0;i<30;i++){
            try{
              const [healthResponse,dashboardResponse]=await Promise.all([
                fetch(base+'/api/health',{headers:{Accept:'application/json','Cache-Control':'no-cache'}}),
                fetch(base+'/api/dashboard',{headers:{Accept:'application/json','Cache-Control':'no-cache'}})
              ]);
              if(!healthResponse.ok)throw new Error(`/api/health ${healthResponse.status}`);
              if(!dashboardResponse.ok)throw new Error(`/api/dashboard ${dashboardResponse.status}`);
              const h=await healthResponse.json();
              const d=await dashboardResponse.json();
              if(h.compute!=='Google Cloud Run'||h.state!=='Google Cloud Firestore')throw new Error('Not the FXGA Google Cloud macro backend');
              if(!Array.isArray(d.market)||!Array.isArray(d.sources))throw new Error('Dashboard payload contract missing');
              console.log('Google Cloud macro API ready:',base,'service=',process.env.APP_SERVICE||'auto-discovered');
              process.exit(0);
            }catch(error){last=error;await sleep(2000);}
          }
          throw last||new Error('Google Cloud macro API did not become ready');
          NODE

      - name: Build Cloudflare hosted frontend and stamp exact release
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const marker={commit:process.env.GITHUB_SHA,builtAt:new Date().toISOString(),release:'cross-asset-mt5-20k-smc-fusion',backendService:process.env.APP_SERVICE||null,backendUrl:process.env.APP_URL||null,features:['cross-asset-tabs','mt5-data-smc-fusion','20k-canonical-m1','160-bar-300-second-sync','size-calculator','live-signal-intelligence','sticky-cross-asset-tabs']};
          fs.writeFileSync('public/fxga-build.json',JSON.stringify(marker,null,2)+'\n');
          NODE
          npm install --no-audit --no-fund
          npm run build
          grep -R -F "$APP_URL" dist >/dev/null || { echo '::error::Frontend build is not pinned to the discovered Google Cloud API'; exit 1; }
          grep -R -F "MT5 Data + SMC Fusion" dist >/dev/null || { echo '::error::Compiled frontend is missing the Cross Asset MT5 Data + SMC Fusion tab'; exit 1; }
          grep -R -F "Cross Asset Board" dist >/dev/null || { echo '::error::Compiled frontend is missing the Cross Asset Board tab'; exit 1; }
          grep -R -F "20K M1 cache" dist >/dev/null || { echo '::error::Compiled frontend is missing the 20K canonical M1 tab contract'; exit 1; }
          grep -R -F "Live Signal Intelligence" dist >/dev/null || { echo '::error::Compiled frontend is missing the Live Signal Intelligence navigation'; exit 1; }
          test -f dist/fxga-build.json || { echo '::error::Release marker was not copied into the static build'; exit 1; }
          node - <<'NODE'
          const fs=require('fs');
          const marker=JSON.parse(fs.readFileSync('dist/fxga-build.json','utf8'));
          if(marker.commit!==process.env.GITHUB_SHA)throw new Error(`Build marker commit mismatch: ${marker.commit}`);
          if(!marker.features?.includes('mt5-data-smc-fusion')||!marker.features?.includes('sticky-cross-asset-tabs'))throw new Error('Cross Asset MT5 release marker missing');
          console.log('VERIFIED BEFORE DEPLOY:',marker);
          NODE

      - name: Enforce static-only Cloudflare configuration
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN is missing'; exit 1; }
          node <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if(config.main)throw new Error('Cloudflare must not have a Worker script');
          if(config.assets?.directory!=='./dist')throw new Error('Cloudflare must serve only the compiled static frontend');
          if(config.assets?.not_found_handling!=='single-page-application')throw new Error('SPA static fallback is required');
          const forbidden=['durable_objects','kv_namespaces','r2_buckets','d1_databases','services','queues','triggers','browser','ai','vectorize','workflows','vars'];
          for(const key of forbidden)if(config[key]!==undefined)throw new Error(`Cloudflare static host must not configure ${key}`);
          if(fs.existsSync('worker'))throw new Error('Cloudflare application Worker source must not exist');
          console.log('Cloudflare contract verified: static asset hosting only; zero application processing.');
          NODE

      - name: Deploy static website to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.123.0'
          command: deploy

      - name: Verify exact MT5 Cross Asset release is live on Cloudflare
        run: |
          node <<'NODE'
          const site=process.env.CLOUDFLARE_SITE_URL,api=process.env.APP_URL,sha=process.env.GITHUB_SHA;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let root,marker,last;
          for(let i=0;i<60;i++){
            try{
              root=await fetch(site+'/?release='+encodeURIComponent(sha),{headers:{'Cache-Control':'no-cache'},cache:'no-store'});
              const markerResponse=await fetch(site+'/fxga-build.json?release='+encodeURIComponent(sha),{headers:{Accept:'application/json','Cache-Control':'no-cache'},cache:'no-store'});
              if(root.ok&&markerResponse.ok){
                const candidate=await markerResponse.json();
                if(candidate.commit===sha&&candidate.release==='cross-asset-mt5-20k-smc-fusion'&&candidate.features?.includes('sticky-cross-asset-tabs')){marker=candidate;break;}
                last=new Error(`Cloudflare still serves another release: ${candidate.commit||'unknown'}`);
              }
            }catch(error){last=error;}
            await sleep(2000);
          }
          if(!root?.ok)throw new Error('Cloudflare static website did not become ready');
          if(!marker)throw last||new Error('Exact Cross Asset MT5 release marker did not become live');
          const html=await root.text();
          if(!/<div[^>]+id=["']root["']/i.test(html))throw new Error('Cloudflare root is not the FXGA frontend');
          const cloud=await fetch(api+'/api/health',{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
          const h=await cloud.json();
          if(!cloud.ok||h.compute!=='Google Cloud Run'||h.state!=='Google Cloud Firestore')throw new Error('Google Cloud processing contract failed');
          console.log('VERIFIED LIVE RELEASE:',marker);
          console.log('Resolved macro backend:',process.env.APP_SERVICE||'auto-discovered',api);
          NODE
