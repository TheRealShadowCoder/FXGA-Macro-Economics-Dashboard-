name: Deploy FXGA R0 Cloudflare Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'worker/**'
      - 'scripts/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare-static.yml'

concurrency:
  group: fxga-r0-cloudflare-runtime
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_SITE_URL: https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev
  D1_DATABASE_NAME: fxga-free-db

jobs:
  deploy-r0-runtime:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FXGA_INGEST_TOKEN: ${{ secrets.FXGA_INGEST_TOKEN }}
      FXGA_MT5_REPORT_SECRET: ${{ secrets.FXGA_MT5_REPORT_SECRET }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Resolve and validate R0 deployment credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN must be added under repository Actions secrets'; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo '::error::GEMINI_API_KEY must be added under repository Actions secrets to preserve Ask FXGA AI'; exit 1; }

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'CLOUDFLARE_ACCOUNT_ID was not injected by GitHub; resolving it from the existing Cloudflare API token.'
            npx wrangler@latest whoami --json > "$RUNNER_TEMP/cloudflare-whoami.json"
            RESOLVED_ACCOUNT_ID=$(node - <<'NODE'
          const fs = require('fs');
          const info = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/cloudflare-whoami.json', 'utf8'));
          if (info?.loggedIn === false) throw new Error('Cloudflare API token did not authenticate');
          const accounts = Array.isArray(info?.accounts) ? info.accounts : [];
          const id = accounts[0]?.id;
          if (!id) throw new Error('Wrangler authenticated but did not return an accessible Cloudflare account');
          process.stdout.write(id);
          NODE
            )
            echo "::add-mask::$RESOLVED_ACCOUNT_ID"
            echo "CLOUDFLARE_ACCOUNT_ID=$RESOLVED_ACCOUNT_ID" >> "$GITHUB_ENV"
            echo 'Cloudflare account resolved from API token.'
          else
            echo 'Cloudflare account ID supplied by GitHub Actions configuration.'
          fi

      - name: Install and build frontend
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            echo 'No package-lock.json found; using npm install for this build.'
            npm install --no-audit --no-fund
          fi
          node --check worker/src/index.js
          node --check worker/src/r0-entry.js
          node --check scripts/r0-collect-market.mjs
          node --check scripts/r0-collect-macro.mjs
          npm run build
          test -f dist/index.html
          grep -R -F "Ask FXGA AI" dist >/dev/null || { echo '::error::Compiled frontend is missing Ask FXGA AI'; exit 1; }

      - name: Provision or attach free D1 database
        run: |
          set -euo pipefail
          npx wrangler@latest d1 list --json > "$RUNNER_TEMP/d1-list.json"
          D1_ID=$(node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d1-list.json','utf8'));
          const row=(Array.isArray(rows)?rows:[]).find(x=>x.name===process.env.D1_DATABASE_NAME);
          process.stdout.write(row?.uuid || row?.id || '');
          NODE
          )

          if [ -z "$D1_ID" ]; then
            echo "Creating D1 database $D1_DATABASE_NAME"
            npx wrangler@latest d1 create "$D1_DATABASE_NAME" --binding DB --update-config --config wrangler.jsonc
          else
            echo "Attaching existing D1 database $D1_DATABASE_NAME ($D1_ID)"
            D1_ID="$D1_ID" node <<'NODE'
          const fs=require('fs');
          const path='wrangler.jsonc';
          const config=JSON.parse(fs.readFileSync(path,'utf8'));
          config.d1_databases=[{binding:'DB',database_name:process.env.D1_DATABASE_NAME,database_id:process.env.D1_ID}];
          fs.writeFileSync(path,JSON.stringify(config,null,2)+'\n');
          NODE
          fi

          node <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          const db=config.d1_databases?.find(x=>x.binding==='DB');
          if(!db?.database_id)throw new Error('R0 D1 binding was not created');
          if(config.main!=='./worker/src/r0-entry.js')throw new Error('R0 compatibility Worker main entry is missing');
          if(!config.assets?.run_worker_first?.includes('/api/*'))throw new Error('/api/* must execute Worker first');
          console.log('R0 config ready with D1 binding',db.database_name);
          NODE

      - name: Apply D1 schema
        run: |
          set -euo pipefail
          npx wrangler@latest d1 execute "$D1_DATABASE_NAME" --remote --file=worker/schema.sql --config wrangler.jsonc

      - name: Deploy Worker and static assets
        run: |
          set -euo pipefail
          npx wrangler@latest deploy --config wrangler.jsonc

      - name: Configure Gemini and optional ingestion secrets
        run: |
          set -euo pipefail
          printf '%s' "$GEMINI_API_KEY" | npx wrangler@latest secret put GEMINI_API_KEY --config wrangler.jsonc
          if [ -n "${FXGA_INGEST_TOKEN:-}" ]; then
            printf '%s' "$FXGA_INGEST_TOKEN" | npx wrangler@latest secret put FXGA_INGEST_TOKEN --config wrangler.jsonc
          fi
          if [ -n "${FXGA_MT5_REPORT_SECRET:-}" ]; then
            printf '%s' "$FXGA_MT5_REPORT_SECRET" | npx wrangler@latest secret put FXGA_MT5_REPORT_SECRET --config wrangler.jsonc
          fi

      - name: Verify R0 runtime, website contracts, WebSocket and preserved AI
        run: |
          set -euo pipefail
          node <<'NODE'
          const site=process.env.CLOUDFLARE_SITE_URL;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function getJson(path){
            const r=await fetch(site+path,{headers:{Accept:'application/json','Cache-Control':'no-cache'},cache:'no-store'});
            const body=await r.json().catch(()=>({}));
            if(!r.ok)throw new Error(`${path} HTTP ${r.status}: ${JSON.stringify(body)}`);
            return body;
          }
          async function verifyWebSocket(){
            const wsUrl=site.replace(/^http:/,'ws:').replace(/^https:/,'wss:')+'/api/live';
            return await new Promise((resolve,reject)=>{
              let settled=false;
              const ws=new WebSocket(wsUrl);
              const finish=(error)=>{
                if(settled)return;
                settled=true;
                clearTimeout(timer);
                try{ws.close();}catch{}
                error?reject(error):resolve();
              };
              const timer=setTimeout(()=>finish(new Error('Live WebSocket did not deliver a data-update within 10 seconds')),10000);
              ws.addEventListener('message',(event)=>{
                try{
                  const message=JSON.parse(String(event.data));
                  if(message.type==='data-update'&&message.sourceId==='cloudflare-r0')finish();
                }catch{}
              });
              ws.addEventListener('error',()=>finish(new Error('Live WebSocket connection failed')));
            });
          }
          let last;
          for(let i=1;i<=20;i++){
            try{
              const health=await getJson('/api/health');
              if(health.architecture!=='cloudflare-r0')throw new Error('R0 architecture health contract mismatch');
              if(health.googleCloudRuntime!==false)throw new Error('Google Cloud runtime is still enabled');
              if(health.database!=='Cloudflare D1 Free')throw new Error('D1 runtime is not active');

              const dashboard=await getJson('/api/dashboard');
              if(!Array.isArray(dashboard.macro)||!Array.isArray(dashboard.market)||!Array.isArray(dashboard.calendar)||!Array.isArray(dashboard.sources)||!Array.isArray(dashboard.errors))throw new Error('Dashboard compatibility contract is invalid');
              if(dashboard._r0?.architecture!=='cloudflare-r0'||dashboard._r0?.googleCloudRuntime!==false)throw new Error('Dashboard is not reporting the R0 runtime');

              const analysis=await getJson('/api/analysis');
              if(!Array.isArray(analysis.dimensions)||!analysis.regime||!analysis.policy||!analysis.coverage)throw new Error('Macro analysis compatibility contract is invalid');

              const sessions=await getJson('/api/session-signals');
              if(!Array.isArray(sessions.sessions)||sessions.sessions.length<5)throw new Error('Session signal compatibility contract is invalid');

              const fred=await getJson('/api/fred/catalog');
              if(!Array.isArray(fred.categories)||!Array.isArray(fred.series))throw new Error('FRED compatibility contract is invalid');

              const technical=await getJson('/api/technical');
              if(!technical.counts||!technical.assets||typeof technical.assets!=='object')throw new Error('Technical compatibility contract is invalid');

              const quality=await getJson('/api/data-quality');
              if(!quality.macro?.coverage||!quality.market||!quality.technical||!quality.calendar)throw new Error('Data-quality compatibility contract is invalid');

              const ai=await getJson('/api/gemini/health');
              if(!ai.configured)throw new Error('Gemini AI secret is not active');
              const prompts=await getJson('/api/gemini/prompts');
              if(!Array.isArray(prompts.prompts)||prompts.prompts.length<6)throw new Error('FXGA AI prompt registry is incomplete');

              const root=await fetch(site+'/?r0='+Date.now(),{cache:'no-store'});
              if(!root.ok)throw new Error(`Website HTTP ${root.status}`);
              const html=await root.text();
              if(!html.includes('<div id="root"'))throw new Error('Website root HTML is missing the React mount point');

              await verifyWebSocket();

              console.log('VERIFIED: website + dashboard + live WebSocket + sessions + FRED + technical + data quality + Gemini are live on Cloudflare R0; macro=',dashboard.macro.length,'market=',dashboard.market.length,'sources=',dashboard.sources.length,'promptCount=',prompts.prompts.length);
              process.exit(0);
            }catch(error){last=error;console.log(`Verification ${i}/20:`,String(error?.message||error));await sleep(3000);}
          }
          throw last||new Error('R0 runtime did not become ready');
          NODE