name: Deploy FXGA R0 Cloudflare Runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'worker/**'
      - 'scripts/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare-static.yml'

concurrency:
  group: fxga-r0-cloudflare-runtime
  cancel-in-progress: true

permissions:
  contents: read

env:
  CLOUDFLARE_SITE_URL: https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev
  D1_DATABASE_NAME: fxga-free-db

jobs:
  deploy-r0-runtime:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FXGA_INGEST_TOKEN: ${{ secrets.FXGA_INGEST_TOKEN }}
      FXGA_MT5_REPORT_SECRET: ${{ secrets.FXGA_MT5_REPORT_SECRET }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'

      - name: Resolve and validate R0 deployment credentials
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN must be added under repository Actions secrets'; exit 1; }
          test -n "$GEMINI_API_KEY" || { echo '::error::GEMINI_API_KEY must be added under repository Actions secrets to preserve Ask FXGA AI'; exit 1; }

          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'CLOUDFLARE_ACCOUNT_ID was not injected by GitHub; resolving it from the existing Cloudflare API token.'
            npx wrangler@latest whoami --json > "$RUNNER_TEMP/cloudflare-whoami.json"
            RESOLVED_ACCOUNT_ID=$(node - <<'NODE'
          const fs = require('fs');
          const info = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/cloudflare-whoami.json', 'utf8'));
          if (info?.loggedIn === false) throw new Error('Cloudflare API token did not authenticate');
          const accounts = Array.isArray(info?.accounts) ? info.accounts : [];
          const id = accounts[0]?.id;
          if (!id) throw new Error('Wrangler authenticated but did not return an accessible Cloudflare account');
          process.stdout.write(id);
          NODE
            )
            echo "::add-mask::$RESOLVED_ACCOUNT_ID"
            echo "CLOUDFLARE_ACCOUNT_ID=$RESOLVED_ACCOUNT_ID" >> "$GITHUB_ENV"
          fi

      - name: Install and build frontend
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          node --check worker/src/index.js
          node --check worker/src/r0-entry.js
          node --check worker/src/auth-gateway.js
          node --check worker/src/security.js
          node --check scripts/r0-collect-market.mjs
          node --check scripts/r0-collect-macro.mjs
          npm run build
          test -f dist/index.html
          grep -R -F "Ask FXGA AI" dist >/dev/null || { echo '::error::Compiled frontend is missing Ask FXGA AI'; exit 1; }
          grep -F "stable-fingerprint-v2" worker/src/auth-gateway.js >/dev/null || { echo '::error::Stable Open Program handoff gateway is missing'; exit 1; }
          if find dist -type f -name '*.map' | grep -q .; then
            echo '::error::Production source maps must not be deployed'; exit 1
          fi

      - name: Provision or attach free D1 database
        run: |
          set -euo pipefail
          npx wrangler@latest d1 list --json > "$RUNNER_TEMP/d1-list.json"
          D1_ID=$(node - <<'NODE'
          const fs=require('fs');
          const rows=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/d1-list.json','utf8'));
          const row=(Array.isArray(rows)?rows:[]).find(x=>x.name===process.env.D1_DATABASE_NAME);
          process.stdout.write(row?.uuid || row?.id || '');
          NODE
          )

          if [ -z "$D1_ID" ]; then
            npx wrangler@latest d1 create "$D1_DATABASE_NAME" --binding DB --update-config --config wrangler.jsonc
          else
            D1_ID="$D1_ID" node <<'NODE'
          const fs=require('fs');
          const path='wrangler.jsonc';
          const config=JSON.parse(fs.readFileSync(path,'utf8'));
          config.d1_databases=[{binding:'DB',database_name:process.env.D1_DATABASE_NAME,database_id:process.env.D1_ID}];
          fs.writeFileSync(path,JSON.stringify(config,null,2)+'\n');
          NODE
          fi

          node <<'NODE'
          const fs=require('fs');
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          const db=config.d1_databases?.find(x=>x.binding==='DB');
          if(!db?.database_id)throw new Error('R0 D1 binding was not created');
          if(config.main!=='./worker/src/auth-gateway.js')throw new Error('Member auth gateway Worker main entry is missing');
          if(!config.assets?.run_worker_first?.includes('/*'))throw new Error('All application routes must execute the auth gateway first');
          if(config.vars?.AUTH_ENFORCED!=='auto')throw new Error('Member auth must use safe auto activation');
          console.log('R0 config ready with D1 + member gateway',db.database_name);
          NODE

      - name: Apply D1 schema
        run: |
          set -euo pipefail
          npx wrangler@latest d1 execute "$D1_DATABASE_NAME" --remote --file=worker/schema.sql --config wrangler.jsonc

      - name: Deploy Worker and static assets
        run: |
          set -euo pipefail
          npx wrangler@latest deploy --config wrangler.jsonc

      - name: Configure Gemini and optional ingestion secrets
        run: |
          set -euo pipefail
          printf '%s' "$GEMINI_API_KEY" | npx wrangler@latest secret put GEMINI_API_KEY --config wrangler.jsonc
          if [ -n "${FXGA_INGEST_TOKEN:-}" ]; then printf '%s' "$FXGA_INGEST_TOKEN" | npx wrangler@latest secret put FXGA_INGEST_TOKEN --config wrangler.jsonc; fi
          if [ -n "${FXGA_MT5_REPORT_SECRET:-}" ]; then printf '%s' "$FXGA_MT5_REPORT_SECRET" | npx wrangler@latest secret put FXGA_MT5_REPORT_SECRET --config wrangler.jsonc; fi

      - name: Verify R0 runtime, Open Program handoff and edge security
        run: |
          set -euo pipefail
          node <<'NODE'
          const site=process.env.CLOUDFLARE_SITE_URL;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function request(path, options={}) {
            return fetch(site+path,{cache:'no-store',redirect:'manual',...options,headers:{Accept:'application/json','Cache-Control':'no-cache',...(options.headers||{})}});
          }
          async function getJson(path){
            const r=await request(path);
            const body=await r.json().catch(()=>({}));
            if(!r.ok)throw new Error(`${path} HTTP ${r.status}: ${JSON.stringify(body)}`);
            return {body,response:r};
          }
          let last;
          for(let i=1;i<=20;i++){
            try{
              const healthResult=await getJson('/api/health');
              const health=healthResult.body;
              if(health.architecture!=='cloudflare-r0'||health.googleCloudRuntime!==false||health.database!=='Cloudflare D1 Free')throw new Error('R0 health contract mismatch');

              const authResult=await getJson('/api/auth/status');
              const auth=authResult.body;
              if(auth.accessModel!=='owner-approved-google-email-allowlist')throw new Error('Member authorization model mismatch');
              if(auth.enforced!==true)throw new Error('Member authentication must remain fail-closed/enforced');
              if(!String(auth.loginUrl||'').includes('/member'))throw new Error('Member login URL is missing');
              if(auth.handoffVersion!=='stable-fingerprint-v2')throw new Error('Stable Open Program handoff is not live');
              if(auth.serviceReachable!==true)throw new Error('Landing authorization service is not reachable from dashboard Worker');

              for(const [header,expected] of [['strict-transport-security','max-age=63072000'],['x-frame-options','DENY'],['x-content-type-options','nosniff']]){
                const value=String(authResult.response.headers.get(header)||'');
                if(!value.toLowerCase().includes(expected.toLowerCase()))throw new Error(`security header missing ${header}`);
              }
              if(!String(authResult.response.headers.get('content-security-policy')||'').includes("frame-ancestors 'none'"))throw new Error('CSP frame protection missing');

              const aiResult=await getJson('/api/gemini/health');
              if(!aiResult.body.configured)throw new Error('Gemini AI secret is not active');

              const dashboard=await request('/api/dashboard');
              if(dashboard.status!==401)throw new Error(`Protected dashboard must return 401 without a member session, got ${dashboard.status}`);

              const root=await request('/?authcheck='+Date.now(),{headers:{Accept:'text/html'}});
              if(root.status!==302||!String(root.headers.get('location')||'').includes('/member'))throw new Error('Protected application root must redirect to member login');

              // Length-valid fake token forces the dashboard Worker to actually call
              // the landing Worker's introspection endpoint. `transfer-denied` proves
              // the cross-account server-to-server route is reachable; an outage or
              // blocked subrequest would return `auth-service-unavailable` instead.
              const fakeTransfer='x'.repeat(48);
              const badExchange=await request('/api/auth/exchange?token='+fakeTransfer);
              const badLocation=String(badExchange.headers.get('location')||'');
              if(badExchange.status!==302)throw new Error('Invalid auth exchange must redirect to login');
              if(!badLocation.includes('reason=transfer-denied'))throw new Error(`Cross-account auth handoff probe failed: ${badLocation||'missing-location'}`);

              const csrfPost=await request('/api/gemini/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:'security-test'})});
              if(csrfPost.status!==403)throw new Error(`Missing-origin protected write must return 403, got ${csrfPost.status}`);

              const sourceMap=await request('/assets/security-test.map');
              if(sourceMap.status!==404)throw new Error(`Source-map access must return 404, got ${sourceMap.status}`);

              console.log('VERIFIED: R0 runtime and stable Open Program cross-account handoff are live; authentication remains fail-closed and edge security invariants are active.');
              process.exit(0);
            }catch(error){last=error;console.log(`Verification ${i}/20:`,String(error?.message||error));await sleep(3000)}
          }
          throw last||new Error('R0 runtime did not become ready');
          NODE

          TRACE_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -X TRACE "$CLOUDFLARE_SITE_URL/api/health" || true)
          test "$TRACE_STATUS" = "405" || { echo "::error::TRACE must be rejected with 405, got $TRACE_STATUS"; exit 1; }
