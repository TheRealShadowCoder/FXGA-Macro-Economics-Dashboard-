name: Diagnose V4.16 Live Intelligence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-diagnose-v416-live.trigger'

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Capture latest v4.16 live verifier run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess,datetime
          repo=os.environ['GH_REPO']
          runs=json.loads(subprocess.check_output(['gh','run','list','--repo',repo,'--workflow','verify-v416-intelligence-live.yml','--limit','3','--json','databaseId,status,conclusion,createdAt,updatedAt,headSha,url,workflowName'],text=True))
          out={'generatedAt':datetime.datetime.now(datetime.timezone.utc).isoformat(),'runs':runs}
          if runs:
              rid=str(runs[0]['databaseId'])
              out['latestJobs']=json.loads(subprocess.check_output(['gh','run','view',rid,'--repo',repo,'--json','jobs'],text=True)).get('jobs',[])
          open('.github/v416-live-diagnostic.json','w').write(json.dumps(out,indent=2)+'\n')
          PY
      - name: Persist diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/v416-live-diagnostic.json
          git commit -m 'Record v4.16 live intelligence diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main
