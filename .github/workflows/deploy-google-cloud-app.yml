name: Deploy FXGA Google Cloud Application

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'google-cloud-app/**'
      - '.github/workflows/deploy-google-cloud-app.yml'

concurrency:
  group: fxga-google-cloud-application
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  SERVICE: fxga-macro-dashboard
  GAR_REPOSITORY: fxga-containers
  GCP_PROJECT_ID: fxglobalavengerstradingacademy
  GCP_REGION: us-central1
  DEPLOY_SERVICE_ACCOUNT: fxga-github-deployer@fxglobalavengerstradingacademy.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: fxga-collector-runtime@fxglobalavengerstradingacademy.iam.gserviceaccount.com
  GEMINI_SECRET_NAME: gemini-api-key
  GEMINI_MODEL: gemini-3.7-flash
  GEMINI_FALLBACK_MODEL: gemini-3.5-flash-lite

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate Google Cloud API application
        working-directory: google-cloud-app
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check server.js
          node --check tradingview-signals.js
          node --check firestore-usage-monitor.js
          node --check optimize-server.js
          node --check gemini-hook.js
          node -e "const p=require('./package.json'); if(!p.dependencies['@google-cloud/firestore']||!p.dependencies['@google-cloud/monitoring']||!p.dependencies.ws) process.exit(1)"
          ! grep -REn "AQ\.[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{20,}" . --exclude='package-lock.json' || { echo '::error::Possible Gemini/Google credential committed to google-cloud-app'; exit 1; }
          echo 'API validation complete. Frontend compilation belongs to the Cloudflare workflow.'

      - id: config
        name: Resolve Google authentication
        env:
          WIF_PROVIDER_SECRET: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_PROVIDER_VAR: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          WIF_PROVIDER="${WIF_PROVIDER_SECRET:-$WIF_PROVIDER_VAR}"
          test -n "$WIF_PROVIDER" || { echo '::error::GCP_WIF_PROVIDER is missing'; exit 1; }
          echo "wif_provider=$WIF_PROVIDER" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Best-effort Cloud Monitoring read access
        run: |
          set +e
          echo "Attempting roles/monitoring.viewer for $RUNTIME_SERVICE_ACCOUNT"
          gcloud projects add-iam-policy-binding "$GCP_PROJECT_ID" \
            --member="serviceAccount:$RUNTIME_SERVICE_ACCOUNT" \
            --role="roles/monitoring.viewer" \
            --condition=None \
            --quiet
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            echo 'Cloud Monitoring viewer access is configured.'
          else
            echo '::warning::Deploy identity cannot grant roles/monitoring.viewer. The application will use the safe Firestore-ledger fallback and will not expose IAM errors to users.'
          fi
          exit 0

      - name: Verify existing Google deployment resources
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID"
          echo 'Existing Cloud Run services:'
          gcloud run services list --region "$GCP_REGION" --platform managed --format='table(metadata.name,status.url)' || true
          echo 'Artifact Registry repository:'
          if ! gcloud artifacts repositories describe "$GAR_REPOSITORY" --location "$GCP_REGION" --format='value(name)' ; then
            echo "::error::Artifact Registry repository $GAR_REPOSITORY is missing. The existing MT5 deployment is expected to use this repository too."
            exit 1
          fi
          echo 'Using existing Cloud Run / Artifact Registry / Firestore project resources.'

      - id: gemini
        name: Detect Gemini Secret Manager configuration
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID"
          if gcloud secrets describe "$GEMINI_SECRET_NAME" --format='value(name)' >/dev/null 2>&1; then
            echo 'Gemini Secret Manager entry found.'
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'GEMINI_CONFIGURED=true' >> "$GITHUB_ENV"
            set +e
            gcloud secrets add-iam-policy-binding "$GEMINI_SECRET_NAME" \
              --member="serviceAccount:$RUNTIME_SERVICE_ACCOUNT" \
              --role="roles/secretmanager.secretAccessor" \
              --quiet
            ACCESS_STATUS=$?
            set -e
            if [ "$ACCESS_STATUS" -ne 0 ]; then
              echo '::warning::Could not grant Gemini secretAccessor automatically. Ensure the runtime service account can access gemini-api-key.'
            fi
          else
            echo '::warning::Gemini secret gemini-api-key is not present yet. Deploying the gateway disabled; add the secret and redeploy to activate it.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo 'GEMINI_CONFIGURED=false' >> "$GITHUB_ENV"
          fi

      - name: Build and push API-only dashboard container
        run: |
          set -euo pipefail
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY/$SERVICE:${GITHUB_SHA}"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build --pull -f google-cloud-app/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - id: deploy
        name: Create or update public Google Cloud API application
        run: |
          set -euo pipefail
          GEMINI_ARGS=()
          if [ "${GEMINI_CONFIGURED:-false}" = 'true' ]; then
            GEMINI_ARGS+=(--set-secrets "GEMINI_API_KEY=$GEMINI_SECRET_NAME:latest")
          fi
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 80 \
            --min 0 \
            --max 3 \
            --timeout 3600 \
            --set-env-vars "GCP_PROJECT_ID=$GCP_PROJECT_ID,FXGA_ARCHITECTURE=google-cloud-processing-cloudflare-static-hosting,FXGA_PUBLIC_ORIGIN=https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev,GEMINI_MODEL=$GEMINI_MODEL,GEMINI_FALLBACK_MODEL=$GEMINI_FALLBACK_MODEL,GEMINI_REQUESTS_PER_HOUR=24" \
            "${GEMINI_ARGS[@]}"
          APP_URL=$(gcloud run services describe "$SERVICE" --region "$GCP_REGION" --platform managed --format='value(status.url)')
          test -n "$APP_URL" || { echo '::error::Google Cloud application URL missing after deployment'; exit 1; }
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "url=$APP_URL" >> "$GITHUB_OUTPUT"
          echo "Created/updated $SERVICE at $APP_URL"

      - name: Verify macro and Gemini API contracts
        run: |
          node <<'NODE'
          const base=process.env.APP_URL;
          const expectGemini=process.env.GEMINI_CONFIGURED==='true';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last;
          for(let attempt=0;attempt<40;attempt++){
            try{
              const healthResponse=await fetch(base+'/api/health',{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
              const healthText=await healthResponse.text();
              if(!healthResponse.ok)throw new Error(`/api/health ${healthResponse.status}: ${healthText.slice(0,500)}`);
              const health=JSON.parse(healthText);
              if(health.compute!=='Google Cloud Run'||health.state!=='Google Cloud Firestore')throw new Error('Macro API health contract not active');
              const dashboardResponse=await fetch(base+'/api/dashboard',{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
              const dashboardText=await dashboardResponse.text();
              if(!dashboardResponse.ok)throw new Error(`/api/dashboard ${dashboardResponse.status}: ${dashboardText.slice(0,500)}`);
              const dashboard=JSON.parse(dashboardText);
              if(!Array.isArray(dashboard.market)||!Array.isArray(dashboard.sources))throw new Error('Dashboard payload contract missing market/sources');
              const usageResponse=await fetch(base+'/api/tradingview/firestore-usage',{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
              if(!usageResponse.ok)throw new Error(`Firestore capacity endpoint ${usageResponse.status}`);
              const usage=await usageResponse.json();
              if(String(usage.monitoringError||'').match(/PERMISSION_DENIED|Permission denied/i))throw new Error('Raw Cloud Monitoring IAM error leaked through public telemetry contract');
              if(!['cloud-monitoring','firestore-ledger-fallback'].includes(String(usage.monitoringMode||'')))throw new Error(`Unexpected Firestore monitoring mode ${usage.monitoringMode}`);
              const geminiResponse=await fetch(base+'/api/gemini/health',{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
              const geminiText=await geminiResponse.text();
              if(!geminiResponse.ok)throw new Error(`/api/gemini/health ${geminiResponse.status}: ${geminiText.slice(0,500)}`);
              const gemini=JSON.parse(geminiText);
              if(gemini.keyExposedToBrowser!==false)throw new Error('Gemini health contract must explicitly keep the key server-side');
              if(expectGemini&&!gemini.configured)throw new Error('Gemini secret exists but deployed gateway reports configured=false');
              console.log('Google Cloud macro API live:',base,'assets=',dashboard.market.length,'monitoringMode=',usage.monitoringMode,'geminiConfigured=',gemini.configured,'geminiModel=',gemini.model);
              process.exit(0);
            }catch(error){last=error;await sleep(3000);}
          }
          throw last||new Error('Google Cloud macro API did not become ready');
          NODE

      - name: Production summary
        run: |
          echo "Website host: Cloudflare Static Assets"
          echo "Application API: $APP_URL"
          echo "Cloud Run service: $SERVICE"
          echo "TradingView webhook: $APP_URL/api/tradingview/webhook"
          echo "Firestore capacity API: $APP_URL/api/tradingview/firestore-usage"
          echo "Gemini health: $APP_URL/api/gemini/health"
          echo "Gemini analysis: $APP_URL/api/gemini/analyze"
          echo "Gemini configured: ${GEMINI_CONFIGURED:-false}"
          echo "Frontend bundled into API container: NO"
          echo "Cloudflare application processing: NONE"
