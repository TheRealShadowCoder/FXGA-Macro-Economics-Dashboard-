name: Deploy FXGA Google Cloud Application

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'google-cloud-app/**'
      - '.github/workflows/deploy-google-cloud-app.yml'

concurrency:
  group: fxga-google-cloud-application
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  SERVICE: fxga-macro-dashboard
  GAR_REPOSITORY: fxga-containers
  GCP_PROJECT_ID: fxglobalavengerstradingacademy
  GCP_REGION: us-central1
  DEPLOY_SERVICE_ACCOUNT: fxga-github-deployer@fxglobalavengerstradingacademy.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: fxga-collector-runtime@fxglobalavengerstradingacademy.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate frontend and Google Cloud application
        run: |
          npm install --no-audit --no-fund
          npm run build
          node --check google-cloud-app/server.js
          node --check google-cloud-app/tradingview-signals.js
          node -e "const p=require('./google-cloud-app/package.json'); if(!p.dependencies['@google-cloud/firestore']||!p.dependencies.ws) process.exit(1)"

      - id: config
        name: Resolve Google Cloud authentication
        env:
          WIF_PROVIDER_SECRET: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_PROVIDER_VAR: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          WIF_PROVIDER="${WIF_PROVIDER_SECRET:-$WIF_PROVIDER_VAR}"
          test -n "$WIF_PROVIDER" || { echo '::error::GCP_WIF_PROVIDER is missing'; exit 1; }
          echo "wif_provider=$WIF_PROVIDER" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Google Cloud
        run: |
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud services enable run.googleapis.com artifactregistry.googleapis.com firestore.googleapis.com
          gcloud artifacts repositories describe "$GAR_REPOSITORY" --location "$GCP_REGION" >/dev/null 2>&1 || \
            gcloud artifacts repositories create "$GAR_REPOSITORY" --repository-format=docker --location "$GCP_REGION"

      - name: Build and push dashboard API container
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY/$SERVICE:${GITHUB_SHA}"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build -f google-cloud-app/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - id: deploy
        name: Deploy public Google Cloud API application
        run: |
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 80 \
            --min 0 \
            --max 3 \
            --timeout 3600 \
            --set-env-vars "GCP_PROJECT_ID=$GCP_PROJECT_ID,FXGA_ARCHITECTURE=google-cloud-processing-cloudflare-static-hosting"
          APP_URL=$(gcloud run services describe "$SERVICE" --region "$GCP_REGION" --format='value(status.url)')
          test -n "$APP_URL" || { echo '::error::Google Cloud application URL missing'; exit 1; }
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "url=$APP_URL" >> "$GITHUB_OUTPUT"

      - name: Verify Google processing, TradingView signal service and passive Cloudflare hosting contract
        run: |
          node <<'NODE'
          const base=process.env.APP_URL;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last;
          for(let attempt=0;attempt<20;attempt++){
            try{
              const healthResponse=await fetch(base+'/api/health',{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
              const text=await healthResponse.text();
              if(!healthResponse.ok)throw new Error(`/api/health ${healthResponse.status}: ${text.slice(0,500)}`);
              const health=JSON.parse(text);
              if(health.architecture!=='google-cloud-processing-cloudflare-static-hosting'||health.compute!=='Google Cloud Run'||health.state!=='Google Cloud Firestore'||health.websiteHost!=='Cloudflare Static Assets'||health.cloudflareRole!=='static-host-only'||health.cloudflareProcessing!==false||Number(health.cloudflareUpstreamRequests)!==0)throw new Error('Google processing / passive Cloudflare hosting health contract not active');
              if(health.tradingViewSignals?.schema!=='fxga.smc.signal.v3'||health.tradingViewSignals?.engine!=='FXGA_SMC2000'||health.tradingViewSignals?.officialIpAllowlist!==true||health.tradingViewSignals?.cloudflareProcessing!==false)throw new Error('TradingView signal health contract not active');
              for(const endpoint of ['/api/market-prices','/api/data-quality','/api/tradingview/config','/api/tradingview/signals/live?limit=5','/api/tradingview/signals/metrics']){
                const r=await fetch(base+endpoint,{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
                if(!r.ok)throw new Error(`${endpoint} ${r.status}: ${(await r.text()).slice(0,400)}`);
              }
              const unauthorized=await fetch(base+'/api/tradingview/webhook',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
              if(unauthorized.status!==403)throw new Error(`Unauthorized TradingView webhook was not rejected; got ${unauthorized.status}`);
              console.log('Google processing + TradingView signal contract verified:',base);
              process.exit(0);
            }catch(error){last=error;await sleep(3000);}
          }
          throw last||new Error('Google Cloud application did not become ready');
          NODE

      - name: Production summary
        run: |
          echo "Website host: Cloudflare Static Assets"
          echo "Application API: $APP_URL"
          echo "TradingView webhook: $APP_URL/api/tradingview/webhook"
          echo "TradingView live feed: $APP_URL/api/tradingview/signals/live"
          echo "Processing: Google Cloud Run"
          echo "Persistent state: Google Cloud Firestore"
          echo "Cloudflare upstream acquisition/API processing: NONE"
