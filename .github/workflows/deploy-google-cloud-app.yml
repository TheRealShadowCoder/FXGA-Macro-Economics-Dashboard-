name: Deploy FXGA Google Cloud Application

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'google-cloud-app/**'
      - '.github/workflows/deploy-google-cloud-app.yml'

concurrency:
  group: fxga-google-cloud-application
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  SERVICE: fxga-macro-dashboard
  GAR_REPOSITORY: fxga-containers
  GCP_PROJECT_ID: fxglobalavengerstradingacademy
  GCP_REGION: us-central1
  DEPLOY_SERVICE_ACCOUNT: fxga-github-deployer@fxglobalavengerstradingacademy.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: fxga-collector-runtime@fxglobalavengerstradingacademy.iam.gserviceaccount.com
  GEMINI_SECRET_NAME: gemini-api-key
  GEMINI_MODEL: gemini-3.5-flash-lite
  GEMINI_FALLBACK_MODEL: gemini-3.1-flash-lite
  GEMINI_RESERVE_MODEL: gemini-3.7-flash

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate Google Cloud API application
        working-directory: google-cloud-app
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check server.js
          node --check tradingview-signals.js
          node --check firestore-usage-monitor.js
          node --check optimize-server.js
          node --check gemini-bootstrap.js
          node --check startup.js
          node --check gemini-hook.js
          node --check fxga-intelligence-extension.js
          node -e "const p=require('./package.json'); if(!p.dependencies['@google-cloud/firestore']||!p.dependencies['@google-cloud/monitoring']||!p.dependencies.ws) process.exit(1)"
          ! grep -REn "AQ\.[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{20,}" . --exclude='package-lock.json' || { echo '::error::Possible Gemini/Google credential committed to google-cloud-app'; exit 1; }
          ! grep -REn "GEMINI_REQUESTS_PER_HOUR|MAX_REQUESTS_PER_HOUR" . --exclude='package-lock.json' || { echo '::error::Artificial Gemini hourly cap detected in Google Cloud application'; exit 1; }
          grep -q "instant-model-failover-plus-per-model-cooldown" fxga-intelligence-extension.js || { echo '::error::Gemini 429 resilience policy missing'; exit 1; }
          grep -q "if (!raw) return null" fxga-intelligence-extension.js || { echo '::error::Missing Retry-After must not be reported as zero seconds'; exit 1; }
          echo 'API validation complete. Gemini quota is provider-managed with adaptive model failover; frontend compilation belongs to the Cloudflare workflow.'

      - id: config
        name: Resolve Google authentication
        env:
          WIF_PROVIDER_SECRET: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_PROVIDER_VAR: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          WIF_PROVIDER="${WIF_PROVIDER_SECRET:-$WIF_PROVIDER_VAR}"
          test -n "$WIF_PROVIDER" || { echo '::error::GCP_WIF_PROVIDER is missing'; exit 1; }
          echo "wif_provider=$WIF_PROVIDER" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Best-effort Cloud Monitoring read access
        run: |
          set +e
          echo "Attempting roles/monitoring.viewer for $RUNTIME_SERVICE_ACCOUNT"
          gcloud projects add-iam-policy-binding "$GCP_PROJECT_ID" \
            --member="serviceAccount:$RUNTIME_SERVICE_ACCOUNT" \
            --role="roles/monitoring.viewer" \
            --condition=None \
            --quiet
          STATUS=$?
          if [ "$STATUS" -eq 0 ]; then
            echo 'Cloud Monitoring viewer access is configured.'
          else
            echo '::warning::Deploy identity cannot grant roles/monitoring.viewer. The application will use the safe Firestore-ledger fallback and will not expose IAM errors to users.'
          fi
          exit 0

      - name: Verify existing Google deployment resources
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID"
          echo 'Existing Cloud Run services:'
          gcloud run services list --region "$GCP_REGION" --platform managed --format='table(metadata.name,status.url)' || true
          echo 'Artifact Registry repository:'
          if ! gcloud artifacts repositories describe "$GAR_REPOSITORY" --location "$GCP_REGION" --format='value(name)' ; then
            echo "::error::Artifact Registry repository $GAR_REPOSITORY is missing. The existing MT5 deployment is expected to use this repository too."
            exit 1
          fi
          echo 'Using existing Cloud Run / Artifact Registry / Firestore project resources.'

      - id: gemini
        name: Require Gemini credential and synchronize Secret Manager
        env:
          GEMINI_API_KEY_FROM_GITHUB: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID"

          SECRET_EXISTS=false
          if gcloud secrets describe "$GEMINI_SECRET_NAME" --format='value(name)' >/dev/null 2>&1; then
            SECRET_EXISTS=true
          fi

          if [ -n "${GEMINI_API_KEY_FROM_GITHUB:-}" ]; then
            if [ "$SECRET_EXISTS" = 'true' ]; then
              echo 'Gemini Secret Manager entry exists; synchronizing the protected GitHub Actions GEMINI_API_KEY as a new latest version.'
              printf '%s' "$GEMINI_API_KEY_FROM_GITHUB" | gcloud secrets versions add "$GEMINI_SECRET_NAME" \
                --data-file=- \
                --quiet
              echo 'Gemini Secret Manager latest version synchronized without exposing the credential.'
            else
              echo 'Gemini Secret Manager entry is missing; creating it from the protected GitHub Actions GEMINI_API_KEY secret.'
              printf '%s' "$GEMINI_API_KEY_FROM_GITHUB" | gcloud secrets create "$GEMINI_SECRET_NAME" \
                --replication-policy=automatic \
                --data-file=- \
                --quiet
              echo 'Gemini Secret Manager entry created without exposing the credential.'
            fi
          elif [ "$SECRET_EXISTS" = 'true' ]; then
            echo 'GitHub Actions GEMINI_API_KEY is not set; retaining the existing Google Secret Manager credential.'
          else
            echo '::error::Gemini is required but no credential is configured. Add repository Actions secret GEMINI_API_KEY, or create Secret Manager secret gemini-api-key in project fxglobalavengerstradingacademy, then rerun this workflow.'
            exit 1
          fi

          set +e
          gcloud secrets add-iam-policy-binding "$GEMINI_SECRET_NAME" \
            --member="serviceAccount:$RUNTIME_SERVICE_ACCOUNT" \
            --role="roles/secretmanager.secretAccessor" \
            --quiet
          ACCESS_STATUS=$?
          set -e
          if [ "$ACCESS_STATUS" -ne 0 ]; then
            echo '::warning::Could not grant secretAccessor automatically. Deployment will still verify the live Gemini health contract; if the runtime identity lacks access the workflow will fail rather than silently ship disabled AI.'
          fi

          echo 'configured=true' >> "$GITHUB_OUTPUT"
          echo 'GEMINI_CONFIGURED=true' >> "$GITHUB_ENV"

      - name: Verify Gemini credential against current Interactions API
        run: |
          set -euo pipefail
          GEMINI_KEY="$(gcloud secrets versions access latest --secret="$GEMINI_SECRET_NAME")"
          test -n "$GEMINI_KEY" || { echo '::error::Latest Gemini secret version is empty'; exit 1; }

          SUCCESS=false
          LAST_ERROR=''
          for MODEL in "$GEMINI_MODEL" "$GEMINI_FALLBACK_MODEL"; do
            payload="$(jq -nc --arg model "$MODEL" '{model:$model,input:"Reply with exactly: FXGA_GEMINI_OK",store:false,generation_config:{max_output_tokens:32}}')"
            HTTP_STATUS="$(curl -sS --connect-timeout 15 --max-time 60 \
              -o /tmp/gemini-provider.json \
              -w '%{http_code}' \
              -X POST 'https://generativelanguage.googleapis.com/v1/interactions' \
              -H "x-goog-api-key: $GEMINI_KEY" \
              -H 'Content-Type: application/json' \
              --data "$payload" || true)"

            if [[ "$HTTP_STATUS" =~ ^2[0-9][0-9]$ ]]; then
              ANSWER="$(jq -r '[.steps[]? | select(.type=="model_output") | .content[]? | select(.type=="text") | .text] | join("")' /tmp/gemini-provider.json)"
              if [ -n "$ANSWER" ]; then
                echo "Gemini provider live response via $MODEL: $ANSWER"
                SUCCESS=true
                break
              fi
              LAST_ERROR="HTTP ${HTTP_STATUS} from ${MODEL}, but no model_output text was returned"
              continue
            fi

            PROVIDER_MESSAGE="$(jq -r 'try (.error.message // .message // .error.status // empty) catch empty' /tmp/gemini-provider.json 2>/dev/null || true)"
            LAST_ERROR="${MODEL} returned HTTP ${HTTP_STATUS}${PROVIDER_MESSAGE:+: $PROVIDER_MESSAGE}"
            echo "::warning::$LAST_ERROR"
          done

          if [ "$SUCCESS" != 'true' ]; then
            echo "::error::Gemini credential/provider smoke test failed. $LAST_ERROR"
            echo '::error::Use a current Gemini Auth key from Google AI Studio. Unrestricted Standard keys are rejected now and Standard keys stop working in September 2026.'
            exit 1
          fi

      - name: Build and push API-only dashboard container
        run: |
          set -euo pipefail
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY/$SERVICE:${GITHUB_SHA}"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build --pull -f google-cloud-app/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - id: deploy
        name: Create or update public Google Cloud API application
        run: |
          set -euo pipefail
          test "${GEMINI_CONFIGURED:-false}" = 'true' || { echo '::error::Gemini deployment credential was not prepared'; exit 1; }
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 80 \
            --min 0 \
            --max 3 \
            --timeout 3600 \
            --set-env-vars "GCP_PROJECT_ID=$GCP_PROJECT_ID,FXGA_ARCHITECTURE=google-cloud-processing-cloudflare-static-hosting,FXGA_PUBLIC_ORIGIN=https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev,GEMINI_MODEL=$GEMINI_MODEL,GEMINI_FALLBACK_MODEL=$GEMINI_FALLBACK_MODEL,GEMINI_RESERVE_MODEL=$GEMINI_RESERVE_MODEL,GEMINI_SECRET_NAME=$GEMINI_SECRET_NAME" \
            --set-secrets "GEMINI_API_KEY=$GEMINI_SECRET_NAME:latest"
          APP_URL=$(gcloud run services describe "$SERVICE" --region "$GCP_REGION" --platform managed --format='value(status.url)')
          test -n "$APP_URL" || { echo '::error::Google Cloud application URL missing after deployment'; exit 1; }
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "url=$APP_URL" >> "$GITHUB_OUTPUT"
          echo "Created/updated $SERVICE at $APP_URL"

      - name: Verify macro and Gemini API contracts
        run: |
          node <<'NODE'
          const base=process.env.APP_URL;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last;
          for(let attempt=0;attempt<40;attempt++){
            try{
              const healthResponse=await fetch(base+'/api/health',{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
              const healthText=await healthResponse.text();
              if(!healthResponse.ok)throw new Error(`/api/health ${healthResponse.status}: ${healthText.slice(0,500)}`);
              const health=JSON.parse(healthText);
              if(health.compute!=='Google Cloud Run'||health.state!=='Google Cloud Firestore')throw new Error('Macro API health contract not active');
              const dashboardResponse=await fetch(base+'/api/dashboard',{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
              const dashboardText=await dashboardResponse.text();
              if(!dashboardResponse.ok)throw new Error(`/api/dashboard ${dashboardResponse.status}: ${dashboardText.slice(0,500)}`);
              const dashboard=JSON.parse(dashboardText);
              if(!Array.isArray(dashboard.market)||!Array.isArray(dashboard.sources))throw new Error('Dashboard payload contract missing market/sources');
              const usageResponse=await fetch(base+'/api/tradingview/firestore-usage',{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
              if(!usageResponse.ok)throw new Error(`Firestore capacity endpoint ${usageResponse.status}`);
              const usage=await usageResponse.json();
              if(String(usage.monitoringError||'').match(/PERMISSION_DENIED|Permission denied/i))throw new Error('Raw Cloud Monitoring IAM error leaked through public telemetry contract');
              if(!['cloud-monitoring','firestore-ledger-fallback'].includes(String(usage.monitoringMode||'')))throw new Error(`Unexpected Firestore monitoring mode ${usage.monitoringMode}`);
              const geminiResponse=await fetch(base+'/api/gemini/health',{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
              const geminiText=await geminiResponse.text();
              if(!geminiResponse.ok)throw new Error(`/api/gemini/health ${geminiResponse.status}: ${geminiText.slice(0,500)}`);
              const gemini=JSON.parse(geminiText);
              if(gemini.keyExposedToBrowser!==false)throw new Error('Gemini health contract must explicitly keep the key server-side');
              if(gemini.configured!==true)throw new Error('Gemini is mandatory for this deployment but the live gateway reports configured=false');
              if(gemini.quotaPolicy!=='provider-managed-no-artificial-hourly-or-daily-cap')throw new Error(`Unexpected Gemini quota policy ${gemini.quotaPolicy}`);
              if(gemini.applicationHourlyCap!==null||gemini.applicationDailyCap!==null)throw new Error('FXGA must not impose artificial Gemini hourly/daily caps');
              if(gemini.firestoreCaching!==true||gemini.duplicateRequestCoalescing!==true)throw new Error('Gemini quota-conservation controls are missing');
              const intelligenceResponse=await fetch(base+'/api/gemini/intelligence-health',{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
              if(!intelligenceResponse.ok)throw new Error(`Intelligence health ${intelligenceResponse.status}`);
              const intelligence=await intelligenceResponse.json();
              if(intelligence.rateLimitStrategy!=='instant-model-failover-plus-per-model-cooldown')throw new Error('Gemini adaptive 429 resilience policy is not active');
              if(!intelligence.reserveModel)throw new Error('Gemini reserve model is not configured');
              console.log('Google Cloud macro API + Gemini live:',base,'assets=',dashboard.market.length,'monitoringMode=',usage.monitoringMode,'geminiConfigured=',gemini.configured,'geminiModel=',gemini.model,'intelligencePrimary=',intelligence.model,'fallback=',intelligence.fallbackModel,'reserve=',intelligence.reserveModel,'geminiQuotaPolicy=',gemini.quotaPolicy);
              process.exit(0);
            }catch(error){last=error;await sleep(3000);}
          }
          throw last||new Error('Google Cloud macro API did not become ready');
          NODE

      - name: Production summary
        run: |
          echo "Website host: Cloudflare Static Assets"
          echo "Application API: $APP_URL"
          echo "Cloud Run service: $SERVICE"
          echo "TradingView webhook: $APP_URL/api/tradingview/webhook"
          echo "Firestore capacity API: $APP_URL/api/tradingview/firestore-usage"
          echo "Gemini health: $APP_URL/api/gemini/health"
          echo "Gemini analysis: $APP_URL/api/gemini/analyze"
          echo "Gemini configured: true (required and live-verified)"
          echo "Gemini credential source: GitHub Actions GEMINI_API_KEY is synchronized into Google Secret Manager as the latest secret version when present"
          echo "Gemini credential validation: live Interactions API model_output required before deployment"
          echo "Gemini routing: $GEMINI_MODEL -> $GEMINI_FALLBACK_MODEL -> $GEMINI_RESERVE_MODEL"
          echo "Gemini 429 strategy: immediate model failover plus per-model cooldown; provider Retry-After honored when supplied"
          echo "Gemini quota: Google provider/project/model limits only; no FXGA hourly or daily request cap"
          echo "Gemini quota conservation: Firestore TTL cache + same-instance duplicate request coalescing + reduced evidence payloads"
          echo "Frontend bundled into API container: NO"
          echo "Cloudflare application processing: NONE"
