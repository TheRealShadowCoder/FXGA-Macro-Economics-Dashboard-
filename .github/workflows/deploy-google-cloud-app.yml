name: Deploy FXGA Google Cloud Application

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'google-cloud-app/**'
      - '.github/workflows/deploy-google-cloud-app.yml'

concurrency:
  group: fxga-google-cloud-application
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  SERVICE: fxga-macro-dashboard
  GAR_REPOSITORY: fxga-containers
  GCP_PROJECT_ID: fxglobalavengerstradingacademy
  GCP_REGION: us-central1
  DEPLOY_SERVICE_ACCOUNT: fxga-github-deployer@fxglobalavengerstradingacademy.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: fxga-collector-runtime@fxglobalavengerstradingacademy.iam.gserviceaccount.com

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Validate Google Cloud API application
        working-directory: google-cloud-app
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          node --check server.js
          node --check tradingview-signals.js
          node --check firestore-usage-monitor.js
          node -e "const p=require('./package.json'); if(!p.dependencies['@google-cloud/firestore']||!p.dependencies['@google-cloud/monitoring']||!p.dependencies.ws) process.exit(1)"
          echo 'API validation complete. Frontend compilation is intentionally owned by the Cloudflare static deployment workflow.'

      - id: config
        name: Resolve Google Cloud authentication
        env:
          WIF_PROVIDER_SECRET: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_PROVIDER_VAR: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          WIF_PROVIDER="${WIF_PROVIDER_SECRET:-$WIF_PROVIDER_VAR}"
          test -n "$WIF_PROVIDER" || { echo '::error::GCP_WIF_PROVIDER is missing'; exit 1; }
          echo "wif_provider=$WIF_PROVIDER" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Google Cloud
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud services enable run.googleapis.com artifactregistry.googleapis.com firestore.googleapis.com monitoring.googleapis.com
          if ! gcloud projects add-iam-policy-binding "$GCP_PROJECT_ID" \
            --member="serviceAccount:$RUNTIME_SERVICE_ACCOUNT" \
            --role="roles/monitoring.viewer" \
            --condition=None \
            --quiet; then
            echo '::warning::Could not grant roles/monitoring.viewer automatically. Exact Cloud Monitoring usage may remain unavailable until this role is granted.'
          fi
          gcloud artifacts repositories describe "$GAR_REPOSITORY" --location "$GCP_REGION" >/dev/null 2>&1 || \
            gcloud artifacts repositories create "$GAR_REPOSITORY" --repository-format=docker --location "$GCP_REGION"

      - name: Build and push API-only dashboard container
        run: |
          set -euo pipefail
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GAR_REPOSITORY/$SERVICE:${GITHUB_SHA}"
          gcloud auth configure-docker "$GCP_REGION-docker.pkg.dev" --quiet
          docker build -f google-cloud-app/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - id: deploy
        name: Create or update public Google Cloud API application
        run: |
          set -euo pipefail
          gcloud run deploy "$SERVICE" \
            --image "$IMAGE" \
            --region "$GCP_REGION" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --cpu 1 \
            --memory 512Mi \
            --concurrency 80 \
            --min 0 \
            --max 3 \
            --timeout 3600 \
            --set-env-vars "GCP_PROJECT_ID=$GCP_PROJECT_ID,FXGA_ARCHITECTURE=google-cloud-processing-cloudflare-static-hosting"
          APP_URL=$(gcloud run services describe "$SERVICE" --region "$GCP_REGION" --format='value(status.url)')
          test -n "$APP_URL" || { echo '::error::Google Cloud application URL missing after deployment'; exit 1; }
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"
          echo "url=$APP_URL" >> "$GITHUB_OUTPUT"

      - name: Verify API, signal service and Firestore capacity contract
        run: |
          node <<'NODE'
          const base=process.env.APP_URL;
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last;
          for(let attempt=0;attempt<30;attempt++){
            try{
              const healthResponse=await fetch(base+'/api/health',{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
              const text=await healthResponse.text();
              if(!healthResponse.ok)throw new Error(`/api/health ${healthResponse.status}: ${text.slice(0,500)}`);
              const health=JSON.parse(text);
              if(health.architecture!=='google-cloud-processing-cloudflare-static-hosting'||health.compute!=='Google Cloud Run'||health.state!=='Google Cloud Firestore'||health.cloudflareRole!=='static-host-only'||health.cloudflareProcessing!==false)throw new Error('Google API / passive Cloudflare contract not active');
              if(health.tradingViewSignals?.schema!=='fxga.smc.signal.v3'||health.tradingViewSignals?.engine!=='FXGA_SMC2000')throw new Error('Signal service contract not active');
              for(const endpoint of ['/api/market-prices','/api/data-quality','/api/tradingview/config','/api/tradingview/signals/live?limit=5','/api/tradingview/signals/metrics']){
                const r=await fetch(base+endpoint,{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
                if(!r.ok)throw new Error(`${endpoint} ${r.status}: ${(await r.text()).slice(0,400)}`);
              }
              const usageResponse=await fetch(base+'/api/tradingview/firestore-usage',{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
              const usageText=await usageResponse.text();
              if(!usageResponse.ok)throw new Error(`Firestore usage ${usageResponse.status}: ${usageText.slice(0,500)}`);
              const usage=JSON.parse(usageText);
              if(usage.storage?.limitGiB!==1||usage.reads?.limit!==50000||usage.writes?.limit!==20000||usage.deletes?.limit!==20000)throw new Error('Firestore free-tier quota contract is incorrect');
              console.log('Google Cloud API service is live:',base);
              process.exit(0);
            }catch(error){last=error;await sleep(3000);}
          }
          throw last||new Error('Google Cloud application did not become ready');
          NODE

      - name: Production summary
        run: |
          echo "Website host: Cloudflare Static Assets"
          echo "Application API: $APP_URL"
          echo "Cloud Run service: $SERVICE"
          echo "TradingView webhook: $APP_URL/api/tradingview/webhook"
          echo "Firestore capacity API: $APP_URL/api/tradingview/firestore-usage"
          echo "Frontend bundled into API container: NO"
          echo "Cloudflare upstream acquisition/API processing: NONE"
