name: Verify Institutional Research Platform R0

on:
  workflow_run:
    workflows: ['Deploy FXGA R0 Cloudflare Runtime']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-institutional-research-r0
  cancel-in-progress: true

env:
  FXGA_API_BASE: https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check professional public language
        run: |
          node <<'NODE'
          const fs=require('fs');
          const files=['src/App.tsx','src/components/AcquisitionView.tsx','src/components/DecisionIntelligence.tsx','src/components/ResearchView.tsx'];
          const banned=[/FXGA\s*9705/i,/Super Economist/i,/\bWS\b/];
          for(const file of files){
            const text=fs.readFileSync(file,'utf8');
            for(const pattern of banned)if(pattern.test(text))throw new Error(`${file} exposes internal wording matched by ${pattern}`);
          }
          const brand=fs.readFileSync('src/brand.ts','utf8');
          if(!brand.includes('FX_GLOBAL_AVENGERS_LOGO')||brand.length<1000)throw new Error('FX Global Avengers brand asset is not integrated');
          console.log('Public-language and brand contract passed.');
          NODE

      - name: Verify live R0 institutional foundation
        run: |
          set -euo pipefail
          node <<'NODE'
          const base=process.env.FXGA_API_BASE;
          async function get(path){
            const response=await fetch(base+path,{headers:{Accept:'application/json','Cache-Control':'no-cache'},cache:'no-store'});
            const text=await response.text();
            if(!response.ok)throw new Error(`${path} ${response.status}: ${text.slice(0,800)}`);
            try{return JSON.parse(text);}catch{throw new Error(`${path} did not return JSON`);}
          }
          const [health,ai,market,technical,quality,research,scenarios,releases]=await Promise.all([
            get('/api/health'),
            get('/api/gemini/intelligence-health'),
            get('/api/market-prices'),
            get('/api/technical'),
            get('/api/data-quality'),
            get('/api/research'),
            get('/api/scenarios'),
            get('/api/release-analytics'),
          ]);

          if(health.architecture!=='cloudflare-r0')throw new Error(`Unexpected architecture ${health.architecture}`);
          if(health.compute!=='Cloudflare Workers Free')throw new Error(`Unexpected compute ${health.compute}`);
          if(health.database!=='Cloudflare D1 Free')throw new Error(`Unexpected database ${health.database}`);
          if(health.googleCloudRuntime!==false)throw new Error('Google Cloud runtime must remain disabled');
          if(ai.configured!==true)throw new Error('Gemini AI is not configured');
          if(Number(ai.promptCount||0)<6)throw new Error(`Prompt registry too small: ${ai.promptCount||0}`);

          if(market.schema!=='fxga.r0.market-data.v1')throw new Error(`Market R0 schema missing: ${market.schema||'none'}`);
          if(!Array.isArray(market.canonicalFx)||market.canonicalFx.length<1)throw new Error('Canonical FX market state is empty');
          if(market?._r0?.source!=='cloudflare-d1')throw new Error('Market state is not being served from D1');

          if(technical.schema!=='fxga.r0.technical-market-context.v1')throw new Error(`Technical R0 schema missing: ${technical.schema||'none'}`);
          if(technical?._r0?.source!=='cloudflare-d1')throw new Error('Technical state is not being served from D1');

          if(quality.schema!=='fxga.r0.data-quality.v1')throw new Error(`Data-quality R0 schema missing: ${quality.schema||'none'}`);
          if(Number(quality?.counts?.providersHealthy||0)<1)throw new Error('No healthy free market provider is recorded');
          if(quality?._r0?.source!=='cloudflare-d1')throw new Error('Data-quality state is not being served from D1');
          if(quality?.budget?.firestore!==false)throw new Error('R0 data-quality state must explicitly report no Firestore dependency');

          const optionalState = (name,value) => ({
            name,
            available: value?.available !== false,
            source: value?._r0?.source || value?.source || null,
          });
          const optional=[
            optionalState('research',research),
            optionalState('scenarios',scenarios),
            optionalState('release-analytics',releases),
          ];

          console.log(JSON.stringify({
            architecture:health.architecture,
            compute:health.compute,
            database:health.database,
            googleCloudRuntime:health.googleCloudRuntime,
            geminiConfigured:ai.configured,
            promptCount:ai.promptCount,
            canonicalFx:market.canonicalFx.length,
            contextAssets:Array.isArray(market.contextAssets)?market.contextAssets.length:0,
            microstructureAssets:Array.isArray(market.microstructureAssets)?market.microstructureAssets.length:0,
            providersHealthy:quality.counts.providersHealthy,
            firestoreDependency:quality.budget.firestore,
            optionalResearchStates:optional,
          },null,2));
          NODE
