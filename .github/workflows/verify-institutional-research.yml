name: Verify Institutional Research Platform

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-institutional-research.yml'
      - 'src/**'
      - 'worker/**'
  workflow_run:
    workflows: ['Deploy FXGA Google Cloud Collector']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-institutional-research-production
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Check professional public language
        run: |
          node <<'NODE'
          const fs=require('fs');
          const files=['src/App.tsx','src/components/AcquisitionView.tsx','src/components/DecisionIntelligence.tsx','src/components/ResearchView.tsx'];
          const banned=[/FXGA\s*9705/i,/Google Cloud/i,/Cloudflare/i,/Super Economist/i,/\bWS\b/];
          for(const file of files){
            const text=fs.readFileSync(file,'utf8');
            for(const pattern of banned)if(pattern.test(text))throw new Error(`${file} exposes internal wording matched by ${pattern}`);
          }
          const brand=fs.readFileSync('src/brand.ts','utf8');
          if(!brand.includes('FX_GLOBAL_AVENGERS_LOGO')||brand.length<1000)throw new Error('FX Global Avengers brand asset is not integrated');
          console.log('Public-language and brand contract passed.');
          NODE

      - name: Verify complete live institutional research contract
        run: |
          node <<'NODE'
          const base='https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(path){
            const r=await fetch(base+path,{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
            const text=await r.text();
            if(!r.ok)throw new Error(`${path} ${r.status}: ${text.slice(0,800)}`);
            return JSON.parse(text);
          }
          function normalizedCoverage(research,quality){
            const raw=quality?.macro?.coverage&&typeof quality.macro.coverage==='object'?quality.macro.coverage:{};
            const observed=Number(research?.dataQuality?.diagnostics?.macroObservations||0);
            const usableRaw=Number(raw.usableObservations);
            const usable=Number.isFinite(usableRaw)&&usableRaw>0?usableRaw:observed;
            const requestedRaw=Number(raw.requested);
            // Production's target macro universe is 180. Legacy fast snapshots did not persist coverageQuality,
            // so use the measured research observation count against the same production target rather than
            // treating the missing metadata as missing data.
            const requested=Number.isFinite(requestedRaw)&&requestedRaw>0?Math.max(requestedRaw,usable):Math.max(180,usable);
            const effectiveRaw=Number(raw.effectiveCoveragePercent);
            const effective=Number.isFinite(effectiveRaw)?effectiveRaw:(requested?Math.min(100,100*usable/requested):0);
            return {...raw,requested,usableObservations:usable,effectiveCoveragePercent:Number(effective.toFixed(1)),derivedFromMeasuredObservations:!Number.isFinite(effectiveRaw)};
          }
          function validate({research,quality,calendar,market}){
            const errors=[];
            if(!research||Number(research.schemaVersion)!==1)errors.push('research schema');
            if(typeof research?.dataQuality?.overall!=='number')errors.push('research data quality');
            if(!Array.isArray(research?.features)||research.features.length===0)errors.push('features');
            if(!Array.isArray(research?.forecasts)||research.forecasts.length===0)errors.push('forecasts');
            if(!Array.isArray(research?.regimes)||research.regimes.length===0)errors.push('regimes');
            if(!Array.isArray(research?.risk?.categories)||research.risk.categories.length<10)errors.push('risk categories');
            if(!Array.isArray(research?.scenarios)||research.scenarios.length<10)errors.push('research scenarios');
            if(!Array.isArray(research?.releaseAnalytics?.profiles))errors.push('release analytics');
            if(Number(research?.capabilityCoverage?.total)!==40)errors.push('capability coverage');
            if(!research?.provenance?.reproducibilityHash)errors.push('reproducibility hash');
            if(!Array.isArray(research?.operatingStandards?.slos)||research.operatingStandards.slos.length<7)errors.push('operating SLOs');
            const coverage=normalizedCoverage(research,quality);
            if(Number(coverage.usableObservations||0)<100)errors.push(`usable observations ${coverage.usableObservations||0}`);
            if(Number(coverage.effectiveCoveragePercent||0)<75)errors.push(`effective coverage ${coverage.effectiveCoveragePercent||0}%`);
            if(!quality?.macro?.failures||typeof quality.macro.failures.total!=='number')errors.push('failure diagnostics');
            if(!Array.isArray(calendar?.events))errors.push('calendar history');
            if(!Array.isArray(market?.assets)||market.assets.length===0)errors.push('market snapshot');
            return {errors,coverage};
          }
          let lastErrors=['not started'],snapshot=null,verifiedCoverage=null;
          for(let attempt=1;attempt<=30;attempt++){
            try{
              const [research,quality,calendar,market]=await Promise.all([
                get('/api/research'),get('/api/data-quality'),get('/api/calendar-history?days=7'),get('/api/market-prices')
              ]);
              const checked=validate({research,quality,calendar,market});
              if(!checked.errors.length){snapshot={research,quality,calendar,market};verifiedCoverage=checked.coverage;break;}
              lastErrors=checked.errors;
              console.log(`Attempt ${attempt}/30 waiting for: ${checked.errors.join(', ')}`);
            }catch(error){
              lastErrors=[String(error?.message||error)];
              console.log(`Attempt ${attempt}/30: ${lastErrors[0]}`);
            }
            await sleep(5000);
          }
          if(!snapshot)throw new Error(`Institutional research contract did not converge: ${lastErrors.join('; ')}`);

          // These are checked once, after the core contract is healthy, rather than on every retry.
          const [scenarios,releases]=await Promise.all([get('/api/scenarios'),get('/api/release-analytics')]);
          if(!Array.isArray(scenarios?.scenarios)||scenarios.scenarios.length<10)throw new Error('Scenario endpoint invalid');
          if(!Array.isArray(releases?.profiles))throw new Error('Release analytics endpoint invalid');

          const {research,quality,calendar,market}=snapshot,coverage=verifiedCoverage;
          console.log(JSON.stringify({institutionalDataQuality:research.dataQuality.overall,macroEffectiveCoverage:coverage.effectiveCoveragePercent,macroUsableObservations:coverage.usableObservations,coverageDerivedFromMeasuredObservations:coverage.derivedFromMeasuredObservations===true,macroFailures:quality.macro.failures.total,features:research.features.length,forecasts:research.forecasts.length,regimes:research.regimes.length,riskCategories:research.risk.categories.length,scenarios:scenarios.scenarios.length,releaseProfiles:releases.profiles.length,calendarHistory:calendar.events.length,marketAssets:market.assets.length},null,2));
          NODE
