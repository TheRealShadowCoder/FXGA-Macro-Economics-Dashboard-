name: R0 Free Data Collectors

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/r0-*.mjs'
      - 'cloud-run-collector/src/free-market-data*.js'
      - 'cloud-run-collector/src/global-fred.js'
      - '.github/workflows/r0-free-market-collector.yml'
  schedule:
    - cron: '*/15 * * * *'
    - cron: '17 * * * *'

concurrency:
  group: fxga-r0-free-data-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FXGA_API_BASE: https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev

jobs:
  market:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FXGA_INGEST_TOKEN: ${{ secrets.FXGA_INGEST_TOKEN }}
      FXGA_MT5_REPORT_SECRET: ${{ secrets.FXGA_MT5_REPORT_SECRET }}
      TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
      ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
      MARKETSTACK_API_KEY: ${{ secrets.MARKETSTACK_API_KEY }}
      FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      NASDAQ_DATA_LINK_API_KEY: ${{ secrets.NASDAQ_DATA_LINK_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate authenticated D1 ingestion
        run: |
          set -euo pipefail
          if [ -z "${FXGA_INGEST_TOKEN:-}" ] && [ -z "${FXGA_MT5_REPORT_SECRET:-}" ]; then
            echo '::error::Add FXGA_INGEST_TOKEN or reuse FXGA_MT5_REPORT_SECRET under repository Actions secrets.'
            exit 1
          fi

      - name: Collect free market data and write D1 states
        run: node scripts/r0-collect-market.mjs

  macro:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.schedule == '17 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FXGA_INGEST_TOKEN: ${{ secrets.FXGA_INGEST_TOKEN }}
      FXGA_MT5_REPORT_SECRET: ${{ secrets.FXGA_MT5_REPORT_SECRET }}
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Validate free macro collector secrets
        run: |
          set -euo pipefail
          if [ -z "${FXGA_INGEST_TOKEN:-}" ] && [ -z "${FXGA_MT5_REPORT_SECRET:-}" ]; then
            echo '::error::Add FXGA_INGEST_TOKEN or reuse FXGA_MT5_REPORT_SECRET under repository Actions secrets.'
            exit 1
          fi
          test -n "$FRED_API_KEY" || { echo '::error::FRED_API_KEY is required for the free FRED macro collector.'; exit 1; }

      - name: Collect FRED macro evidence and write D1
        run: node scripts/r0-collect-macro.mjs
