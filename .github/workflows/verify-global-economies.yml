name: Verify FXGA Google Global Economies

on:
  push:
    branches: [main]
    paths:
      - 'cloud-run-collector/src/global-fred.js'
      - 'cloud-run-collector/src/super-economist-core.js'
      - 'src/components/EconomicContextReport.tsx'
      - 'src/lib/economy-types.ts'
      - '.github/workflows/verify-global-economies.yml'
  workflow_run:
    workflows: ["Deploy FXGA Google Cloud Collector"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify dynamic global-economy source contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const core=fs.readFileSync('cloud-run-collector/src/super-economist-core.js','utf8');
          const fred=fs.readFileSync('cloud-run-collector/src/global-fred.js','utf8');
          const ui=fs.readFileSync('src/components/EconomicContextReport.tsx','utf8');
          const types=fs.readFileSync('src/lib/economy-types.ts','utf8');
          const expected=['USA','EUROPE','UK','SOUTH_AFRICA','JAPAN','CANADA','AUSTRALIA','NEW_ZEALAND','SWITZERLAND','CHINA','INDIA','BRAZIL','MEXICO','SOUTH_KOREA','INDONESIA','SAUDI_ARABIA','TURKEY','ARGENTINA','SINGAPORE','NORWAY','SWEDEN'];
          for(const id of expected) if(!core.includes(`'${id}'`)&&!core.includes(`${id}:`)) throw new Error(`Missing economy ${id} from macro state engine`);
          for(const id of expected.slice(5)) if(!fred.includes(`${id}:`)) throw new Error(`Missing FRED discovery label ${id}`);
          if(/export type EconomyId\s*=\s*'USA'/.test(types)) throw new Error('Frontend EconomyId must remain data-driven');
          for(const text of ['All Economies','Choose an economy','How to compare two economies','Mini economics school','fetchEconomyAnalysis']) if(!ui.includes(text)) throw new Error(`Economic Context educational/global UI missing: ${text}`);
          console.log(JSON.stringify({sourceContract:true,baselineEconomies:expected.length,dynamicFrontend:true,educationalReport:true}));
          NODE

      - name: Verify live Google global economy state
        run: |
          node <<'NODE'
          const base='https://fxga-macro-dashboard-kbjj66blka-uc.a.run.app';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function json(path){let last;for(let n=0;n<12;n++){try{const r=await fetch(base+path,{headers:{Accept:'application/json','Cache-Control':'no-cache'}}),t=await r.text();if(!r.ok)throw new Error(`${path} ${r.status}: ${t.slice(0,500)}`);return JSON.parse(t);}catch(e){last=e;await sleep(3000);}}throw last;}
          const global=await json('/api/global-macro');
          const analysis=await json('/api/economy-analysis');
          if(!Array.isArray(global.targetEconomies)||global.targetEconomies.length<21)throw new Error(`Expected >=21 target economies, got ${global.targetEconomies?.length}`);
          if(!Array.isArray(analysis.economies)||analysis.economies.length<5)throw new Error('No usable economy states returned');
          const ids=new Set(analysis.economies.map(e=>e.id));
          for(const id of ['USA','EUROPE','UK','SOUTH_AFRICA','JAPAN']) if(!ids.has(id))throw new Error(`Core economy ${id} missing from live state`);
          for(const e of analysis.economies){
            if(!e.label||!e.currency||!e.centralBank)throw new Error(`Metadata incomplete for ${e.id}`);
            if(!Array.isArray(e.dimensions)||e.dimensions.length!==5)throw new Error(`${e.id} does not expose five educational macro dimensions`);
            for(const id of ['growth','inflation','labour','policy','financial']) if(!e.dimensions.some(d=>d.id===id))throw new Error(`${e.id} missing ${id} dimension`);
          }
          console.log('Expanded global economy contract passed:',JSON.stringify({targets:global.targetEconomies.length,populated:analysis.economies.length,observations:analysis.observationCount}));
          NODE
