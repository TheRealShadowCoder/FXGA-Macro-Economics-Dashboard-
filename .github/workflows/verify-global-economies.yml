name: Verify FXGA Google Global Economies

on:
  workflow_run:
    workflows: ["Activate Google Cloud FXGA 9705 Engine"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify passive edge and five-economy Google state
        run: |
          node <<'NODE'
          const base='https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev';
          async function json(path){const r=await fetch(base+path,{headers:{Accept:'application/json','Cache-Control':'no-cache'}}),t=await r.text();if(!r.ok)throw new Error(`${path} ${r.status}: ${t.slice(0,500)}`);return JSON.parse(t);}
          const health=await json('/api/health');
          if(health.collectorMode!=='google-cloud-run-webhook')throw new Error('Google webhook mode missing');
          if(health.configured?.browserRun!==false||health.configured?.calendarScraping!==false||health.configured?.officialNewsScraping!==false)throw new Error('Cloudflare acquisition must be disabled');
          for(const k of ['normalStateUpstreamCalendarRequests','normalStateUpstreamFredRequests','normalStateUpstreamNewsRequests','normalStateUpstreamMarketRequests'])if(Number(health.safety?.[k]??-1)!==0)throw new Error(`${k} must be zero`);
          const catalog=await json('/api/fred/catalog');
          if(Number(catalog.curatedBase||0)<109||Number(catalog.total||0)<109)throw new Error(`Google FRED universe incomplete: total=${catalog.total}, curated=${catalog.curatedBase}`);
          for(const economy of ['USA','EUROPE','UK','SOUTH_AFRICA','JAPAN'])if(!catalog.policy?.globalCoverage?.includes(economy))throw new Error(`Missing ${economy} global coverage`);
          const global=await json('/api/global-macro');
          if(global.totalObservations<100||global.targetEconomies?.length!==5)throw new Error('Global macro state incomplete');
          const analysis=await json('/api/economy-analysis');
          if(analysis.collectorMode!=='google-cloud-run-super-economist')throw new Error(`Economy analysis must originate in Google Super Economist, got ${analysis.collectorMode}`);
          const expected={USA:['USD','Federal Reserve'],EUROPE:['EUR','European Central Bank'],UK:['GBP','Bank of England'],SOUTH_AFRICA:['ZAR','South African Reserve Bank'],JAPAN:['JPY','Bank of Japan']};
          if(analysis.economies?.length!==5)throw new Error('Expected five economy states');
          for(const [id,[currency,bank]] of Object.entries(expected)){const e=analysis.economies.find(x=>x.id===id);if(!e||e.currency!==currency||e.centralBank!==bank)throw new Error(`Mapping failed ${id}`);if(e.dimensions?.length!==5)throw new Error(`${id} missing five dimensions`);}
          const superEngine=await json('/api/super-economist');
          if(superEngine.registry?.totalMethods!==9705||superEngine.registry?.totalFamilies!==150)throw new Error('9705/150 registry contract failed');
          if(superEngine.executionLocation!=='Google Cloud Run')throw new Error('Decision engine not executed on Google Cloud');
          console.log('Google global-economy contract passed:',JSON.stringify({fred:catalog.total,observations:global.totalObservations,methods:superEngine.registry.totalMethods,eligible:superEngine.coverage?.eligibleMethods,activeFamilies:superEngine.coverage?.activeFamilies}));
          NODE
