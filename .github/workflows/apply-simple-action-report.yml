name: Apply Simple Action Report

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-simple-action-report.mjs'
      - 'src/components/SimpleActionReport.tsx'
      - 'src/components/SimpleActionReport.css'
      - '.github/workflows/apply-simple-action-report.yml'

permissions:
  contents: write

concurrency:
  group: fxga-simple-action-report
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Integrate Action Report
        run: node scripts/apply-simple-action-report.mjs
      - name: Build production frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit integrated App shell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git diff --cached --quiet || git commit -m 'Make plain English Action Report the default view'
          git push origin HEAD:main
