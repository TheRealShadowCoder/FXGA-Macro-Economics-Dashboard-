name: Apply Evidence Completeness Source Minimal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-evidence-completeness-minimal.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply and diagnose evidence completeness
        run: |
          set +e
          mkdir -p /tmp/completeness .github
          python3 scripts/apply_evidence_completeness_upgrade.py > /tmp/completeness/patch.log 2>&1
          PATCH_RC=$?
          node --check cloud-run-collector/src/decision-intelligence-core.js > /tmp/completeness/check.log 2>&1
          CHECK_RC=$?
          grep -q 'function evidenceCompletenessControls' cloud-run-collector/src/decision-intelligence-core.js; G1=$?
          grep -q 'evidenceCompleteness:g.evidenceCompleteness' cloud-run-collector/src/decision-intelligence-core.js; G2=$?
          grep -q 'completenessFactor' cloud-run-collector/src/decision-intelligence-core.js; G3=$?
          CONTRACT_RC=$(( G1 || G2 || G3 ))
          {
            echo "generated_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "patch_exit=$PATCH_RC"
            echo "syntax_exit=$CHECK_RC"
            echo "contract_exit=$CONTRACT_RC"
            echo '--- patch output ---'
            cat /tmp/completeness/patch.log
            echo '--- syntax output ---'
            cat /tmp/completeness/check.log
          } > .github/evidence-completeness-diagnostic.txt
          echo "$PATCH_RC" > /tmp/completeness/patch.rc
          echo "$CHECK_RC" > /tmp/completeness/check.rc
          echo "$CONTRACT_RC" > /tmp/completeness/contract.rc
      - name: Persist source or diagnostic
        run: |
          PATCH_RC=$(cat /tmp/completeness/patch.rc)
          CHECK_RC=$(cat /tmp/completeness/check.rc)
          CONTRACT_RC=$(cat /tmp/completeness/contract.rc)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/evidence-completeness-diagnostic.txt
          if [ "$PATCH_RC" = 0 ] && [ "$CHECK_RC" = 0 ] && [ "$CONTRACT_RC" = 0 ]; then
            git add cloud-run-collector/src/decision-intelligence-core.js
            MSG='Integrate evidence completeness governance source'
          else
            MSG='Record evidence completeness integration diagnostic'
          fi
          git commit -m "$MSG"
          git pull --rebase origin main
          git push origin HEAD:main
