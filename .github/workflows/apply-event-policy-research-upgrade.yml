name: Apply Event Reaction And Policy Path Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-event-policy-research-upgrade.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply research integration
        run: python3 scripts/apply_event_policy_research_upgrade.py
      - name: Validate collector syntax
        run: |
          cd cloud-run-collector
          npm run check
      - name: Validate event reaction and policy path models
        run: |
          cd cloud-run-collector
          node --input-type=module <<'NODE'
          import { buildEventReactionResearch } from './src/event-reaction-research.js';
          import { buildPolicyPathResearch } from './src/policy-path-research.js';
          const now=new Date();
          const measured=(agreement,move)=>({quality:'measured',directionalAgreement:agreement,meanBaseCurrencyMovePct:move});
          const studies=Array.from({length:8},(_,i)=>({eventId:`cpi-${i}`,event:'Consumer Price Index',category:'inflation',currency:'USD',importance:3,releaseAt:new Date(now.getTime()-(i+1)*86400000).toISOString(),horizons:{'5m':measured(i===7 ? .42 : .70,.03),'15m':measured(.68,.05),'1h':measured(.72,.08),'4h':measured(.66,.07)}}));
          const reactions=buildEventReactionResearch({studies},now);
          if(reactions.studyCount!==8)throw new Error('Event reaction study count mismatch');
          if(!reactions.byCurrency?.USD||reactions.byCurrency.USD.measurements<20)throw new Error('USD reaction memory missing');
          if(!reactions.byCurrencyCategory?.['USD:inflation'])throw new Error('Currency-family reaction memory missing');
          if(!Number.isFinite(reactions.byCurrency.USD.agreement))throw new Error('Reaction agreement invalid');
          const dims=(growth,inflation,labour,policy,financial)=>[{id:'growth',score:growth},{id:'inflation',score:inflation},{id:'labour',score:labour},{id:'policy',score:policy},{id:'financial',score:financial}];
          const economyAnalysis={economies:[
            {id:'USA',currency:'USD',centralBank:'Federal Reserve',policyStance:'balanced',confidence:82,observationCount:40,dimensions:dims(20,48,28,12,10)},
            {id:'EUROPE',currency:'EUR',centralBank:'ECB',policyStance:'balanced',confidence:76,observationCount:35,dimensions:dims(8,22,10,18,5)},
            {id:'UK',currency:'GBP',centralBank:'BoE',policyStance:'balanced',confidence:74,observationCount:32,dimensions:dims(5,30,20,20,8)},
            {id:'SOUTH_AFRICA',currency:'ZAR',centralBank:'SARB',policyStance:'hawkish',confidence:70,observationCount:28,dimensions:dims(6,35,12,28,4)},
            {id:'JAPAN',currency:'JPY',centralBank:'BoJ',policyStance:'balanced',confidence:68,observationCount:26,dimensions:dims(10,18,10,8,5)}
          ]};
          const events=[{event:'Federal Reserve Interest Rate Decision',category:'policy',currency:'USD',date:new Date(now.getTime()+7*86400000).toISOString(),forecast:'4.50%',previous:'4.50%'}];
          const policy=buildPolicyPathResearch(economyAnalysis,events,now);
          if(policy.economies.length!==5)throw new Error(`Expected 5 policy paths, got ${policy.economies.length}`);
          const usa=policy.economies.find(x=>x.currency==='USD');
          const total=usa.probabilities.hike+usa.probabilities.hold+usa.probabilities.cut;
          if(Math.abs(total-1)>.002)throw new Error(`Policy probabilities do not sum to 1: ${total}`);
          if(policy.marketPricingAvailable!==false)throw new Error('Model-implied policy path must not claim market pricing');
          if(!usa.nextMeeting)throw new Error('Next policy meeting was not linked');
          console.log(JSON.stringify({eventReaction:{studies:reactions.studyCount,usd:reactions.byCurrency.USD},policy:{type:policy.type,usa}},null,2));
          NODE
      - name: Verify production integration anchors
        run: |
          grep -q "buildEventReactionResearch" cloud-run-collector/src/super-economist.js
          grep -q "buildPolicyPathResearch" cloud-run-collector/src/super-economist.js
          grep -q "eventStudies:eventStudyPayload" cloud-run-collector/src/super-runtime.js
          grep -q "get('event-studies')" cloud-run-collector/src/super-runtime.js
      - name: Validate production frontend build
        run: |
          npm ci
          npm run build
      - name: Commit research integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud-run-collector/src/super-economist.js cloud-run-collector/src/super-runtime.js cloud-run-collector/package.json
          if git diff --cached --quiet; then echo 'No integration changes to commit.'; exit 0; fi
          git commit -m 'Integrate event reaction and policy path research'
          git pull --rebase origin main
          git push origin HEAD:main
