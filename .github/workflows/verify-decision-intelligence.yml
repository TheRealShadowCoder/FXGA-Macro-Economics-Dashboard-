name: Verify FXGA Google Decision Intelligence

on:
  workflow_run:
    workflows: ["Activate Google Cloud FXGA 9705 Engine"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify FXGA 9705 decision engine and frozen-audit contract
        run: |
          node <<'NODE'
          const base='https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev';
          async function get(path){const r=await fetch(base+path,{headers:{Accept:'application/json','Cache-Control':'no-cache'}}),t=await r.text();if(!r.ok)throw new Error(`${path} ${r.status}: ${t.slice(0,800)}`);return JSON.parse(t);}
          const intel=await get('/api/super-economist');
          if(intel.registry?.totalMethods!==9705||intel.registry?.totalFamilies!==150)throw new Error('FXGA 9705 registry contract failed');
          if(intel.registry?.provenance?.sourceNative!==7705||intel.registry?.provenance?.reconstructedDiagnostics!==2000)throw new Error('Registry provenance contract failed');
          if(!Array.isArray(intel.pipeline)||intel.pipeline.join('|')!=='independent-family-collapse|economic-actual|market-reaction|trade-probability|BUY-SELL-WAIT|frozen-audit')throw new Error('Master decision pipeline changed');
          if(intel.executionLocation!=='Google Cloud Run')throw new Error('Super Economist is not running on Google Cloud');
          if(intel.researchGates?.tau!==0.60||intel.researchGates?.qMin!==60||intel.researchGates?.eventEdgeMin!==60||intel.researchGates?.waitFirstClass!==true)throw new Error('Research gate contract changed');
          if(intel.edgeFormula?.forecast!==0.30||intel.edgeFormula?.surprise!==0.25||intel.edgeFormula?.pricingGap!==0.20||intel.edgeFormula?.positioning!==0.15||intel.edgeFormula?.technical!==0.10)throw new Error('Event Edge weighting changed');
          if(intel.coverage?.registeredMethods!==9705||intel.coverage?.registeredFamilies!==150)throw new Error('Coverage registry totals missing');
          if(!(intel.coverage?.eligibleMethods>0)||intel.coverage.eligibleMethods>9705)throw new Error('Data-eligibility accounting invalid');
          const economy=intel.economyAnalysis;
          if(economy?.economies?.length!==5)throw new Error('Five economy states missing');
          const signals=intel.sessionSignals;
          if(!Array.isArray(signals?.currencyStates)||signals.currencyStates.length!==5)throw new Error('Five ranked currency states missing');
          if(!Array.isArray(signals?.rankedOpportunities)||signals.rankedOpportunities.length<8)throw new Error('Opportunity board incomplete');
          const all=(signals.sessions||[]).flatMap(s=>s.signals||[]);
          for(const symbol of ['EURUSD','GBPUSD','USDJPY','EURGBP','USDZAR','EURZAR','GBPZAR','XAUUSD'])if(!all.some(x=>x.symbol===symbol))throw new Error(`Missing ${symbol}`);
          for(const signal of all){if(!['BUY','SELL','WAIT'].includes(signal.direction))throw new Error(`${signal.symbol} invalid direction`);if(!['WAIT_EVENT','NO_MACRO_EDGE','AWAIT_TECHNICAL_CONFIRMATION'].includes(signal.executionGate))throw new Error(`${signal.symbol} invalid gate`);if(signal.risk==='event-lockout'&&signal.direction!=='WAIT')throw new Error(`${signal.symbol} violated event lockout`);}
          if(!intel.specialEventModels?.fomc||!intel.specialEventModels?.nfp||!intel.specialEventModels?.inflation)throw new Error('FOMC/NFP/inflation source-native models missing');
          if(Number(intel.specialEventModels.fomc.components?.inflationPressure?.weight)!==0.30||Number(intel.specialEventModels.fomc.components?.labourPressure?.weight)!==0.25)throw new Error('FOMC source-native weights changed');
          const nw=intel.specialEventModels.nfp.weights||{};
          if(nw.weeklyClaims!==0.20||nw.joltsLabourDemand!==0.15||nw.ismEmploymentBreadth!==0.15||nw.revisionRisk!==0.10)throw new Error('NFP source-native weights changed');
          console.log('FXGA 9705 Google decision intelligence verified:',JSON.stringify({eligibleMethods:intel.coverage.eligibleMethods,activeFamilies:intel.coverage.activeFamilies,frozen:intel.audit?.frozenThisRun,scored:intel.audit?.scoredThisRun,actionable:signals.decisionSummary?.actionableCount}));
          NODE
