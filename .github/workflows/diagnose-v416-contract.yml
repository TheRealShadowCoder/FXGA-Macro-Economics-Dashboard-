name: Diagnose V4.16 Contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-diagnose-v416-contract.trigger'

permissions:
  contents: write
  id-token: write

env:
  SERVICE: fxga-macro-collector
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: service
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          gcloud config set project "$PROJECT_ID"
          SERVICE_URL=$(gcloud run services describe "$SERVICE" --region "$GCP_REGION" --format='value(status.url)')
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
      - id: invoke
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.url }}
          id_token_include_email: true
      - name: Capture sanitized contract state
        env:
          TOKEN: ${{ steps.invoke.outputs.id_token }}
          PUBLIC_BASE: https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base=process.env.SERVICE_URL,token=process.env.TOKEN,pub=process.env.PUBLIC_BASE;
          async function req(url,opts={}){const r=await fetch(url,opts),t=await r.text();let j=null;try{j=JSON.parse(t)}catch{}return {status:r.status,json:j,text:j?null:t.slice(0,500)}}
          const headers={Authorization:`Bearer ${token}`,Accept:'application/json','Content-Type':'application/json'};
          const health=await req(base+'/health',{headers});
          const refresh=await req(base+'/refresh-intelligence',{method:'POST',headers,body:'{"forceNews":false}'});
          const state=await req(base+'/state',{headers});
          const publicResearch=await req(pub+'/api/research',{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
          const publicHealth=await req(pub+'/api/health',{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
          const intel=state.json?.intelligence?.payload,research=intel?.research,core=intel?.decisionGovernance,pairs=core?.pairDecisions||[],policy=research?.policyPathResearch,attr=research?.decisionQualityAttribution;
          const pubResearch=publicResearch.json,pubCore=pubResearch?.decisionCore,pubPairs=pubCore?.pairDecisions||[],pubPolicy=pubResearch?.policyPathResearch,pubAttr=pubResearch?.decisionQualityAttribution;
          const summarizePairs=rows=>({count:rows.length,withCalibration:rows.filter(x=>x?.eventReactionCalibration).length,active:rows.filter(x=>x?.eventReactionCalibration?.available).length,minFactor:rows.length?Math.min(...rows.map(x=>Number(x?.eventReactionCalibration?.factor??999))):null,maxFactor:rows.length?Math.max(...rows.map(x=>Number(x?.eventReactionCalibration?.factor??-999))):null,maxExposure:rows.length?Math.max(...rows.map(x=>Number(x?.eventReactionCalibration?.releaseExposure||0))):null});
          const policySummary=p=>({banks:p?.economies?.length||0,marketPricingAvailable:p?.marketPricingAvailable??null,treeDepths:(p?.economies||[]).map(x=>x?.sequenceTree?.depth??null),windowCounts:(p?.economies||[]).map(x=>x?.sequenceTree?.decisionWindows?.length??0)});
          const out={generatedAt:new Date().toISOString(),private:{healthStatus:health.status,version:health.json?.version??null,refreshStatus:refresh.status,refreshChanged:refresh.json?.changed??null,webhook:refresh.json?.webhook??null,stateStatus:state.status,coreVersion:core?.version??null,pairs:summarizePairs(pairs),policy:policySummary(policy),attributionSamples:attr?.sampledRealizedStates??null,attributionMethodology:String(attr?.methodology||'').slice(0,240)},public:{researchStatus:publicResearch.status,healthStatus:publicHealth.status,collectorMode:publicHealth.json?.collectorMode??null,coreVersion:pubCore?.version??null,pairs:summarizePairs(pubPairs),policy:policySummary(pubPolicy),attributionSamples:pubAttr?.sampledRealizedStates??null,attributionMethodology:String(pubAttr?.methodology||'').slice(0,240),safety:publicHealth.json?.safety??null}};
          fs.writeFileSync('.github/v416-contract-diagnostic.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));
          NODE
      - name: Persist diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/v416-contract-diagnostic.json
          git commit -m 'Record v4.16 live contract diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main
