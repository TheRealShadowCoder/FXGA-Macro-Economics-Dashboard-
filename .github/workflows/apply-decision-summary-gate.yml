name: Apply FXGA Decision Gate Consistency

on:
  push:
    paths:
      - '.github/workflows/apply-decision-summary-gate.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fxga-decision-gate-consistency
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply decision gate consistency
        run: python3 scripts/apply_decision_summary_gate.py
      - name: Validate application
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit decision gate consistency
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then exit 0; fi
          git add worker/index-v3.ts src/components/DecisionIntelligence.tsx
          git commit -m "Require technical confirmation for actionable count"
          git pull --rebase origin main
          git push origin HEAD:main
