name: Verify FXGA R0 Architecture

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'worker/**'
      - 'scripts/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare-static.yml'
      - '.github/workflows/r0-free-market-collector.yml'
      - '.github/workflows/verify-production-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'worker/**'
      - 'scripts/**'
      - 'wrangler.jsonc'
      - '.github/workflows/deploy-cloudflare-static.yml'
      - '.github/workflows/r0-free-market-collector.yml'
      - '.github/workflows/verify-production-runtime.yml'

permissions:
  contents: read

concurrency:
  group: fxga-r0-architecture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'

      - name: Install and build
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          npm run build
          node --check worker/src/index.js
          node --check worker/src/r0-entry.js
          node --check worker/src/auth-gateway.js
          node --check worker/src/security.js
          node --check scripts/r0-collect-market.mjs
          node --check scripts/r0-collect-macro.mjs
          node scripts/verify-upgrade-program.mjs

      - name: Verify R0 + member authorization contracts
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const assert=(c,m)=>{if(!c)throw new Error(m)};
          const read=(f)=>fs.readFileSync(f,'utf8');

          const wrangler=JSON.parse(read('wrangler.jsonc'));
          assert(wrangler.main==='./worker/src/auth-gateway.js','Wrangler main must be the member auth gateway');
          assert(wrangler.assets?.binding==='ASSETS','Static asset binding missing');
          assert(wrangler.assets?.run_worker_first?.includes('/*'),'All SPA/API routes must execute the auth gateway first');
          assert(wrangler.vars?.AUTH_ENFORCED==='auto','Member access must use safe automatic activation');
          assert(String(wrangler.vars?.AUTH_SERVICE_URL||'').startsWith('https://'),'Authorization service URL missing');
          assert(String(wrangler.vars?.AUTH_PORTAL_URL||'').includes('/member'),'Member login portal URL missing');
          assert(!wrangler.r2_buckets,'R2 must not be a production dependency in strict R0 mode');

          const gateway=read('worker/src/auth-gateway.js');
          assert(gateway.includes("import r0Worker from './r0-entry.js'"),'Auth gateway must delegate authorized requests to R0 runtime');
          for(const marker of ['/api/auth/status','/api/auth/exchange','/api/auth/introspect-transfer','/api/auth/introspect-session','authentication_required','member_auth_enforced','serviceReachable: false','clientFingerprint']) assert(gateway.includes(marker),`Member gateway missing ${marker}`);
          assert(gateway.includes('an auth-service outage must never turn a private program public'),'Auth outage must fail closed');
          assert(gateway.includes("'/api/internal/state/'"),'Collector ingestion must remain reachable through its existing token auth');
          assert(gateway.includes("'/api/mt5/batch'"),'MT5 ingestion must remain reachable through its existing token auth');

          const security=read('worker/src/security.js');
          for(const marker of ['BLOCKED_METHODS','strict-transport-security',"frame-ancestors 'none'",'security_rate_limits','origin_mismatch']) assert(security.includes(marker),`Security gateway missing ${marker}`);

          const entry=read('worker/src/r0-entry.js');
          assert(entry.includes("import coreWorker from './index.js'"),'R0 compatibility entry must delegate to core Worker');
          for(const route of ['/api/dashboard','/api/analysis','/api/session-signals','/api/live','/api/fred/catalog','/api/technical']) assert(entry.includes(route),`Required R0 compatibility route missing: ${route}`);
          assert(entry.includes('WebSocketPair'),'R0 live status must remain Worker WebSocket based');

          const core=read('worker/src/index.js');
          for(const route of ['/api/health','/api/gemini/health','/api/gemini/chat','/api/gemini/chat-stream','/api/mt5/batch','/api/internal/state/']) assert(core.includes(route),`Required R0 core route missing: ${route}`);
          assert(core.includes('googleCloudRuntime:false'),'Health must explicitly report Google Cloud runtime disabled');
          assert(core.includes('GEMINI_API_KEY'),'Gemini must remain server-side');
          assert(core.includes('env.DB'),'Core runtime must use D1');

          const schema=read('worker/schema.sql');
          for(const table of ['state_snapshots','gemini_cache','mt5_batches','runtime_meta','security_rate_limits','security_events']) assert(schema.includes(table),`D1 schema missing ${table}`);
          assert(read('src/google-cloud-routing.ts').includes('same-origin'),'Browser API routing must remain same-origin');
          assert(read('vite.config.ts').includes('sourcemap: false'),'Production source maps must remain disabled');

          const deploy=read('.github/workflows/deploy-cloudflare-static.yml');
          for(const marker of ['worker/src/auth-gateway.js','AUTH_ENFORCED','/api/auth/status','fail-closed','Cloudflare D1 Free','GEMINI_API_KEY','TRACE must be rejected']) assert(deploy.includes(marker),`Deployment workflow missing ${marker}`);

          const collectors=read('.github/workflows/r0-free-market-collector.yml');
          assert(collectors.includes("cron: '*/15 * * * *'"),'Market collector must run every 15 minutes');
          assert(collectors.includes("cron: '17 * * * *'"),'Macro collector must run hourly');
          assert(collectors.includes('scripts/r0-collect-market.mjs'),'Market collector script not wired');
          assert(collectors.includes('scripts/r0-collect-macro.mjs'),'Macro collector script not wired');

          const marketScript=read('scripts/r0-collect-market.mjs');
          const macroScript=read('scripts/r0-collect-macro.mjs');
          for(const script of [marketScript,macroScript]) {
            assert(script.includes('/api/internal/state/'),'Collectors must ingest through authenticated Worker state route');
            assert(script.includes('FXGA_INGEST_TOKEN')||script.includes('FXGA_MT5_REPORT_SECRET'),'Collector ingestion authentication missing');
          }
          assert(marketScript.includes('firestoreDependency:false'),'Market collector must report Firestore disabled');
          assert(macroScript.includes('FRED_BASE_IDS'),'Macro collector must reuse FXGA FRED universe');
          assert(macroScript.includes('fredgraph.csv'),'Macro collector must retain public FRED fallback');
          assert(macroScript.includes("'fred-public-csv-fallback'"),'Macro collector must report fallback transport');

          const macroProductionWorkflows=[
            '.github/workflows/deploy-cloudflare-static.yml',
            '.github/workflows/r0-free-market-collector.yml',
          ];
          const forbidden=['google-github-actions/auth','google-github-actions/setup-gcloud','gcloud run deploy','gcloud scheduler jobs create','gcloud scheduler jobs update','gcloud tasks'];
          const violations=[];
          for(const file of macroProductionWorkflows){
            const text=read(file);
            for(const marker of forbidden) if(text.includes(marker)) violations.push(`${file}: ${marker}`);
          }
          assert(!violations.length,`Macro production runtime reintroduced Google Cloud infrastructure:\n${violations.join('\n')}`);

          console.log('PASS: FXGA R0 architecture + fail-closed owner-approved member access verified');
          console.log('Public: health and authenticated collector ingestion only');
          console.log('Protected: dashboard SPA, analysis APIs, realtime WebSocket, Gemini member features');
          console.log('Security: fail-closed auth, browser-bound sessions, edge rate limits, CSRF/origin controls and hardened headers');
          console.log('Macro compute: Cloudflare Workers; data: Cloudflare D1; AI: Gemini retained');
          NODE
