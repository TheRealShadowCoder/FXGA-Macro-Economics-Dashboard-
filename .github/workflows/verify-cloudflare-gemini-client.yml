name: Verify Live Cloudflare Gemini Client

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-cloudflare-gemini-client.yml'
  workflow_run:
    workflows: ['Deploy FXGA Cloudflare Static Website']
    types: [completed]

permissions:
  contents: read
  statuses: write

env:
  SITE_URL: https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev
  API_BASE: https://fxga-macro-dashboard-kbjj66blka-uc.a.run.app
  STATUS_CONTEXT: fxga/cloudflare-gemini-client

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Verify live frontend contains hardened Gemini client
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          post_status(){
            local state="$1" description="$2" payload
            description="$(printf '%s' "$description" | tr '\r\n' ' ' | cut -c1-140)"
            payload="$(jq -nc --arg state "$state" --arg context "$STATUS_CONTEXT" --arg description "$description" --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null
          }
          post_status pending 'Waiting for hardened Gemini browser client on Cloudflare'

          ok=0
          for attempt in $(seq 1 80); do
            echo "Cloudflare verification attempt ${attempt}/80"
            if curl -fsS --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "${SITE_URL}/?v=${GITHUB_RUN_ID}-${attempt}" -o /tmp/root.html; then
              asset="$(grep -oE 'src="[^"]+/assets/[^" ]+\.js"' /tmp/root.html | head -1 | sed -E 's/^src="//;s/"$//' || true)"
              if [ -z "$asset" ]; then
                asset="$(grep -oE '/assets/[^" ]+\.js' /tmp/root.html | head -1 || true)"
              fi
              if [ -n "$asset" ]; then
                [[ "$asset" == http* ]] && js_url="$asset" || js_url="${SITE_URL}${asset}"
                if curl -fsS --connect-timeout 10 --max-time 45 -H 'Cache-Control: no-cache' "${js_url}?v=${GITHUB_RUN_ID}-${attempt}" -o /tmp/app.js; then
                  has_api=0; has_fallback=0
                  grep -F "$API_BASE" /tmp/app.js >/dev/null && has_api=1 || true
                  grep -F 'compatibility-fallback' /tmp/app.js >/dev/null && has_fallback=1 || true
                  echo "asset=${asset} has_api=${has_api} has_fallback=${has_fallback} bytes=$(wc -c </tmp/app.js)"
                  if [ "$has_api" -eq 1 ] && [ "$has_fallback" -eq 1 ]; then ok=1; break; fi
                fi
              fi
            fi
            sleep 4
          done

          if [ "$ok" -ne 1 ]; then
            post_status failure 'Cloudflare still does not serve the hardened Gemini browser client'
            exit 1
          fi

          curl -fsS --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "${SITE_URL}/fxga-build.json?v=${GITHUB_RUN_ID}" -o /tmp/build.json
          jq . /tmp/build.json
          post_status success 'Cloudflare serves absolute Cloud Run Gemini routing + transient 502 recovery'
          echo 'HARDENED_GEMINI_CLIENT_LIVE=true'
