name: Revoke Exposed Telegram User Session

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/revoke-exposed-telegram-session.yml'

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: fxglobalavengerstradingacademy
  DEPLOY_SERVICE_ACCOUNT: fxga-github-deployer@fxglobalavengerstradingacademy.iam.gserviceaccount.com
  TELEGRAM_API_ID_SECRET: fxga-telegram-api-id
  TELEGRAM_API_HASH_SECRET: fxga-telegram-api-hash
  TELEGRAM_SESSION_SECRET: fxga-telegram-session

jobs:
  revoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - id: config
        name: Resolve Google authentication
        env:
          WIF_PROVIDER_SECRET: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_PROVIDER_VAR: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          set -euo pipefail
          WIF_PROVIDER="${WIF_PROVIDER_SECRET:-$WIF_PROVIDER_VAR}"
          test -n "$WIF_PROVIDER" || { echo '::error::GCP_WIF_PROVIDER is missing'; exit 1; }
          echo "wif_provider=$WIF_PROVIDER" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Load MTProto session into environment without printing it
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID"
          printf 'TELEGRAM_API_ID<<EOF\n%s\nEOF\n' "$(gcloud secrets versions access latest --secret="$TELEGRAM_API_ID_SECRET")" >> "$GITHUB_ENV"
          printf 'TELEGRAM_API_HASH<<EOF\n%s\nEOF\n' "$(gcloud secrets versions access latest --secret="$TELEGRAM_API_HASH_SECRET")" >> "$GITHUB_ENV"
          printf 'TELEGRAM_SESSION<<EOF\n%s\nEOF\n' "$(gcloud secrets versions access latest --secret="$TELEGRAM_SESSION_SECRET")" >> "$GITHUB_ENV"

      - name: Install agent dependencies
        working-directory: agents/telegram-member-agent
        run: npm install --omit=dev --no-audit --no-fund

      - name: Revoke exposed Telegram user session
        working-directory: agents/telegram-member-agent
        env:
          TELEGRAM_SESSION: ${{ env.TELEGRAM_SESSION }}
          TELEGRAM_API_ID: ${{ env.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ env.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { Api, TelegramClient } from 'teleproto';
          import { StringSession } from 'teleproto/sessions/index.js';
          const client = new TelegramClient(new StringSession(process.env.TELEGRAM_SESSION), Number(process.env.TELEGRAM_API_ID), process.env.TELEGRAM_API_HASH, { connectionRetries: 3 });
          try {
            await client.connect();
            if (!(await client.checkAuthorization())) throw new Error('Session is already unauthorized.');
            await client.invoke(new Api.auth.LogOut());
            console.log('Exposed MTProto user session revoked successfully.');
          } finally {
            await client.disconnect().catch(() => {});
          }
          NODE

      - name: Replace Secret Manager session with revoked marker
        run: |
          set -euo pipefail
          printf '%s' 'REVOKED_AFTER_CREDENTIAL_EXPOSURE' | gcloud secrets versions add "$TELEGRAM_SESSION_SECRET" --data-file=- >/dev/null
          echo 'Secret Manager MTProto session slot marked revoked; a new session must be configured.'
