name: Verify V4.15 Research Source Ready

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-v415-source-ready.trigger'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify source contracts
        run: |
          set -euo pipefail
          grep -q "buildEventReactionResearch" cloud-run-collector/src/super-economist.js
          grep -q "buildPolicyPathResearch" cloud-run-collector/src/super-economist.js
          grep -q "eventStudies:eventStudyPayload" cloud-run-collector/src/super-runtime.js
          grep -q "get('event-studies')" cloud-run-collector/src/super-runtime.js
          grep -q "eventReactionResearch" src/components/ResearchView.tsx
          grep -q "policyPathResearch" src/components/ResearchView.tsx
          grep -q "PolicyEventResearchPanel" src/components/ResearchView.tsx
      - name: Verify collector syntax and security
        run: |
          cd cloud-run-collector
          npm ci --ignore-scripts
          npm run check
          npm audit --audit-level=moderate
      - name: Verify research model invariants
        run: |
          cd cloud-run-collector
          node --input-type=module <<'NODE'
          import { buildEventReactionResearch } from './src/event-reaction-research.js';
          import { buildPolicyPathResearch } from './src/policy-path-research.js';
          const measured=(agreement,move)=>({quality:'measured',directionalAgreement:agreement,meanBaseCurrencyMovePct:move});
          const now=new Date(),studies=Array.from({length:10},(_,i)=>({eventId:`study-${i}`,event:i%2?'Nonfarm Payrolls':'Consumer Price Index',category:i%2?'employment':'inflation',currency:'USD',importance:3,releaseAt:new Date(now.getTime()-(i+1)*86400000).toISOString(),horizons:{'5m':measured(.66,.03),'15m':measured(.69,.05),'1h':measured(.72,.07),'4h':measured(i===9 ? .44 : .64,.06)}}));
          const reactions=buildEventReactionResearch({studies},now);
          if(reactions.studyCount!==10||!reactions.byCurrency.USD||!reactions.byCategory.inflation||!reactions.byCategory.labour)throw new Error('Event reaction source contract failed');
          const dims=(g,i,l,p,f)=>[{id:'growth',score:g},{id:'inflation',score:i},{id:'labour',score:l},{id:'policy',score:p},{id:'financial',score:f}];
          const economies=[['USA','USD','Federal Reserve'],['EUROPE','EUR','ECB'],['UK','GBP','BoE'],['SOUTH_AFRICA','ZAR','SARB'],['JAPAN','JPY','BoJ']].map(([id,currency,centralBank],i)=>({id,currency,centralBank,policyStance:'balanced',confidence:80-i*2,observationCount:35-i,dimensions:dims(15-i,30+i*2,18+i,15+i,8)}));
          const policy=buildPolicyPathResearch({economies},[],now);
          if(policy.economies.length!==5||policy.marketPricingAvailable!==false||policy.type!=='model-implied-policy-path')throw new Error('Policy path source contract failed');
          for(const row of policy.economies){const sum=row.probabilities.hike+row.probabilities.hold+row.probabilities.cut;if(Math.abs(sum-1)>.002)throw new Error(`${row.currency} policy probabilities invalid`);}
          console.log(JSON.stringify({reactionStudies:reactions.studyCount,globalAgreement:reactions.global.agreement,policyBanks:policy.economies.length},null,2));
          NODE
      - name: Verify production frontend build
        run: |
          cd "$GITHUB_WORKSPACE"
          npm install
          npm audit --audit-level=moderate
          npm run build
      - name: Persist readiness marker
        run: |
          cat > .github/intelligence-v415-source-ready.status <<EOF
          verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          contract=v4.15-research-source
          event_reaction_research=passed
          policy_path_research=passed
          event_study_refresh_plumbing=passed
          policy_event_ui=passed
          collector_check=passed
          dependency_audit=passed
          frontend_build=passed
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/intelligence-v415-source-ready.status
          git commit -m 'Verify v4.15 research source readiness'
          git pull --rebase origin main
          git push origin HEAD:main
