name: Verify V4.14 Public Intelligence Contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-v414-public-contract.trigger'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Poll public production intelligence
        run: |
          node <<'NODE'
          const fs=require('fs');
          const base='https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const required=['reactionFunctionGap','crossAsset','causalTransmission','counterfactual','temporalIntelligence','transitionRisk','structuralBreak','evidenceIndependence','evidenceCompleteness','scenarioRobustness','historicalCalibration','horizonCalibration','decisionChange','historicalAnalogues','uncertainty','premortem','thesis','final'];
          let last;
          for(let attempt=0;attempt<60;attempt++){
            try{
              const [healthRes,researchRes]=await Promise.all([
                fetch(base+'/api/health',{headers:{Accept:'application/json','Cache-Control':'no-cache'}}),
                fetch(base+'/api/research',{headers:{Accept:'application/json','Cache-Control':'no-cache'}})
              ]);
              const healthText=await healthRes.text(),researchText=await researchRes.text();
              if(!healthRes.ok)throw new Error(`health ${healthRes.status}: ${healthText.slice(0,300)}`);
              if(!researchRes.ok)throw new Error(`research ${researchRes.status}: ${researchText.slice(0,300)}`);
              const health=JSON.parse(healthText),research=JSON.parse(researchText),core=research?.decisionCore,pairs=core?.pairDecisions||[];
              if(pairs.length<8)throw new Error(`expected >=8 governed pairs, got ${pairs.length}`);
              for(const pair of pairs)for(const field of required)if(pair?.[field]===undefined)throw new Error(`${pair?.symbol||'pair'} missing ${field}`);
              if(!core?.crossPairConsistency?.checks?.length)throw new Error('cross-pair consistency missing');
              if(!core?.portfolioInteraction?.pairControls)throw new Error('portfolio interaction missing');
              if(!research?.structuralBreaks?.series)throw new Error('structural-break research missing');
              if(!research?.evidenceIndependence)throw new Error('evidence-independence research missing');
              if(!research?.turningPoints?.rows)throw new Error('turning-point research missing');
              if(!research?.catalystSequence?.currencies)throw new Error('catalyst sequencing missing');
              if(!Array.isArray(research?.releaseAnalytics?.persistence))throw new Error('surprise persistence missing');
              if(!research?.decisionMemory?.decisionChanges||!research?.decisionMemory?.analogueLibrary)throw new Error('decision memory intelligence missing');
              const calibrated=(research?.forecasts||[]).filter(x=>x?.modelWeights&&Number(x?.validationPoints||0)>0);
              const distributed=calibrated.filter(x=>x?.distribution&&Number(x.distribution.residualCount||0)>0);
              if(!calibrated.length)throw new Error('walk-forward forecasts missing');
              if(!distributed.length)throw new Error('distributional forecasts missing');
              const report={
                verifiedAt:new Date().toISOString(),
                collectorMode:health.collectorMode||null,
                pairs:pairs.length,
                evidenceQuality:core.evidenceQuality?.score??null,
                modelHealth:research.modelHealth?.status??null,
                sourceReliability:research.sourceReliability?.length||0,
                calibratedForecasts:calibrated.length,
                distributedForecasts:distributed.length,
                structuralBreakSeries:research.structuralBreaks.series.length,
                turningFamilies:research.turningPoints.rows.length,
                evidenceIndependence:research.evidenceIndependence.independenceRatio,
                triangleChecks:core.crossPairConsistency.checks.length,
                triangleConflicts:core.crossPairConsistency.conflicts||0,
                portfolioVetoes:Number(core.portfolioInteraction.concentrationVetoes||0)+Number(core.portfolioInteraction.triangleVetoes||0),
                decisionMemorySamples:research.decisionMemory.sampledDecisions||0,
                analogueSymbols:Object.keys(research.decisionMemory.analogueLibrary||{}).length
              };
              fs.writeFileSync('/tmp/v414-public.json',JSON.stringify(report,null,2));
              console.log(JSON.stringify(report,null,2));
              process.exit(0);
            }catch(error){last=error;console.log(`attempt ${attempt+1}: ${error.message}`);}
            await sleep(5000);
          }
          throw last||new Error('public contract verification timed out');
          NODE
      - name: Persist public verification marker
        run: |
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/v414-public.json','utf8'));
          const lines=[
            `verified_at=${x.verifiedAt}`,
            'contract=v4.14.1-public',
            `pairs=${x.pairs}`,
            `evidence_quality=${x.evidenceQuality}`,
            `model_health=${x.modelHealth}`,
            `source_reliability=${x.sourceReliability}`,
            `calibrated_forecasts=${x.calibratedForecasts}`,
            `distributed_forecasts=${x.distributedForecasts}`,
            `structural_break_series=${x.structuralBreakSeries}`,
            `turning_families=${x.turningFamilies}`,
            `evidence_independence=${x.evidenceIndependence}`,
            `triangle_checks=${x.triangleChecks}`,
            `triangle_conflicts=${x.triangleConflicts}`,
            `portfolio_vetoes=${x.portfolioVetoes}`,
            `decision_memory_samples=${x.decisionMemorySamples}`,
            `analogue_symbols=${x.analogueSymbols}`,
            'public_contract=passed'
          ];
          fs.writeFileSync('.github/intelligence-v414-public.status',lines.join('\n')+'\n');
          NODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/intelligence-v414-public.status
          git commit -m 'Verify public v4.14.1 intelligence contract'
          git pull --rebase origin main
          git push origin HEAD:main
