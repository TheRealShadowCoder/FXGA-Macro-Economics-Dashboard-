name: Record FRED Coverage Refresh Status

on:
  workflow_run:
    workflows: ['Refresh FRED Coverage After Collector Deploy']
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Write FRED refresh status
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          mkdir -p runtime
          node <<'NODE'
          const fs=require('fs');
          const payload={schema:'fxga.fred.coverage-refresh-status.v1',recordedAt:new Date().toISOString(),conclusion:process.env.CONCLUSION||null,runId:Number(process.env.RUN_ID||0)||null,runUrl:process.env.RUN_URL||null,headSha:process.env.HEAD_SHA||null};
          fs.writeFileSync('runtime/fred-coverage-refresh-status.json',JSON.stringify(payload,null,2)+'\n');
          console.log(JSON.stringify(payload,null,2));
          NODE
      - name: Publish status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/fred-coverage-refresh-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record FRED coverage refresh status [skip ci]'
          git push origin HEAD:main
