name: Diagnose V4.16 Public Only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-diagnose-v416-public-only.trigger'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Capture public v4.16 state
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const base='https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev';
          async function get(path){const r=await fetch(base+path,{headers:{Accept:'application/json','Cache-Control':'no-cache'}}),t=await r.text();let j=null;try{j=JSON.parse(t)}catch{}return {status:r.status,json:j,text:j?null:t.slice(0,300)}}
          const [research,health]=await Promise.all([get('/api/research'),get('/api/health')]);
          const core=research.json?.decisionCore,pairs=core?.pairDecisions||[],policy=research.json?.policyPathResearch,attr=research.json?.decisionQualityAttribution;
          const out={generatedAt:new Date().toISOString(),researchStatus:research.status,healthStatus:health.status,collectorMode:health.json?.collectorMode??null,coreVersion:core?.version??null,pairCount:pairs.length,withCalibration:pairs.filter(x=>x?.eventReactionCalibration).length,activeCalibrations:pairs.filter(x=>x?.eventReactionCalibration?.available).length,factors:pairs.map(x=>({symbol:x.symbol,factor:x?.eventReactionCalibration?.factor??null,exposure:x?.eventReactionCalibration?.releaseExposure??null,status:x?.eventReactionCalibration?.status??null})),policyBanks:policy?.economies?.length??0,policyTreeDepths:(policy?.economies||[]).map(x=>x?.sequenceTree?.depth??null),policyWindowCounts:(policy?.economies||[]).map(x=>x?.sequenceTree?.decisionWindows?.length??0),marketPricingAvailable:policy?.marketPricingAvailable??null,attributionSamples:attr?.sampledRealizedStates??null,attributionMethodology:String(attr?.methodology||'').slice(0,260),safety:health.json?.safety??null};
          fs.writeFileSync('.github/v416-public-only-diagnostic.json',JSON.stringify(out,null,2)+'\n');console.log(JSON.stringify(out,null,2));
          NODE
      - name: Persist diagnostic
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/v416-public-only-diagnostic.json
          git commit -m 'Record public v4.16 intelligence state'
          git pull --rebase origin main
          git push origin HEAD:main
