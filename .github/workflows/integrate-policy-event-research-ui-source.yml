name: Integrate Policy Event Research UI Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-integrate-policy-event-research-ui-source.trigger'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Apply UI source patch
        run: python3 scripts/apply_policy_event_research_ui.py
      - name: Verify integration anchors
        run: |
          grep -q "PolicyEventResearchPanel" src/components/ResearchView.tsx
          grep -q "eventReactionResearch" src/components/ResearchView.tsx
          grep -q "policyPathResearch" src/components/ResearchView.tsx
      - name: Commit UI source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/ResearchView.tsx
          if git diff --cached --quiet; then echo 'UI source already integrated.'; exit 0; fi
          git commit -m 'Integrate release reaction and policy path research UI'
          git pull --rebase origin main
          git push origin HEAD:main
