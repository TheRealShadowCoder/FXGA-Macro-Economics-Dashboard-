name: Decommission Legacy Cloudflare Worker

on:
  workflow_run:
    workflows: ['Deploy FXGA Google Cloud Application']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 4f260a0775a3df407e08512610c9898b
  LEGACY_WORKER_NAME: fxga-macro-intelligence-dashboard

jobs:
  decommission:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require decommission credential
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo '::error::CLOUDFLARE_API_TOKEN is required once to decommission the legacy Worker'; exit 1; }

      - name: Delete legacy Worker script
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          URL="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$LEGACY_WORKER_NAME"
          CODE=$(curl -sS -o /tmp/delete.json -w '%{http_code}' -X DELETE -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' "$URL")
          echo "Cloudflare legacy Worker delete HTTP $CODE"
          if [ "$CODE" = "200" ] || [ "$CODE" = "204" ] || [ "$CODE" = "404" ]; then
            cat /tmp/delete.json || true
            exit 0
          fi
          cat /tmp/delete.json
          exit 1

      - name: Confirm production architecture
        run: |
          echo 'Legacy Cloudflare Worker decommission request completed.'
          echo 'FXGA production application and API now target Google Cloud Run only.'
