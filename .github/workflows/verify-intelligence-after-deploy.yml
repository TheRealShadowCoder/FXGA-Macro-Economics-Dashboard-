name: Verify Intelligence After Google Cloud Collector Deploy

on:
  workflow_run:
    workflows: ['Deploy FXGA Google Cloud Collector']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  COLLECTOR_SERVICE: fxga-macro-collector
  APP_SERVICE: fxga-macro-dashboard
  GCP_PROJECT_ID: fxglobalavengerstradingacademy
  GCP_REGION: us-central1
  DEPLOY_SERVICE_ACCOUNT: fxga-github-deployer@fxglobalavengerstradingacademy.iam.gserviceaccount.com

jobs:
  verify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: config
        name: Resolve Google Cloud authentication
        env:
          WIF_PROVIDER_SECRET: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_PROVIDER_VAR: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          WIF_PROVIDER="${WIF_PROVIDER_SECRET:-$WIF_PROVIDER_VAR}"
          test -n "$WIF_PROVIDER" || { echo '::error::GCP_WIF_PROVIDER is missing'; exit 1; }
          echo "wif_provider=$WIF_PROVIDER" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: services
        name: Resolve Google Cloud services
        run: |
          gcloud config set project "$GCP_PROJECT_ID"
          COLLECTOR_URL=$(gcloud run services describe "$COLLECTOR_SERVICE" --region "$GCP_REGION" --format='value(status.url)')
          APP_URL=$(gcloud run services describe "$APP_SERVICE" --region "$GCP_REGION" --format='value(status.url)')
          test -n "$COLLECTOR_URL" || { echo '::error::Private Google Cloud collector missing'; exit 1; }
          test -n "$APP_URL" || { echo '::error::Public Google Cloud application missing'; exit 1; }
          echo "collector_url=$COLLECTOR_URL" >> "$GITHUB_OUTPUT"
          echo "COLLECTOR_URL=$COLLECTOR_URL" >> "$GITHUB_ENV"
          echo "APP_URL=$APP_URL" >> "$GITHUB_ENV"

      - id: invoke
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.services.outputs.collector_url }}
          id_token_include_email: true

      - name: Verify private Google Cloud collector, providers and intelligence
        env:
          TOKEN: ${{ steps.invoke.outputs.id_token }}
        run: |
          set -euo pipefail
          req(){
            local name="$1" method="$2" path="$3" body="${4:-}" status
            if [ -z "$body" ]; then body='{}'; fi
            if [ "$method" = POST ]; then
              status=$(curl --max-time 300 -sS -o "/tmp/${name}.json" -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' --data "$body" "$COLLECTOR_URL$path")
            else
              status=$(curl --max-time 120 -sS -o "/tmp/${name}.json" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$COLLECTOR_URL$path")
            fi
            echo "$name HTTP $status"
            if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then cat "/tmp/${name}.json" | head -c 1800; exit 1; fi
          }
          req health GET /health
          req market POST /market-sync '{}'
          req intelligence POST /refresh-intelligence '{"forceNews":false}'
          req state GET /state
          node <<'NODE'
          const fs=require('fs');
          const health=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          if(!health.ok)throw new Error('Production collector health is not OK');
          if(health.architecture!=='google-cloud-only-acquisition-and-intelligence')throw new Error(`Collector architecture is not Google Cloud only: ${health.architecture}`);
          const requiredProviders=['alpha_vantage','twelve_data','finnhub','marketstack','fmp','nasdaq_data_link'];
          const providers=health?.freeTierMarketData?.providers||{};
          const missing=requiredProviders.filter(id=>providers[id]?.configured!==true);
          if(missing.length)throw new Error(`Market-data secrets not mounted: ${missing.join(', ')}`);
          const state=JSON.parse(fs.readFileSync('/tmp/state.json','utf8'));
          const intel=state?.intelligence?.payload,core=intel?.decisionGovernance,research=intel?.research,pairs=core?.pairDecisions||[];
          if(!intel||!core||!research)throw new Error('Intelligence state missing');
          if(pairs.length<8)throw new Error(`Decision governance coverage incomplete: ${pairs.length} pairs`);
          const required=['bayesian','refined','causalTransmission','counterfactual','temporalIntelligence','transitionRisk','evidenceIndependence','scenarioRobustness','modelHealth','historicalCalibration','uncertainty','premortem','thesis','final'];
          for(const pair of pairs)for(const field of required)if(pair?.[field]===undefined)throw new Error(`${pair?.symbol||'pair'} missing ${field}`);
          if(!Array.isArray(core?.crossPairConsistency?.checks)||core.crossPairConsistency.checks.length<3)throw new Error('Cross-pair triangular consistency missing');
          if(!core?.portfolioInteraction?.pairControls)throw new Error('Portfolio interaction governance missing');
          if(!research?.modelHealth||!Array.isArray(research?.sourceReliability))throw new Error('Research model/source health missing');
          if(!research?.evidenceIndependence||!research?.turningPoints||!research?.catalystSequence)throw new Error('Research governance layers missing');
          if(!Array.isArray(research?.releaseAnalytics?.persistence))throw new Error('Release persistence missing');
          if(!intel.decisionMemory||typeof intel.decisionMemory!=='object')throw new Error('Decision memory summary missing');
          console.log(JSON.stringify({serviceVersion:health.version,architecture:health.architecture,pairs:pairs.length,configuredProviders:requiredProviders,evidenceQuality:core.evidenceQuality?.score,sourceReliability:research.sourceReliability.length,decisionMemorySamples:intel.decisionMemory.sampledDecisions||0},null,2));
          NODE

      - name: Verify public Google Cloud research propagation
        run: |
          node <<'NODE'
          const base=process.env.APP_URL,sleep=ms=>new Promise(r=>setTimeout(r,ms));
          let last;
          for(let attempt=0;attempt<30;attempt++){
            try{
              const healthResponse=await fetch(base+'/api/health',{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
              const healthText=await healthResponse.text();
              if(!healthResponse.ok)throw new Error(`/api/health ${healthResponse.status}: ${healthText.slice(0,500)}`);
              const health=JSON.parse(healthText);
              if(health.architecture!=='google-cloud-only'||health.cloudflareProcessing!==false)throw new Error('Public service is not Google Cloud only');
              const response=await fetch(base+'/api/research',{headers:{Accept:'application/json','Cache-Control':'no-cache'}});
              const text=await response.text();
              if(!response.ok)throw new Error(`/api/research ${response.status}: ${text.slice(0,500)}`);
              const research=JSON.parse(text),core=research?.decisionCore,pairs=core?.pairDecisions||[];
              const ok=pairs.length>=8&&pairs.every(p=>p?.causalTransmission&&p?.counterfactual&&p?.temporalIntelligence&&p?.transitionRisk&&p?.evidenceIndependence&&p?.historicalCalibration);
              if(ok&&core?.crossPairConsistency?.checks?.length>=3&&core?.portfolioInteraction?.pairControls&&research?.modelHealth&&research?.decisionMemory){
                console.log('GOOGLE CLOUD PUBLIC INTELLIGENCE VERIFIED',JSON.stringify({pairs:pairs.length,modelHealth:research.modelHealth.status,decisionMemorySamples:research.decisionMemory.sampledDecisions||0}));
                process.exit(0);
              }
              last=new Error('Google Cloud public research state has not received the current governed intelligence snapshot yet');
            }catch(error){last=error;}
            await sleep(4000);
          }
          throw last||new Error('Google Cloud public research contract did not update');
          NODE
