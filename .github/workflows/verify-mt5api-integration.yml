name: Verify dceoy MT5API Integration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'integrations/mt5api/**'
      - '.github/workflows/verify-mt5api-integration.yml'
  pull_request:
    paths:
      - 'integrations/mt5api/**'
      - '.github/workflows/verify-mt5api-integration.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      UPSTREAM_SHA: ea2ed8fdf53e2a765a50e24b7f74700e03b3e378
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Compile bridge
        run: python -m py_compile integrations/mt5api/fxga_mt5api_bridge.py

      - name: Run deterministic bridge and broker-profile tests
        run: python -m unittest discover -s integrations/mt5api/tests -p 'test_*.py' -v

      - name: Validate configuration JSON
        run: |
          python -m json.tool integrations/mt5api/config.example.json >/dev/null
          python -m json.tool integrations/mt5api/broker-symbol-profiles.json >/dev/null

      - name: Parse PowerShell setup scripts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $files=@(
            'integrations/mt5api/install-windows.ps1',
            'integrations/mt5api/start-mt5api.ps1',
            'integrations/mt5api/start-fxga-bridge.ps1',
            'integrations/mt5api/test-mt5api.ps1',
            'integrations/mt5api/apply-deriv-symbol-map.ps1',
            'integrations/mt5api/apply-broker-symbol-map.ps1'
          )
          foreach($file in $files){
            $tokens=$null; $errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors) | Out-Null
            if($errors.Count){ $errors | ForEach-Object { Write-Error "${file}: $($_.Message)" }; exit 1 }
          }

      - name: Verify pinned upstream commit exists
        run: |
          set -euo pipefail
          rm -rf /tmp/fxga-mt5api-upstream
          git init -q /tmp/fxga-mt5api-upstream
          git -C /tmp/fxga-mt5api-upstream fetch -q --depth 1 https://github.com/dceoy/mt5api.git "$UPSTREAM_SHA"
          test "$(git -C /tmp/fxga-mt5api-upstream rev-parse FETCH_HEAD)" = "$UPSTREAM_SHA"

      - name: Integration policy check
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          root=Path('integrations/mt5api')
          launcher=(root/'start-mt5api.ps1').read_text(encoding='utf-8')
          bridge=(root/'fxga_mt5api_bridge.py').read_text(encoding='utf-8')
          profiles=json.loads((root/'broker-symbol-profiles.json').read_text(encoding='utf-8'))
          assert '127.0.0.1' in launcher, 'mt5api must stay bound to localhost'
          assert 'FXGA_MT5_TOKEN' in bridge, 'cloud ingress token must come from environment'
          assert 'dceoy/mt5api' in bridge, 'producer provenance missing'
          assert profiles.get('policy',{}).get('matching') == 'exact-terminal-symbol-only'
          forbidden={'SPXS.US','DOW.N'}
          aliases={str(a).upper() for p in profiles['brokers'].values() for vals in p['symbols'].values() for a in vals}
          assert forbidden.isdisjoint(aliases), f'known false broker aliases present: {forbidden & aliases}'
          secret_pattern=re.compile(r'(?i)(password|api[_-]?key|token)\s*=\s*["\'][^"\']{12,}["\']')
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() in {'.md','.json'}:
                  continue
              text=path.read_text(encoding='utf-8',errors='ignore')
              if secret_pattern.search(text):
                  raise SystemExit(f'Potential plaintext secret detected: {path}')
          print('mt5api integration policy checks passed')
          PY
