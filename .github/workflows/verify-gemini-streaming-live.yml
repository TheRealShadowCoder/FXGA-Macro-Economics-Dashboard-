name: Verify FXGA Gemini Streaming Live

on:
  workflow_run:
    workflows: ["Deploy FXGA R0 Cloudflare Runtime"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fxga-gemini-streaming-live
  cancel-in-progress: true

env:
  FXGA_API_BASE: https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev

jobs:
  smoke-test:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify R0 Gemini health contract
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.FXGA_API_BASE;
          for (const path of ['/api/health','/api/gemini/health','/api/gemini/intelligence-health']) {
            const response = await fetch(base + path, { headers: { Accept: 'application/json', 'Cache-Control': 'no-cache' }, cache: 'no-store' });
            if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
            const body = await response.json();
            if (path === '/api/health') {
              if (body.architecture !== 'cloudflare-r0') throw new Error('R0 architecture health mismatch');
              if (body.googleCloudRuntime !== false) throw new Error('Google Cloud runtime must remain disabled');
              if (body.database !== 'Cloudflare D1 Free') throw new Error('D1 runtime is not active');
            } else if (body.configured !== true) {
              throw new Error(`${path} says Gemini is not configured`);
            }
            console.log(path, JSON.stringify({ architecture: body.architecture, configured: body.configured, model: body.model, promptCount: body.promptCount }));
          }
          NODE

      - name: Exercise one representative SSE request
        if: github.event_name != 'workflow_dispatch'
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.FXGA_API_BASE;
          const response = await fetch(base + '/api/gemini/chat-stream', {
            method: 'POST',
            headers: { Accept: 'text/event-stream', 'Content-Type': 'application/json', 'Cache-Control': 'no-cache' },
            body: JSON.stringify({ task: 'market-brief', question: 'Give a concise FXGA market evidence status. Use stored evidence only and state any missing evidence.' }),
          });
          if (!response.ok) throw new Error(`chat-stream HTTP ${response.status}`);
          const text = await response.text();
          const statusCount = (text.match(/^event: status$/gm) || []).length;
          if (statusCount < 2) throw new Error(`Expected at least 2 status frames, saw ${statusCount}`);
          if (!/^event: delta$/m.test(text)) throw new Error('SSE delta frame missing');
          if (!/^event: done$/m.test(text)) throw new Error('SSE done frame missing');
          if (/^event: error$/m.test(text)) throw new Error('SSE returned an error frame');
          console.log(`R0 Gemini SSE smoke test passed with ${statusCount} status frames.`);
          NODE

      - name: Exercise full FXGA streaming suite manually
        if: github.event_name == 'workflow_dispatch'
        run: node scripts/test-gemini-streaming-live.mjs

      - name: Streaming verification summary
        if: always()
        run: |
          echo '## FXGA Gemini Streaming Live Verification' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Target: Cloudflare R0 Worker /api/gemini/chat-stream' >> "$GITHUB_STEP_SUMMARY"
          echo '- Automatic runs use one representative request to conserve Gemini free quota' >> "$GITHUB_STEP_SUMMARY"
          echo '- Manual dispatch runs the full nine-case FXGA streaming suite' >> "$GITHUB_STEP_SUMMARY"
          echo '- Requires visible status frames, answer delta, completion, and no error frame' >> "$GITHUB_STEP_SUMMARY"
