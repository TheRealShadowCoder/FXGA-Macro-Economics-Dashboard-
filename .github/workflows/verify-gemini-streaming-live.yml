name: Verify FXGA Gemini Streaming Live

on:
  workflow_run:
    workflows: ["Deploy FXGA Google Cloud Application"]
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-gemini-streaming-live.yml"
      - "scripts/test-gemini-streaming-live.mjs"

permissions:
  contents: read
  id-token: write

concurrency:
  group: fxga-gemini-streaming-live
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: fxglobalavengerstradingacademy
  GCP_REGION: us-central1
  SERVICE: fxga-macro-dashboard
  DEPLOY_SERVICE_ACCOUNT: fxga-github-deployer@fxglobalavengerstradingacademy.iam.gserviceaccount.com

jobs:
  smoke-test:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - id: config
        name: Resolve Google authentication
        env:
          WIF_PROVIDER_SECRET: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_PROVIDER_VAR: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          set -euo pipefail
          WIF_PROVIDER="${WIF_PROVIDER_SECRET:-$WIF_PROVIDER_VAR}"
          test -n "$WIF_PROVIDER" || { echo '::error::GCP_WIF_PROVIDER is missing'; exit 1; }
          echo "wif_provider=$WIF_PROVIDER" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Resolve live Cloud Run URL
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID"
          SERVICE_URL="$(gcloud run services describe "$SERVICE" --region "$GCP_REGION" --format='value(status.url)')"
          test -n "$SERVICE_URL" || { echo '::error::Cloud Run service URL could not be resolved'; exit 1; }
          echo "FXGA_API_BASE=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "Testing $SERVICE_URL"

      - name: Verify streaming health contract
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = process.env.FXGA_API_BASE;
          for (const path of ['/api/gemini/health','/api/gemini/intelligence-health']) {
            const response = await fetch(base + path, { headers: { Accept: 'application/json', 'Cache-Control': 'no-cache' } });
            if (!response.ok) throw new Error(`${path} returned HTTP ${response.status}`);
            const body = await response.json();
            if (body.configured !== true) throw new Error(`${path} says Gemini is not configured`);
            console.log(path, JSON.stringify({ configured: body.configured, model: body.model, fallbackModel: body.fallbackModel, reserveModel: body.reserveModel }));
          }
          NODE

      - name: Exercise representative FXGA queries and real SSE typing
        run: node scripts/test-gemini-streaming-live.mjs

      - name: Streaming verification summary
        if: always()
        run: |
          echo '## FXGA Gemini Streaming Live Verification' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Tests real Cloud Run /api/gemini/chat-stream' >> "$GITHUB_STEP_SUMMARY"
          echo '- Requires status/progress events, text deltas, and a completed answer' >> "$GITHUB_STEP_SUMMARY"
          echo '- Covers market, macro, event research, action report, scalp, day-trade, long-term and session tasks' >> "$GITHUB_STEP_SUMMARY"
          echo '- Model fallback/cooldown is visible in emitted SSE phases' >> "$GITHUB_STEP_SUMMARY"
