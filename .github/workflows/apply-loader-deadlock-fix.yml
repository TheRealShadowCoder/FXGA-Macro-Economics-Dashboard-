name: Apply Loader Deadlock Repair

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/apply-loader-deadlock-fix.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply loader repair
        run: python3 scripts/fix_loader_deadlocks.py
      - name: Validate frontend
        run: |
          npm install
          npm run build
      - name: Commit repaired frontend
        run: |
          if git diff --quiet; then
            echo 'Loader repair already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'Fix cancellable view loader deadlocks'
          git pull --rebase origin main
          git push origin HEAD:main
