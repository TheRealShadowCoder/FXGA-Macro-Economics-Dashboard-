name: Apply Structural Break Source Minimal

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-structural-break-minimal.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Apply and diagnose structural break patch
        run: |
          set +e
          mkdir -p /tmp/structural .github
          python3 scripts/apply_structural_break_v2.py > /tmp/structural/patch.log 2>&1
          PATCH_RC=$?
          node --check cloud-run-collector/src/institutional-research.js > /tmp/structural/research-check.log 2>&1
          RESEARCH_RC=$?
          node --check cloud-run-collector/src/decision-intelligence-core.js > /tmp/structural/core-check.log 2>&1
          CORE_RC=$?
          grep -q 'function buildStructuralBreaks' cloud-run-collector/src/institutional-research.js; G1=$?
          grep -q 'function structuralBreakControls' cloud-run-collector/src/decision-intelligence-core.js; G2=$?
          grep -q 'structuralBreak:g.structuralBreak' cloud-run-collector/src/decision-intelligence-core.js; G3=$?
          grep -q "id:'structural-stability'" cloud-run-collector/src/decision-intelligence-core.js; G4=$?
          grep -q 'structuralBreakRisk' cloud-run-collector/src/decision-intelligence-core.js; G5=$?
          CONTRACT_RC=$(( G1 || G2 || G3 || G4 || G5 ))
          {
            echo "generated_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "patch_exit=$PATCH_RC"
            echo "research_syntax_exit=$RESEARCH_RC"
            echo "core_syntax_exit=$CORE_RC"
            echo "contract_exit=$CONTRACT_RC"
            echo '--- patch output ---'
            cat /tmp/structural/patch.log
            echo '--- research syntax output ---'
            cat /tmp/structural/research-check.log
            echo '--- core syntax output ---'
            cat /tmp/structural/core-check.log
          } > .github/structural-break-v2-diagnostic.txt
          echo "$PATCH_RC" > /tmp/structural/patch.rc
          echo "$RESEARCH_RC" > /tmp/structural/research.rc
          echo "$CORE_RC" > /tmp/structural/core.rc
          echo "$CONTRACT_RC" > /tmp/structural/contract.rc
      - name: Persist source or diagnostic
        run: |
          PATCH_RC=$(cat /tmp/structural/patch.rc)
          RESEARCH_RC=$(cat /tmp/structural/research.rc)
          CORE_RC=$(cat /tmp/structural/core.rc)
          CONTRACT_RC=$(cat /tmp/structural/contract.rc)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/structural-break-v2-diagnostic.txt
          if [ "$PATCH_RC" = 0 ] && [ "$RESEARCH_RC" = 0 ] && [ "$CORE_RC" = 0 ] && [ "$CONTRACT_RC" = 0 ]; then
            git add cloud-run-collector/src/institutional-research.js cloud-run-collector/src/decision-intelligence-core.js
            MSG='Integrate structural break regime-shift source'
          else
            MSG='Record structural break v2 integration diagnostic'
          fi
          git commit -m "$MSG"
          git pull --rebase origin main
          git push origin HEAD:main
