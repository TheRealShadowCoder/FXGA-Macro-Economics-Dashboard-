name: Diagnose FXGA Live V4

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/diagnose-live-v4.trigger'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live passive edge state
        run: |
          node <<'NODE'
          const base='https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev';
          async function get(path){const r=await fetch(base+path,{headers:{Accept:'application/json','Cache-Control':'no-cache'}}),t=await r.text();if(!r.ok)throw new Error(`${path} ${r.status}: ${t.slice(0,800)}`);return JSON.parse(t);}
          (async()=>{
            const [edge,intel,signals]=await Promise.all([get('/api/health'),get('/api/super-economist'),get('/api/session-signals')]);
            const h=intel.operationalHealth||{}, failed=(h.sourceChecks||[]).filter(x=>!x.ok);
            console.log('ARCHITECTURE',JSON.stringify({collectorMode:edge.collectorMode,executionLocation:intel.executionLocation,schemaVersion:intel.schemaVersion,cloudflareUpstream:{calendar:edge.safety?.normalStateUpstreamCalendarRequests,fred:edge.safety?.normalStateUpstreamFredRequests,news:edge.safety?.normalStateUpstreamNewsRequests,market:edge.safety?.normalStateUpstreamMarketRequests}}));
            console.log('COLLECTION',JSON.stringify({calendarEvents:h.calendarEvents,macroObservations:h.macroObservations,fredRequested:h.fredRequested,fredLiveFetched:h.fredLiveFetched,fredFailures:h.fredFailures,staleMacroRetained:h.staleMacroRetained,officialNewsItems:h.officialNewsItems,staleNewsRetained:h.staleNewsRetained,economyCounts:h.economyCounts,agesMinutes:h.agesMinutes,status:h.status,criticalIssues:h.criticalIssues}));
            console.log('FAILED_SOURCES',JSON.stringify(failed.map(x=>({id:x.id,layer:x.layer,details:x.details}))));
            console.log('CURRENCY_STATES',JSON.stringify((signals.currencyStates||[]).map(x=>({currency:x.currency,score:x.score,confidence:x.confidence,quality:x.quality,observations:x.observationCount,dimensions:x.dimensionsCovered,policy:x.policyScore,release:x.releaseImpulse,narrative:x.narrativeScore}))));
            console.log('PAIR_DECISIONS',JSON.stringify((signals.rankedOpportunities||[]).map(x=>({symbol:x.symbol,direction:x.direction,score:x.score,threshold:x.threshold,confidence:x.confidence,conviction:x.conviction,risk:x.risk,gate:x.executionGate,structure:x.components?.structuralDivergence,policy:x.components?.policyDivergence,release:x.components?.releaseDivergence,narrative:x.components?.narrativeDivergence,contradictions:x.criticalThinking?.contradictions,probabilities:x.probabilities}))));
            if(edge.collectorMode!=='google-cloud-run-webhook'||intel.executionLocation!=='Google Cloud Run')throw new Error('Google-only acquisition/intelligence architecture is not live');
            for(const k of ['normalStateUpstreamCalendarRequests','normalStateUpstreamFredRequests','normalStateUpstreamNewsRequests','normalStateUpstreamMarketRequests'])if(Number(edge.safety?.[k]??-1)!==0)throw new Error(`${k} must be zero`);
            if(h.macroObservations<100||h.calendarEvents<1||intel.coverage?.eligibleMethods<1)throw new Error('Core collection state incomplete');
            if((signals.rankedOpportunities||[]).length!==8)throw new Error('Eight-pair decision matrix incomplete');
            console.log('DIAGNOSTIC PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
