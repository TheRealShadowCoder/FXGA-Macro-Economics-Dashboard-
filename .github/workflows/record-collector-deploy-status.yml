name: Record Collector Deployment Status

on:
  workflow_run:
    workflows: ['Deploy FXGA Google Cloud Collector']
    types: [completed]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Write deployment status
        env:
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT: ${{ github.event.workflow_run.event }}
        run: |
          mkdir -p runtime
          node <<'NODE'
          const fs=require('fs');
          const payload={
            schema:'fxga.collector.deploy-status.v1',
            recordedAt:new Date().toISOString(),
            conclusion:process.env.CONCLUSION||null,
            runId:Number(process.env.RUN_ID||0)||null,
            runUrl:process.env.RUN_URL||null,
            headSha:process.env.HEAD_SHA||null,
            event:process.env.EVENT||null,
          };
          fs.writeFileSync('runtime/collector-deploy-status.json',JSON.stringify(payload,null,2)+'\n');
          console.log(JSON.stringify(payload,null,2));
          NODE

      - name: Publish deployment status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/collector-deploy-status.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Record collector deployment status [skip ci]'
          git push origin HEAD:main
