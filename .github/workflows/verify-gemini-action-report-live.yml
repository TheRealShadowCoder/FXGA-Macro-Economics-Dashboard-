name: Verify FXGA Gemini Action Report Live

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy FXGA Google Cloud Application"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: fxga-gemini-action-report-live
  cancel-in-progress: true

env:
  API_BASE: https://fxga-macro-dashboard-kbjj66blka-uc.a.run.app

jobs:
  verify-action-report:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Exercise exact live intelligence report request
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --connect-timeout 15 --max-time 180 \
            -o /tmp/action-report.sse \
            -w 'HTTP_STATUS=%{http_code}\n' \
            -X POST "${API_BASE}/api/gemini/chat-stream" \
            -H 'Content-Type: application/json' \
            -H 'Accept: text/event-stream' \
            --data '{"question":"Produce the current action report from stored intelligence, market, technical and event-risk evidence. Respect WAIT, WATCH and PREPARE states.","task":"live-intelligence-report"}'

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const raw = fs.readFileSync('/tmp/action-report.sse', 'utf8');
          let answer = '';
          let model = '';
          let promptChars = null;
          let promptCompacted = null;
          let error = '';
          const phases = [];
          for (const frame of raw.split(/\r?\n\r?\n/)) {
            const lines = frame.split(/\r?\n/);
            const event = (lines.find(line => line.startsWith('event: ')) || '').slice(7).trim();
            const dataText = lines.filter(line => line.startsWith('data: ')).map(line => line.slice(6)).join('\n');
            if (!event || !dataText) continue;
            let data;
            try { data = JSON.parse(dataText); } catch { continue; }
            if (event === 'status') {
              if (data.phase) phases.push(data.phase);
              if (Number.isFinite(Number(data.promptChars))) promptChars = Number(data.promptChars);
              if (typeof data.promptCompacted === 'boolean') promptCompacted = data.promptCompacted;
            }
            if (event === 'delta') answer += String(data.text ?? data.delta ?? data.content ?? '');
            if (event === 'done') {
              model = String(data?.result?.model || model || '');
              if (Number.isFinite(Number(data?.result?.promptChars))) promptChars = Number(data.result.promptChars);
              if (typeof data?.result?.promptCompacted === 'boolean') promptCompacted = data.result.promptCompacted;
            }
            if (event === 'error') error = String(data?.friendlyError?.title || data?.message || data?.error || 'stream error');
          }
          console.log(JSON.stringify({ model, promptChars, promptCompacted, phases, answerLength: answer.length, answerPreview: answer.slice(0, 1000) }, null, 2));
          if (error) throw new Error(error);
          if (!answer.trim()) throw new Error('No streamed answer text');
          if (!model || model.startsWith('fxga-local-')) throw new Error(`Gemini provider did not answer; model=${model || 'none'}`);
          if (/FXGA_TEST_/i.test(answer)) throw new Error('Synthetic FXGA_TEST record leaked into the AI answer');
          if (promptChars != null && promptChars > 32000) throw new Error(`Prompt budget regression: ${promptChars} chars`);
          NODE

      - name: Verification summary
        if: always()
        run: |
          echo '## FXGA Gemini Action Report Verification' >> "$GITHUB_STEP_SUMMARY"
          echo '- Uses the exact live-intelligence-report request that previously hit HTTP 429.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Requires a real Gemini model, streamed text, bounded evidence prompt and no FXGA_TEST records.' >> "$GITHUB_STEP_SUMMARY"
