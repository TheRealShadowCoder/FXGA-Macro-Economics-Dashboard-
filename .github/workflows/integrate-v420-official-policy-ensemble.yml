name: Integrate V4.20 Official Policy Ensemble

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/run-integrate-v420-official-policy-ensemble.trigger'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply v4.20 official policy ensemble
        run: |
          python3 scripts/apply_v420_official_policy_ensemble.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('cloud-run-collector/src/policy-calibration.js')
          t=p.read_text()
          t=t.replace("/^([A-Z]{3}):\\\\d{4}-\\\\d{2}-\\\\d{2}$/", "/^[A-Z]{3}:[0-9]{4}-[0-9]{2}-[0-9]{2}$/")
          p.write_text(t)
          PY
      - name: Promote integrated collector to 4.20.0
        run: |
          cd cloud-run-collector
          npm version 4.20.0 --no-git-tag-version --ignore-scripts
      - name: Validate collector and production dependency security
        run: |
          cd cloud-run-collector
          npm ci --ignore-scripts
          npm run check
          npm audit --omit=dev --audit-level=moderate
      - name: Verify all five official schedule parsers
        run: |
          cd cloud-run-collector
          node --input-type=module <<'NODE'
          import { officialPolicyScheduleParsers as p } from './src/official-policy-schedule.js';
          const fed='<html><body><h3>2026 FOMC Meetings</h3><div>September 15-16*</div><div>October 27-28</div><div>December 8-9*</div><h3>2025 FOMC Meetings</h3></body></html>';
          const ecb='<html><body><div>09/09/2026 Governing Council of the ECB: monetary policy meeting (Day 1)</div><div>10/09/2026 Governing Council of the ECB: monetary policy meeting (Day 2), followed by press conference</div><div>28/10/2026 Governing Council of the ECB: monetary policy meeting (Day 1)</div><div>29/10/2026 Governing Council of the ECB: monetary policy meeting (Day 2), followed by press conference</div></body></html>';
          const boe='<html><body><div>MPC Announcement and Minutes publication</div><table><tr><td>17 September 2026</td></tr><tr><td>5 November 2026</td></tr><tr><td>17 December 2026</td></tr></table><div>Notes to editors</div></body></html>';
          const sarb='<html><body><table><tr><td>2026/09/23 - 15:00</td><td>23 September 2026 press conference of the Monetary Policy Committee</td></tr><tr><td>2026/11/19 - 15:00</td></tr></table></body></html>';
          const boj='<html><body><h2>2026</h2><table><tr><td>Sept. 17 (Thurs.), 18 (Fri.)</td></tr><tr><td>Oct. 29 (Thurs.), 30 (Fri.)</td></tr><tr><td>Dec. 17 (Thurs.), 18 (Fri.)</td></tr></table><h2>2027</h2></body></html>';
          const results={fed:p.parseFedSchedule(fed,2026),ecb:p.parseEcbSchedule(ecb,2026),boe:p.parseBoeSchedule(boe,2026),sarb:p.parseSarbSchedule(sarb,2026),boj:p.parseBojSchedule(boj,2026)};
          const expected={fed:['2026-09-16','2026-10-28','2026-12-09'],ecb:['2026-09-10','2026-10-29'],boe:['2026-09-17','2026-11-05','2026-12-17'],sarb:['2026-09-23','2026-11-19'],boj:['2026-09-18','2026-10-30','2026-12-18']};
          for(const [id,dates] of Object.entries(expected)){const got=results[id].map(x=>x.decisionDate);if(JSON.stringify(got)!==JSON.stringify(dates))throw new Error(`${id} parser mismatch: ${JSON.stringify(got)} expected ${JSON.stringify(dates)}`);}
          if(results.fed[0].timePrecision!=='exact'||!results.fed[0].date.includes('T18:00:00.000Z'))throw new Error(`Fed 2pm ET conversion failed: ${JSON.stringify(results.fed[0])}`);
          if(results.sarb[0].timePrecision!=='exact'||!results.sarb[0].date.includes('T13:00:00.000Z'))throw new Error(`SARB 15:00 SAST conversion failed: ${JSON.stringify(results.sarb[0])}`);
          if(results.ecb[0].timePrecision!=='date-only'||results.boe[0].timePrecision!=='date-only'||results.boj[0].timePrecision!=='date-only')throw new Error('Date-only precision contract failed');
          console.log(JSON.stringify(results,null,2));
          NODE
      - name: Verify canonical policy meeting merge and scoring keys
        run: |
          cd cloud-run-collector
          node --input-type=module <<'NODE'
          import { mergePolicyCatalystEvents, policyDecisionKey } from './src/policy-catalyst-horizon.js';
          import { policyCalibrationMath } from './src/policy-calibration.js';
          const normal={id:'calendar-fed',currency:'USD',date:'2026-09-16T18:00:00.000Z',event:'Fed Interest Rate Decision',providers:['fxstreet'],source:'FXStreet',policyCatalystHorizonOnly:false,actual:'4.25%',previous:'4.50%'};
          const official={id:'official-policy-USD-2026-09-16',currency:'USD',date:'2026-09-16T18:00:00.000Z',policyDecisionDate:'2026-09-16',policyDecisionKey:'USD:2026-09-16',event:'Federal Reserve Interest Rate Decision',providers:['federal-reserve'],source:'Federal Reserve',policyCatalyst:true,policyCatalystHorizonOnly:true,policyScheduleOnly:true,timePrecision:'exact',policyProvenance:{provider:'federal-reserve',source:'Federal Reserve',sourceUrl:'official'}};
          const merged=mergePolicyCatalystEvents([normal],[official]);
          if(merged.length!==1)throw new Error(`Canonical meeting dedupe failed: ${merged.length}`);
          if(merged[0].policyCatalystHorizonOnly!==false||merged[0].policyScheduleOnly!==false)throw new Error('Normal calendar event lost task eligibility');
          if(merged[0].policyDecisionKey!=='USD:2026-09-16')throw new Error(`Canonical key missing: ${merged[0].policyDecisionKey}`);
          if(!merged[0].policyProvenanceSources?.some(x=>x.provider==='federal-reserve'))throw new Error('Official provenance lost during merge');
          if(policyDecisionKey(normal)!=='USD:2026-09-16')throw new Error('Policy decision key derivation failed');
          const legacy=policyCalibrationMath.enrichLeadMetadata({eventId:'old-id',currency:'USD',releaseAt:'2026-09-16T18:00:00Z',frozenAt:'2026-09-15T18:00:00Z',scored:false});
          const officialRow=policyCalibrationMath.enrichLeadMetadata({eventId:'official-id',policyDecisionKey:'USD:2026-09-16',currency:'USD',releaseAt:'2026-09-16T18:00:00Z',frozenAt:'2026-09-15T18:00:00Z',scored:false});
          if(legacy.derivedPolicyDecisionKey!==officialRow.derivedPolicyDecisionKey)throw new Error('Legacy and official rows do not share canonical decision key');
          const paired=policyCalibrationMath.pairedLeadComparison([{eventId:'official-old',policyDecisionKey:'USD:2026-09-16',currency:'USD',leadBucket:'early-45d',leadHours:600,scored:true,brier:.30,logLoss:.8,topCorrect:false},{eventId:'normal-new',policyDecisionKey:'USD:2026-09-16',currency:'USD',leadBucket:'14d',leadHours:250,scored:true,brier:.18,logLoss:.5,topCorrect:true}],'early-45d','14d');
          if(paired.pairs!==1||paired.averageBrierImprovement<=0)throw new Error(`Canonical paired comparison failed: ${JSON.stringify(paired)}`);
          console.log(JSON.stringify({merged:merged[0],legacyKey:legacy.derivedPolicyDecisionKey,paired},null,2));
          NODE
      - name: Verify precision and acquisition safety contract
        run: |
          grep -q "official-five-bank-policy-schedule-ensemble" cloud-run-collector/src/official-policy-schedule.js
          grep -q "federalreserve.gov" cloud-run-collector/src/official-policy-schedule.js
          grep -q "ecb.europa.eu" cloud-run-collector/src/official-policy-schedule.js
          grep -q "bankofengland.co.uk" cloud-run-collector/src/official-policy-schedule.js
          grep -q "resbank.co.za" cloud-run-collector/src/official-policy-schedule.js
          grep -q "boj.or.jp" cloud-run-collector/src/official-policy-schedule.js
          grep -q "policyScheduleOnly.*timePrecision==='date-only'.*leadHours<=24" cloud-run-collector/src/policy-calibration.js
          grep -q "canonical currency-date matching" cloud-run-collector/src/policy-calibration.js
          grep -q "collectOfficialPolicySchedule" cloud-run-collector/src/server-v2.js
          grep -q "scheduleReleaseTasks(events.filter((event)=>!event.policyCatalystHorizonOnly))" cloud-run-collector/src/server-v2.js
          grep -q "official central-bank schedule ensemble" cloud-run-collector/src/server-v2.js
          grep -q "time not asserted" src/components/PolicyEventResearchPanel.tsx
      - name: Verify production frontend build
        run: |
          cd "$GITHUB_WORKSPACE"
          npm install --progress=false
          npm run build
      - name: Commit validated v4.20 source and version
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud-run-collector/src/official-policy-schedule.js cloud-run-collector/src/policy-catalyst-horizon.js cloud-run-collector/src/server-v2.js cloud-run-collector/src/policy-path-research.js cloud-run-collector/src/policy-calibration.js cloud-run-collector/package.json cloud-run-collector/package-lock.json src/components/PolicyEventResearchPanel.tsx
          if git diff --cached --quiet; then echo 'No v4.20 changes to commit.'; exit 0; fi
          git commit -m 'Integrate official five-bank policy schedule ensemble v4.20.0'
          git pull --rebase origin main
          git push origin HEAD:main
