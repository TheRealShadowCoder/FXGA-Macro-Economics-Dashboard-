name: Configure FXGA 60 Day Event Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud-run-collector/src/event-study.js'
      - 'cloud-run-collector/src/event-study-backfill.js'
      - 'cloud-run-collector/src/calendar-history-60d.js'
      - 'cloud-run-collector/src/mt5-event-price-history.js'
      - '.github/workflows/configure-event-research-schedule.yml'

concurrency:
  group: fxga-event-research-schedule
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: fxglobalavengerstradingacademy
  GCP_REGION: us-central1
  COLLECTOR_SERVICE: fxga-macro-collector
  DEPLOY_SERVICE_ACCOUNT: fxga-github-deployer@fxglobalavengerstradingacademy.iam.gserviceaccount.com
  RUNTIME_SERVICE_ACCOUNT: fxga-collector-runtime@fxglobalavengerstradingacademy.iam.gserviceaccount.com
  SCHEDULER_JOB: fxga-event-study-backfill-60d

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - id: config
        name: Resolve Google authentication
        env:
          WIF_PROVIDER_SECRET: ${{ secrets.GCP_WIF_PROVIDER }}
          WIF_PROVIDER_VAR: ${{ vars.GCP_WIF_PROVIDER }}
        run: |
          set -euo pipefail
          WIF_PROVIDER="${WIF_PROVIDER_SECRET:-$WIF_PROVIDER_VAR}"
          test -n "$WIF_PROVIDER" || { echo '::error::GCP_WIF_PROVIDER is missing'; exit 1; }
          echo "wif_provider=$WIF_PROVIDER" >> "$GITHUB_OUTPUT"

      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: collector
        name: Resolve deployed collector
        run: |
          set -euo pipefail
          gcloud config set project "$GCP_PROJECT_ID"
          gcloud services enable run.googleapis.com cloudscheduler.googleapis.com
          SERVICE_URL=$(gcloud run services describe "$COLLECTOR_SERVICE" --region "$GCP_REGION" --format='value(status.url)')
          test -n "$SERVICE_URL" || { echo '::error::Collector Cloud Run URL is missing'; exit 1; }
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"

      - name: Configure daily 60-day event study backfill
        run: |
          set -euo pipefail
          BODY='{"days":60,"maxEvents":1200}'
          if gcloud scheduler jobs describe "$SCHEDULER_JOB" --location "$GCP_REGION" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "$SCHEDULER_JOB" \
              --location "$GCP_REGION" \
              --schedule='30 1 * * *' \
              --time-zone='Etc/UTC' \
              --uri="$SERVICE_URL/event-study-backfill" \
              --http-method=POST \
              --update-headers='Content-Type=application/json' \
              --message-body="$BODY" \
              --oidc-service-account-email="$RUNTIME_SERVICE_ACCOUNT" \
              --oidc-token-audience="$SERVICE_URL" \
              --attempt-deadline='900s'
          else
            gcloud scheduler jobs create http "$SCHEDULER_JOB" \
              --location "$GCP_REGION" \
              --schedule='30 1 * * *' \
              --time-zone='Etc/UTC' \
              --uri="$SERVICE_URL/event-study-backfill" \
              --http-method=POST \
              --headers='Content-Type=application/json' \
              --message-body="$BODY" \
              --oidc-service-account-email="$RUNTIME_SERVICE_ACCOUNT" \
              --oidc-token-audience="$SERVICE_URL" \
              --attempt-deadline='900s'
          fi

      - id: invoke
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ steps.config.outputs.wif_provider }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.collector.outputs.url }}
          id_token_include_email: true

      - name: Bootstrap available event-price history now
        env:
          TOKEN: ${{ steps.invoke.outputs.id_token }}
        run: |
          set -euo pipefail
          code=$(curl --max-time 900 -sS -o /tmp/event-study.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"days":60,"maxEvents":1200}' \
            "$SERVICE_URL/event-study-backfill")
          test "$code" -eq 200 || { cat /tmp/event-study.json; exit 1; }
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/event-study.json','utf8'));
          if(Number(r.days)!==60) throw new Error(`Expected 60-day backfill, received ${r.days}`);
          if(!Array.isArray(r.priceUniverse)||r.priceUniverse.length!==16) throw new Error('Expected all 16 Cross Asset instruments in event research');
          if(!Array.isArray(r.horizons)||!r.horizons.includes('1m')||!r.horizons.includes('24h')) throw new Error('Expanded event horizons are missing');
          console.log('60-day event research bootstrap:',JSON.stringify({calendarEvents:r.calendarEvents,candidates:r.candidateEvents,studiesTouched:r.studiesTouched,assetsMeasured:r.assetsMeasured,horizons:r.horizons}));
          NODE

      - name: Summary
        run: |
          echo "Collector: $SERVICE_URL"
          echo "Schedule: daily 01:30 UTC"
          echo "Calendar research window: 60 days"
          echo "Price source: canonical MetaTrader 5 M1 Firestore history"
          echo "Cross Asset universe: 16 website instruments"
          echo "Reaction horizons: 1m / 5m / 15m / 30m / 1h / 2h / 4h / 8h / 24h"
          echo "Derived event-study records persist independently of the rolling raw-price FIFO"
