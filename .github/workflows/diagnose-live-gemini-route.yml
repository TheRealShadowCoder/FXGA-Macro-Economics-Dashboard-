name: Diagnose Live FXGA Gemini Route

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-live-gemini-route.yml'

permissions:
  contents: read
  statuses: write

env:
  API_BASE: https://fxga-macro-dashboard-kbjj66blka-uc.a.run.app
  STATUS_CONTEXT: fxga/gemini-live-route-diagnostic

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Exercise light and heavy Gemini streaming tasks
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          post_status() {
            local state="$1"; local description="$2"; local payload
            description="$(printf '%s' "$description" | tr '\r\n' ' ' | cut -c1-140)"
            payload="$(jq -nc --arg state "$state" --arg context "$STATUS_CONTEXT" --arg description "$description" --arg target_url "$RUN_URL" '{state:$state,context:$context,description:$description,target_url:$target_url}')"
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -d "$payload" >/dev/null
          }

          post_status pending 'Testing light and heavy Gemini streaming tasks'
          nonce="${GITHUB_RUN_ID}-$(date -u +%s)"
          cat > /tmp/cases.tsv <<EOF
          system-health	conversation	Reply with a short greeting confirming Gemini is working. Diagnostic ${nonce}.
          action-report	program-chat	Produce the current FXGA action report from stored intelligence, market, technical and event-risk evidence. Respect WAIT, WATCH and PREPARE states. Diagnostic ${nonce}.
          cross-asset	cross-asset	Produce the current cross-asset market brief using the stored FXGA evidence. Diagnostic ${nonce}.
          macro	macro-analysis	Produce the current FXGA macro brief using only stored evidence. Diagnostic ${nonce}.
          event-study	event-study	Explain the current FXGA event-study evidence and validation maturity. Diagnostic ${nonce}.
          EOF

          failures=0
          while IFS=$'\t' read -r name task question; do
            [ -z "$name" ] && continue
            echo "===== CASE ${name} task=${task} ====="
            body="$(jq -nc --arg q "$question" --arg t "$task" '{question:$q,task:$t}')"
            status="$(curl -sS --connect-timeout 15 --max-time 180 -o "/tmp/${name}.sse" -w '%{http_code}' \
              -X POST "${API_BASE}/api/gemini/chat-stream" -H 'Content-Type: application/json' -H 'Accept: text/event-stream' --data "$body")"
            echo "HTTP_STATUS=${status}"
            NAME="$name" node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const name=process.env.NAME;
          const raw=fs.readFileSync(`/tmp/${name}.sse`,'utf8');
          let answer='',model='',error='',friendly=null; const phases=[];
          for(const frame of raw.split(/\r?\n\r?\n/)){
            const lines=frame.split(/\r?\n/);
            const event=(lines.find(x=>x.startsWith('event:'))||'').slice(6).trim();
            const dataText=lines.filter(x=>x.startsWith('data:')).map(x=>x.slice(5).trim()).join('\n');
            if(!event||!dataText)continue;
            let data; try{data=JSON.parse(dataText)}catch{continue}
            if(event==='status'&&data.phase)phases.push(data.phase);
            if(event==='delta')answer+=String(data.text??'');
            if(event==='done')model=String(data?.result?.model||'');
            if(event==='error'){friendly=data?.friendlyError||data;error=String(friendly?.title||data?.message||data?.error||'stream error')}
          }
          const out={name,phases,model,error,answerLength:answer.length,answerPreview:answer.slice(0,220),friendly};
          fs.writeFileSync(`/tmp/${name}.json`,JSON.stringify(out,null,2));
          console.log(JSON.stringify(out,null,2));
          NODE
            error="$(jq -r '.error // empty' "/tmp/${name}.json")"
            answer_len="$(jq -r '.answerLength // 0' "/tmp/${name}.json")"
            model="$(jq -r '.model // empty' "/tmp/${name}.json")"
            if [[ ! "$status" =~ ^2[0-9][0-9]$ || -n "$error" || "$answer_len" -le 0 ]]; then
              failures=$((failures+1))
              echo "::error::${name} failed status=${status} model=${model:-none} error=${error:-no-text}"
              echo 'RAW_RESPONSE_BEGIN'; cat "/tmp/${name}.sse"; echo; echo 'RAW_RESPONSE_END'
            fi
          done < /tmp/cases.tsv

          if [ "$failures" -gt 0 ]; then
            post_status failure "${failures} Gemini task(s) reproduced the empty/invalid response"
            exit 1
          fi
          post_status success 'All light and heavy Gemini streaming tasks returned usable text'
