name: Backfill FXGA Event Studies

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/event-study-backfill.trigger'

permissions:
  contents: read
  id-token: write

env:
  SERVICE: fxga-macro-collector
  GCP_REGION: ${{ vars.GCP_REGION || 'us-central1' }}

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - id: service
        name: Resolve private production data service
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          gcloud config set project "$PROJECT_ID"
          SERVICE_URL=$(gcloud run services describe "$SERVICE" --region "$GCP_REGION" --format='value(status.url)')
          test -n "$SERVICE_URL" || { echo '::error::Production data service missing'; exit 1; }
          echo "url=$SERVICE_URL" >> "$GITHUB_OUTPUT"
          echo "SERVICE_URL=$SERVICE_URL" >> "$GITHUB_ENV"

      - id: invoke
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
          token_format: id_token
          id_token_audience: ${{ steps.service.outputs.url }}
          id_token_include_email: true

      - name: Backfill persisted release reactions
        env:
          TOKEN: ${{ steps.invoke.outputs.id_token }}
        run: |
          for attempt in $(seq 1 20); do
            STATUS=$(curl --max-time 180 -sS -o /tmp/backfill.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H 'Content-Type: application/json' \
              -d '{"days":7,"maxEvents":120}' \
              "$SERVICE_URL/event-study-backfill" || true)
            echo "backfill attempt $attempt HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then break; fi
            if [ "$attempt" = "20" ]; then cat /tmp/backfill.json 2>/dev/null | head -c 2000; exit 1; fi
            sleep 15
          done
          cat /tmp/backfill.json
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/backfill.json','utf8'));
          if(!x.summary||typeof x.persistedMarketSnapshots!=='number')throw new Error('Backfill response contract missing');
          console.log(`Backfill: ${x.candidateEvents} candidate releases, ${x.persistedMarketSnapshots} market snapshots, ${x.measurementsWritten} horizon measurements, ${x.measured} measured.`);
          NODE

      - name: Publish event-study state to application
        env:
          TOKEN: ${{ steps.invoke.outputs.id_token }}
          WEBHOOK_SECRET: ${{ secrets.COLLECTOR_WEBHOOK_SECRET }}
        run: |
          curl --max-time 60 -fsS -H "Authorization: Bearer $TOKEN" "$SERVICE_URL/state" > /tmp/state.json
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const state=JSON.parse(fs.readFileSync('/tmp/state.json','utf8'));
          const payload=state?.eventStudies?.payload;
          if(!payload)throw new Error('Event-study state missing after backfill');
          const secret=process.env.WEBHOOK_SECRET,url='https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev/api/collector-webhook';
          const body=JSON.stringify({version:1,type:'event-study-snapshot',generatedAt:new Date().toISOString(),payload});
          const timestamp=String(Date.now()),requestId=crypto.randomUUID(),signature=crypto.createHmac('sha256',secret).update(`${timestamp}.${requestId}.${body}`).digest('hex');
          (async()=>{const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-FXGA-Timestamp':timestamp,'X-FXGA-Request-Id':requestId,'X-FXGA-Signature':`sha256=${signature}`},body});const text=await r.text();if(!r.ok)throw new Error(`event-study publish ${r.status}: ${text.slice(0,600)}`);console.log('event-study-snapshot published',r.status);})().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Verify public event-study API
        run: |
          node <<'NODE'
          const base='https://fxga-macro-intelligence-dashboard.caramel-snapper.workers.dev';
          (async()=>{const r=await fetch(base+'/api/event-studies?days=7',{headers:{Accept:'application/json','Cache-Control':'no-cache'}});if(!r.ok)throw new Error(`Public event studies ${r.status}`);const x=await r.json();if(!Array.isArray(x.studies)||!x.summary)throw new Error('Public event-study contract malformed');console.log(`PUBLIC EVENT STUDIES: ${x.studies.length} studies, ${x.summary.measuredHorizons||0} measured horizons.`);})().catch(e=>{console.error(e);process.exit(1)});
          NODE
