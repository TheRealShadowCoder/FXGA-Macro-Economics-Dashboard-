name: Finalize Intelligence V4.14

on:
  workflow_run:
    workflows: ['Apply Structural Break Source Minimal']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Require complete v4.14 intelligence source contract
        run: |
          set -euo pipefail
          CORE='cloud-run-collector/src/decision-intelligence-core.js'
          RESEARCH='cloud-run-collector/src/institutional-research.js'
          MEMORY='cloud-run-collector/src/decision-memory.js'
          UI='src/components/AdvancedGovernancePanel.tsx'

          for symbol in \
            'function reactionFunctionGapForPair' \
            'function crossAssetConfirmation' \
            'function evidenceCompletenessControls' \
            'function historicalAnalogueControls' \
            'function horizonCalibrationControls' \
            'function decisionChangeControls' \
            'function structuralBreakControls' \
            'function evidenceIndependenceControls' \
            'function transitionRiskControls' \
            'function triangleConsistency' \
            'function portfolioInteraction'; do
            grep -q "$symbol" "$CORE" || { echo "::error::Missing core contract: $symbol"; exit 1; }
          done

          for symbol in \
            'function buildEvidenceIndependence' \
            'function buildStructuralBreaks' \
            'function buildTurningPoints' \
            'function buildCatalystSequence' \
            'ensembleResiduals' \
            'residualQuantiles' \
            'persistence'; do
            grep -q "$symbol" "$RESEARCH" || { echo "::error::Missing research contract: $symbol"; exit 1; }
          done

          for symbol in 'featureVector:pairFeatureVector(pair)' 'analogueLibrary' 'decisionChanges'; do
            grep -q "$symbol" "$MEMORY" || { echo "::error::Missing decision-memory contract: $symbol"; exit 1; }
          done

          for symbol in 'Policy repricing' 'Cross asset' 'Evidence completeness' 'Structural stability' 'Historical analogues' 'Preferred horizon'; do
            grep -q "$symbol" "$UI" || { echo "::error::Missing visible governance UI: $symbol"; exit 1; }
          done

      - name: Validate collector and production dependency security
        working-directory: cloud-run-collector
        run: |
          npm install --ignore-scripts --no-fund
          npm run check
          npm audit --omit=dev --audit-level=moderate

      - name: Validate production dashboard
        run: |
          npm install
          npm run build

      - name: Promote v4.14 source versions and readiness marker
        run: |
          python3 <<'PY'
          import json
          from pathlib import Path

          pkg_path=Path('cloud-run-collector/package.json')
          pkg=json.loads(pkg_path.read_text())
          pkg['version']='4.14.0'
          pkg_path.write_text(json.dumps(pkg,indent=2)+'\n')

          core_path=Path('cloud-run-collector/src/decision-intelligence-core.js')
          core=core_path.read_text()
          if "version:'1.0.0'" in core:
              core=core.replace("version:'1.0.0'","version:'1.4.0'",1)
          elif "version:'1.4.0'" not in core:
              raise SystemExit('Decision-governance version anchor missing')
          core_path.write_text(core)
          PY
          mkdir -p .github
          cat > .github/intelligence-v414-source-ready.status <<EOF
          verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          contract=v4.14-source
          collector_version=4.14.0
          decision_governance_version=1.4.0
          reaction_function_gap=present
          cross_asset_confirmation=present
          evidence_completeness=present
          historical_analogues=present
          horizon_calibration=present
          decision_change_memory=present
          structural_breaks=present
          evidence_independence=present
          turning_points=present
          distributional_forecasts=present
          surprise_persistence=present
          catalyst_sequencing=present
          cross_pair_consistency=present
          portfolio_governance=present
          backend_check=passed
          dependency_audit=passed
          frontend_build=passed
          EOF

      - name: Commit final v4.14 promotion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloud-run-collector/package.json cloud-run-collector/package-lock.json cloud-run-collector/src/decision-intelligence-core.js .github/intelligence-v414-source-ready.status
          if git diff --cached --quiet; then
            echo 'V4.14 promotion already committed.'
          else
            git commit -m 'Finalize decision intelligence v4.14.0'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Dispatch production deployments explicitly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run deploy-cloud-run-collector.yml --ref main
          gh workflow run deploy.yml --ref main
          echo 'Dispatched Google Cloud data service and Cloudflare application deployments.'
